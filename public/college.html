<style>
/* College player page: the Recruiting Hub's player page (stats, shooting, game log, info),

.ps-main{max-width:1800px;margin:auto;padding:20px 24px 40px}
.ps-back{display:inline-block;font:11px var(--mono);letter-spacing:.06em;color:var(--muted);margin-bottom:20px}

.ps-bio{display:flex;align-items:center;justify-content:space-between;gap:36px;margin-bottom:26px;flex-wrap:wrap}
.ps-person{display:flex;align-items:center;gap:22px}
.ps-photo{width:132px;height:132px;border-radius:10px;background:var(--panel);border:1px solid var(--line);overflow:hidden;position:relative;flex:none}
.ps-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.ps-photo b{position:absolute;inset:0;display:grid;place-items:center;font:500 26px var(--mono);color:var(--dim)}
.ps-bio h1{font-size:30px;line-height:1.15;margin:0 0 8px}
.ps-bio p{font-size:13px;color:var(--dim);margin:3px 0;display:flex;align-items:center;gap:7px}
.ps-bio-stats{display:grid;grid-template-columns:repeat(4,78px);gap:16px;text-align:center}
.ps-bio-stats b{display:block;font:500 29px var(--mono);color:#fff}
.ps-bio-stats span{font:10px var(--mono);letter-spacing:.08em;color:var(--muted)}
.ps-bio-stats small{grid-column:span 4;font:10px var(--mono);color:var(--muted);letter-spacing:.04em}
.ps-nav{position:sticky;top:51px;z-index:30;display:flex;align-items:center;gap:22px;background:rgba(30,31,34,.97);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:14px;min-height:46px}
.ps-nav>span{font-weight:700;font-size:13px}
.ps-nav a{font-size:12.5px;color:var(--muted);padding:5px 0}
.ps-nav a:hover{color:#fff}
.ps-nav a[aria-current=location]{color:#fff;box-shadow:0 2px #f2f3f4}

.ps-title h2{font-size:18px;margin:0}
.ps-title h3{font-size:15px;font-weight:700;margin:0}
.ps-tag{border:1px solid var(--edge);color:var(--dim);font:10px var(--mono);letter-spacing:.06em;padding:3px 8px;border-radius:4px}
.ps-inline{display:flex;align-items:center;gap:6px;font:11px var(--ui);color:var(--dim)}
.ps-inline input{accent-color:#f2f3f4}
.ps-seg{display:flex;margin-left:auto;border:1px solid var(--edge);border-radius:6px;overflow:hidden}
.ps-seg button{background:none;border:0;color:var(--muted);font:11px var(--mono);padding:6px 11px;cursor:pointer}
.ps-seg button[aria-pressed=true]{background:var(--edge);color:#fff}
.ps-scroll{overflow-x:auto}
.ps-table{width:100%;border-collapse:collapse;font:400 11.5px var(--mono);white-space:nowrap}

.ps-table thead th{height:32px;border-bottom:1px solid var(--edge);padding:3px 8px}
.ps-table th:first-child{min-width:170px;text-align:left}
.ps-table.sumtab th:first-child{min-width:0;text-align:center}
.ps-table tbody th{padding:8px 6px;border-bottom:1px solid var(--line2);text-transform:none;letter-spacing:0;text-align:left}
.ps-table th button{background:none;border:0;color:inherit;font:inherit;text-align:inherit;cursor:pointer;letter-spacing:inherit;text-transform:inherit;padding:0}
.ps-table tbody th b{display:block;font:650 12px var(--ui);color:#fff}
.ps-table tbody th span{display:block;font:11px var(--ui);color:var(--muted);margin-top:2px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.ps-table td{text-align:center;padding:6px 7px;border-bottom:1px solid var(--line2);height:40px;min-width:48px;color:var(--soft);position:relative}
.ps-table td small{display:block;color:var(--muted);font-size:9.5px;line-height:1.3;min-height:11px;margin-top:2px}

.ps-table .is-metric{background:rgba(255,255,255,.035)}
.ps-table th.is-metric button{background:var(--edge);color:#fff;border-radius:3px;padding:2px 4px}
.ps-table .grp th{border:0;height:20px;font-size:8.5px;color:var(--faint)}
.ps-table tfoot th{border-top:1px solid var(--edge);padding:9px 6px;text-align:center}

.ps-table tfoot td{border-top:1px solid var(--edge);background:#232428}
.ps-more{display:block;margin:12px auto;background:none;border:0;color:var(--dim);font:11px var(--mono);cursor:pointer}
.ps-note{font-size:11px;color:var(--muted);margin:12px 0;line-height:1.55}
.ps-legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ps-legend i{display:inline-block;width:20px;height:6px;border-radius:2px}
.ps-controls{display:flex;gap:20px;margin-top:18px;flex-wrap:wrap}
.ps-controls label{display:flex;gap:8px;align-items:center;font:10px var(--mono);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.ps-pair{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:22px}
.ps-chart{min-width:0}
.ps-chart h3{font-size:15px;font-weight:700;margin:0 0 3px}
.ps-chart p{font:10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.ps-chart svg{width:100%;overflow:visible;display:block}
.ps-chart svg text{font-family:var(--mono);fill:#8a8e95;font-size:9px;user-select:none}
.grid-l{stroke:rgba(255,255,255,.05);stroke-width:1}
.box{stroke:#3a3d42;stroke-width:2;fill:#2a2c30}

.pline{fill:none;stroke:#f2f3f4;stroke-width:1.6}
.pdot{fill:#f2f3f4;stroke:#f2f3f4}
.gdot{fill:#8a8e95}
.gdot.nd{fill:none;stroke:#61656c}
.stem{stroke:rgba(255,255,255,.08);stroke-width:1}
.refl{stroke:#8a8e95;stroke-width:1;stroke-dasharray:4 4}
.vol rect{fill:#3a3d42;cursor:pointer}.vol rect:hover{fill:#8a8e95}

.ps-game thead th:first-child{z-index:6;background:#232428}

.ps-game i{font-style:normal;font-size:10px;margin-left:6px}

.ps-info div{background:var(--card);border-radius:8px;padding:10px 12px;min-width:0}
.ps-info span{display:block;font:10px var(--mono);letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.ps-info b{display:block;font-size:14px;margin-top:4px;color:#fff;overflow:hidden;text-overflow:ellipsis}
.ps-info a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.notes{margin-top:22px}
.notes h3{font-size:15px;margin-bottom:4px}
.notes .sub{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.note{background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.note .who{font:10px var(--mono);letter-spacing:.07em;color:var(--dim);text-transform:uppercase;display:flex;gap:6px;align-items:center}

.note .who button:hover{color:#fff}

.nempty{border:1px dashed var(--edge);border-radius:8px;padding:14px;text-align:center;font-size:12px;color:var(--muted)}
.nform{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.nform textarea{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--edge);border-radius:7px;color:var(--text);font:13px var(--ui);padding:9px 10px;outline:none;resize:vertical}
.nform .row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.nform input{height:32px;background:var(--bg);border:1px solid var(--edge);border-radius:7px;color:var(--text);font:600 12px var(--ui);padding:0 10px;outline:none;width:180px}
.btn{height:32px;background:#f2f3f4;color:#16171a;border:0;border-radius:7px;font:700 12px var(--ui);padding:0 14px;cursor:pointer;margin-left:auto}
.btn[disabled]{opacity:.4;cursor:default}
.err{background:#2a2226;border:1px solid #4a3036;color:#f0b4bd;border-radius:7px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.err button{margin-left:8px;background:none;border:1px solid #6b4a50;color:#f0b4bd;border-radius:5px;padding:2px 8px;cursor:pointer}
@media (max-width:900px){.ps-pair{grid-template-columns:1fr}.ps-nav{gap:14px;flex-wrap:wrap}.ps-nav>span{display:none}.ps-bio{align-items:flex-start;flex-direction:column;gap:18px}.ps-bio-stats{width:100%;grid-template-columns:repeat(4,1fr);gap:8px}.ps-info{grid-template-columns:repeat(2,minmax(0,1fr))}.ps-court-wrap{grid-template-columns:1fr}.ps-main{padding:16px 16px 32px}.ps-panel{padding:14px 10px}}
@media (max-width:500px){.ps-photo{width:92px;height:92px}.ps-bio h1{font-size:24px}.ps-nav label{margin-left:0}.ps-foot{flex-direction:column}}
</style>

const gfields = [["minutes", "MIN"], ["points", "PTS"], ["ts_pct", "TS%"], ["rebounds", "REB"], ["assists", "AST"], ["steals", "STL"], ["blocks", "BLK"], ["turnovers", "TOV"], ["ft", "FT"], ["ft_pct", "FT%"], ["fg_attempted", "FGA"], ["efg_pct", "eFG%"], ["two", "2P"], ["two_pct", "2P%"], ["three", "3P"], ["three_pct", "3P%"]];

  ${subset.length ? `<tfoot><tr><th><b>${st.range ? `Last ${subset.length}` : "Season"}</b><span>${subset.length} GP · averages</span></th>${gfields.map(([k]) => `<td>${cell(totals, k, true)}${!k.endsWith("_pct") && !["ft", "two", "three"].includes(k) ? `<small>${totals[k] ?? "—"}</small>` : ""}</td>`).join("")}</tr></tfoot>` : ""}</table></div>

// ---------------------------------------------------------------- events

function updateMapInfo() {

  const sg = new Map(seasonGames().map((g) => [String(g.game_id), g])); let rec = 0; for (const [gid, c] of Object.entries(d.profile.games || {})) { const g = sg.get(gid); if (g && c[0] === g.fg_made && c[1] === g.fg_attempted && c[2] === g.three_made && c[3] === g.three_attempted) rec++; }
  box.innerHTML = mapInfo(d.profile, d, rec, st.shotMode === "density" ? "linear-gradient(90deg,rgba(242,243,244,.08),rgba(242,243,244,.93))" : "linear-gradient(90deg,#4a7fe0,#5d6168,#e2622a)");
