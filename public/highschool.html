<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>High School · Bronco IQ</title>
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/68.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
/* High School board: every high school prospect we're tracking. The same players show on the Recruit Map. */
.hwrap{max-width:1560px;margin:auto;padding:18px 24px 30px}
.htop{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.htop h1{margin-top:4px}.htop .sub{font-size:13px;color:var(--muted);margin-top:3px;max-width:820px;line-height:1.5}
.hbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.hbar input{background:var(--card);border:1px solid var(--edge);border-radius:7px;color:#fff;font:13px var(--ui);padding:7px 10px;min-width:220px}
.seg3{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg3 button{background:none;border:0;color:var(--muted);font:11px var(--mono);padding:7px 11px;cursor:pointer}
.seg3 button.on{background:var(--edge);color:#fff}
.hbar .n{margin-left:auto;font:11px var(--mono);color:var(--muted)}
.hp{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.ht{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px}
.ht th{font:500 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
.ht th.l,.ht td.l{text-align:left}
.ht th button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}.ht th button:hover,.ht th button.on{color:#fff}
.ht td{padding:8px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
.ht tr.row{cursor:pointer}.ht tr.row:hover td{background:rgba(255,255,255,.03)}.ht tr.open td{background:rgba(255,255,255,.05)}
.pp{display:flex;align-items:center;gap:10px;min-width:0}
.pp .ph{width:38px;height:46px;border-radius:6px;background:var(--card);overflow:hidden;flex:none}.pp .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.pp b{font-weight:650;color:#fff;display:block}.pp .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.st{font:500 10px var(--mono);letter-spacing:.05em;color:var(--dim)}
.det td{white-space:normal;text-align:left;background:#1a1b1e;padding:14px 16px 16px}
.dg{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
.dg dl{display:grid;grid-template-columns:84px minmax(0,1fr);gap:6px 10px;margin:0;font-size:12.5px;line-height:1.45}
.dg dt{font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.dg dd{margin:0;color:var(--soft)}
.dg .note{font-size:12.5px;color:var(--dim);line-height:1.55}
.lk a{display:inline-block;margin:0 14px 6px 0;font:11px var(--mono);color:var(--dim)}.lk a:hover{color:#fff}
.mapbtn{display:inline-block;margin-top:10px;background:var(--card);border:1px solid var(--edge);border-radius:7px;color:var(--soft);font:500 12px var(--ui);padding:6px 11px}
.mapbtn:hover{color:#fff;border-color:#8a8e95}
@media (max-width:900px){.dg{grid-template-columns:1fr}.hwrap{padding:16px 16px 28px}}
</style>
</head>
<body>
<main class="hwrap" id="page"><div class="loading">Loading the high school board…</div></main>
<script type="module">
import { topBar, esc, pc } from "/assets/core.js";
topBar("highschool");

const [B, FR] = await Promise.all([fetch("/data/hs/board.json").then((r) => r.json()), fetch("/data/rankings/freshmen-2026-27.json").then((r) => r.json()).catch(() => null)]);
const slug = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]+/g, "-").replace(/^-|-$/g, "");
const inch = (h) => { const m = String(h || "").match(/(\d+)\D+(\d+)/); return m ? +m[1] * 12 + +m[2] : null; };
// Projected freshman impact per 100 possessions vs. an average D-I player: the Win model's freshman
// terms (247 rank + height), learned from 10 recruiting classes. Unranked prospects get no number.
const proj = (p) => (FR?.map && p.r247 && inch(p.ht) ? FR.map.intercept + FR.map.log_rank * Math.log(p.r247) + FR.map.height_in * inch(p.ht) : null);
const POSG = (p) => (/C|PF/.test(p) && !/SF\/PF/.test(p) ? "B" : /SF/.test(p) ? "W" : "G");
const P = B.players.map((p) => ({ ...p, slug: slug(p.name), pg: POSG(p.pos || ""), proj: proj(p) }));
const st = { q: "", pos: "all", cls: "all", sort: "r247", dir: 1, open: location.hash.slice(1) || null };
const classes = [...new Set(P.map((p) => p.cls))].sort();
const page = document.getElementById("page");
const rk = (v) => (v ? "#" + v : `<span style="color:var(--faint)">—</span>`);
const sg = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
const COLS = [["name", "Player", "l"], ["pos", "Pos", "l"], ["ht", "Ht", ""], ["wt", "Wt", ""], ["cls", "Class", ""], ["state", "Where", "l"], ["r247", "247", ""], ["rOn3", "On3 Ind.", ""], ["rEspn", "ESPN", ""], ["rRivals", "Rivals", ""], ["proj", "Proj. Fr impact", ""], ["status", "Status", "l"]];
const DEF = { proj: "frproj", r247: "r247" };

function rows() {
  const q = st.q.toLowerCase();
  return P.filter((p) => (st.pos === "all" || p.pg === st.pos) && (st.cls === "all" || String(p.cls) === st.cls) && (!q || `${p.name} ${p.full || ""} ${p.school} ${p.city}`.toLowerCase().includes(q)))
    .sort((a, b) => {
      const k = st.sort, x = k === "ht" ? inch(a.ht) : a[k], y = k === "ht" ? inch(b.ht) : b[k];
      if (x == null && y == null) return a.name.localeCompare(b.name); if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * st.dir;
    });
}
function detail(p) {
  const L = (l, a) => (a?.length ? `<dt>${l}</dt><dd>${a.map(esc).join(" · ")}</dd>` : "");
  return `<tr class="det"><td colspan="${COLS.length}"><div class="dg">
    <dl><dt>School</dt><dd>${esc(p.school)} · ${esc(p.city)}</dd>${p.full ? `<dt>Full name</dt><dd>${esc(p.full)}</dd>` : ""}${p.home ? `<dt>Hometown</dt><dd>${esc(p.home)}</dd>` : ""}${p.prev ? `<dt>Before</dt><dd>${esc(p.prev)}</dd>` : ""}${p.club ? `<dt>Club</dt><dd>${esc(p.club)}</dd>` : ""}${p.pr ? `<dt>Position rk</dt><dd>${esc(p.pr)}</dd>` : ""}${p.on3 ? `<dt>On3 rating</dt><dd>${p.on3}</dd>` : ""}</dl>
    <dl><dt>Status</dt><dd>${esc(p.status || "—")}</dd>${L("Finalists", p.finalists)}${L("Offers", p.offers)}${L("Contacts", p.contacts)}</dl>
    <div>${p.notes ? `<div class="note">${esc(p.notes)}</div>` : ""}<div class="note" style="margin-top:8px">${p.proj != null ? `Projected freshman impact <b style="color:#fff">${sg(p.proj)}</b> per 100 possessions vs. an average D-I player (Win model freshman terms: 247 rank #${p.r247}, ${esc(p.ht)}). This feeds the Roster Builder when you add him.` : "No national ranking, so no model projection: the Roster Builder uses the average-freshman estimate for him."}</div>
      <div class="lk" style="margin-top:10px">${Object.entries(p.links || {}).map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>
      <a class="mapbtn" href="/international#${p.slug}">Show on the Recruit Map →</a>
      <div class="note" style="margin-top:10px;font-size:11px;color:var(--muted)">Sources: ${esc(p.src || "")}</div></div>
  </div></td></tr>`;
}
function render() {
  const R = rows();
  page.innerHTML = `<div class="htop"><div><div class="label">Recruiting · High school</div><h1>High School</h1>
      <div class="sub">Every high school prospect on our board. Click a row for his schools, offers and links; every player here also shows on the <a href="/international" style="color:var(--soft);text-decoration:underline">Recruit Map</a> with the international prospects. To add a player, ask Claude to add him by name.</div></div></div>
    <div class="hbar"><input id="q" placeholder="Search player, school or city" value="${esc(st.q)}">
      <div class="seg3" id="pos">${[["all", "All"], ["G", "Guards"], ["W", "Wings"], ["B", "Bigs"]].map(([k, l]) => `<button data-k="${k}" class="${st.pos === k ? "on" : ""}">${l}</button>`).join("")}</div>
      ${classes.length > 1 ? `<div class="seg3" id="cls">${[["all", "All classes"], ...classes.map((c) => [String(c), String(c)])].map(([k, l]) => `<button data-k="${k}" class="${st.cls === k ? "on" : ""}">${l}</button>`).join("")}</div>` : ""}
      <span class="n">${R.length} of ${P.length} players · class of ${classes.join(", ")}</span></div>
    <div class="hp"><table class="ht"><thead><tr>${COLS.map(([k, l, c]) => `<th class="${c}"><button data-sort="${k}" class="${st.sort === k ? "on" : ""}">${DEF[k] ? `<span data-def="${DEF[k]}">${l}</span>` : l}${st.sort === k ? (st.dir > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}</tr></thead><tbody>
    ${R.map((p) => `<tr class="row${st.open === p.slug ? " open" : ""}" data-s="${p.slug}" id="${p.slug}">
      <td class="l"><div class="pp"><span class="ph">${p.headshot ? `<img alt="" loading="lazy" src="${esc(p.headshot)}" onerror="this.remove()">` : ""}</span><div><b>${esc(p.name)}</b><div class="s">${esc(p.school)}</div></div></div></td>
      <td class="l">${esc(p.pos || "—")}</td><td>${esc(p.ht || "—")}</td><td>${p.wt ?? "—"}</td><td>${p.cls}</td><td class="l">${esc(p.city)}</td>
      <td>${rk(p.r247)}</td><td>${rk(p.rOn3)}</td><td>${rk(p.rEspn)}</td><td>${rk(p.rRivals)}</td>
      <td>${p.proj == null ? `<span style="color:var(--faint)">—</span>` : `<span class="chip" style="background:${pc(50 + Math.max(-45, Math.min(45, p.proj * 9)))}">${sg(p.proj)}</span>`}</td>
      <td class="l"><span class="st">${esc(p.finalists ? `Finalists: ${p.finalists.length} schools` : p.status || "—")}</span></td></tr>${st.open === p.slug ? detail(p) : ""}`).join("") || `<tr><td colspan="${COLS.length}" class="l" style="color:var(--muted)">No players match.</td></tr>`}
    </tbody></table></div>
    <div class="cap">Rankings are each service's national rank for the class (247 = 247Sports, On3 Ind. = On3 Industry ranking). Proj. Fr impact = what the Win model expects in his freshman season, per 100 possessions vs. an average D-I player, from his 247 rank and height; ranks 26-100 look much alike as freshmen and separate later. Orange = better, blue = worse.</div>`;
  const q = document.getElementById("q"); q.oninput = () => { st.q = q.value; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(st.q.length, st.q.length); };
  page.querySelectorAll("#pos button").forEach((b) => (b.onclick = () => { st.pos = b.dataset.k; render(); }));
  page.querySelectorAll("#cls button").forEach((b) => (b.onclick = () => { st.cls = b.dataset.k; render(); }));
  page.querySelectorAll("th button").forEach((b) => (b.onclick = () => { const k = b.dataset.sort; if (st.sort === k) st.dir *= -1; else { st.sort = k; st.dir = ["r247", "rOn3", "rEspn", "rRivals", "name", "pos", "state", "status", "cls"].includes(k) ? 1 : -1; } render(); }));
  page.querySelectorAll("tr.row").forEach((r) => (r.onclick = (e) => { if (e.target.closest("a")) return; st.open = st.open === r.dataset.s ? null : r.dataset.s; history.replaceState(null, "", st.open ? "#" + st.open : location.pathname); render(); }));
}
render();
if (st.open) document.getElementById(st.open)?.scrollIntoView({ block: "center" });
</script>
</body>
</html>
