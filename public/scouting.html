<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scouting · Bronco IQ</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/68.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">

<style>
/* SITE CONVENTION: orange = good / high percentile, blue = bad / low percentile (for the team on the page) */
:root{--bg:#16171a;--panel:#1e1f22;--card:#26282c;--line:#2e3034;--text:#f2f3f4;--muted:#8a8e95;--good:#e2622a;--bad:#4a7fe0;--ui:'Inter Tight Variable',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:auto;padding:0 24px 28px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.otop{border-bottom:1px solid var(--line);background:var(--bg)}
.obrand{display:flex;align-items:center;gap:10px;padding:14px 24px 6px;max-width:1280px;margin:auto}
.obrand b{font-weight:700;font-size:15px}
.otabs{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px 4px;padding:4px 24px 0;max-width:1280px;margin:auto}
.tab{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:center;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--ui);font-size:11.5px;padding:6px 2px 7px;cursor:pointer;text-align:center;line-height:1.2}
.tab>span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:1100px){.otabs{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}}
.tab small{display:block;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:9px;letter-spacing:0;color:#61656c}
.tab.on{color:#fff;border-bottom-color:#f2f3f4}.tab.on small{color:#d6d8db}
.tab:hover{color:#d6d8db}
.tab.sample{background:rgba(255,255,255,.035);border-radius:6px 6px 0 0}
.tab.sample small{color:#9aa0a8}
.lg{position:relative;display:inline-flex;flex:none;align-items:center;justify-content:center}
.lg img{width:100%;height:100%;object-fit:contain}
.lg b{display:none;width:100%;height:100%;border-radius:50%;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:500;color:#fff;background:#3a3d42}
.lg.fb b{display:flex}
.cf{display:inline-flex;align-items:center;gap:6px;background:#eceef0;color:#1e1f22;border-radius:5px;padding:3px 8px 3px 4px;font-size:11.5px;font-weight:600}
.cf img{height:18px;width:18px;object-fit:contain}
.kp{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid #3a3d42;border-radius:5px;padding:3px 8px;font-size:11.5px;color:#cfd3d9}
.kp img{width:14px;height:14px;border-radius:2px}
.kp b{color:#fff;font-weight:700}
h1{font-size:30px;font-weight:750;letter-spacing:-.02em}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
section{margin-top:26px}
.shead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.ptitle{margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.cap{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
.story{margin-top:10px;font-size:14px;color:#cfd3d9;line-height:1.55;max-width:1020px}
.story b{color:var(--text)}
[data-def]{cursor:help;text-decoration:underline dotted rgba(138,142,149,.6);text-underline-offset:3px}
svg [data-def]{text-decoration:none}
.hero{display:grid;grid-template-columns:1.1fr 2fr;gap:16px;margin-top:18px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:3px 7px;border-radius:4px;background:#3a3d42;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border-radius:8px;padding:12px}
.kpi>b{display:block;font-size:24px;font-weight:750;margin-top:4px}
.kpi .sub b{color:#fff;font-weight:600}
.kpi .sub{font-size:11.5px;color:#b9bdc4;margin-top:3px;line-height:1.4}
.chip{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:2px 6px;font-family:var(--mono);font-size:11px;font-weight:500;color:#fff}
.depth{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pos{display:flex;flex-direction:column;gap:8px}
.pos .ph{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;padding:0 2px}
.pc{background:var(--card);border-radius:8px;padding:10px 10px 9px;border:1px solid transparent}
.pc.st{border-color:#3e4146;background:#2b2d32}
.pc .nm{font-size:13.5px;font-weight:650;line-height:1.2;display:flex;justify-content:space-between;gap:6px}
.pc .nm span{font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--muted)}
.pc .meta{font-size:11px;color:#9aa0a8;margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.07em;padding:1px 5px;border-radius:3px;border:1px solid #4a4d53;color:#c9ccd2}
.tag.new{border-color:#6b4a3a;color:#f0a27d}.tag.fr{color:#9aa0a8}
.tag.staff{border-color:#8a8e95;color:#fff;background:#3a3d42}
.shr{display:flex;gap:2px;margin-top:7px}
.shr i{flex:1;font-style:normal;text-align:center;font-family:var(--mono);font-size:8.5px;letter-spacing:.03em;color:#8a8e95;background:#34363b;border-radius:2px;padding:1px 0}
.shr i.me{outline:1px solid #f2f3f4;outline-offset:1px}
.pc .nm>span{display:flex;align-items:center;gap:6px;position:relative}
.rpos{position:relative;display:inline-flex;align-items:center;gap:4px}
.mv{background:#34363b;border:0;border-radius:4px;color:#cfd3d9;font:9.5px var(--mono);padding:2px 5px;cursor:pointer}
.mv:hover{background:#4a4d53;color:#fff}
.mvm{position:fixed;z-index:60;background:#1e1f22;border:1px solid #3a3d42;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:4px;display:grid;gap:2px;min-width:140px}
.mvm button{background:none;border:0;text-align:left;color:#cfd3d9;font:12px var(--mono);padding:6px 10px;border-radius:5px;cursor:pointer}
.mvm button:hover{background:#26282c;color:#fff}.mvm button.on{background:#3a3d42;color:#fff}.mvm button.auto{color:#8a8e95;border-top:1px solid #2e3034;border-radius:0 0 5px 5px}
.mbar{height:5px;border-radius:3px;background:#34363b;margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%}
.pc .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-top:6px;font-size:11px;color:#b9bdc4}
.pc .row>span{white-space:nowrap}
.pc .row .xs{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted)}
.pc .row b{color:#fff;font-weight:600}
.lgrp{margin-bottom:12px}
.lrow{display:grid;grid-template-columns:18px 1fr 52px 70px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid #2a2c30}
.lrow .r,.lrow .ls{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.lrow .v{font-weight:700;text-align:right}.lrow .ls{text-align:right}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tgrid svg{width:100%;display:block;background:var(--card);border-radius:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{background:var(--card);border-radius:8px;padding:13px;border-left:3px solid #4a4d53}
.key h3{font-size:14px;font-weight:700;margin-top:4px;line-height:1.3}
.key p{font-size:12.5px;color:#c4c8ce;line-height:1.5;margin-top:6px}.key p b{color:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
th.grp{text-align:center;border-bottom:1px solid #3a3d42;padding-bottom:5px;color:#b9bdc4}
td{padding:6px 5px;border-bottom:1px solid #2a2c30;text-align:right;white-space:nowrap}
td.m{color:var(--muted)}
.sep{border-left:1px solid #34363b}
tr:hover td{background:rgba(255,255,255,.025)}
.tl{display:flex;align-items:center;gap:7px}
.banner{margin-top:16px;background:#24262a;border:1px dashed #4a4d53;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#cfd3d9}
.ph-empty{padding:60px 20px;text-align:center;color:var(--muted)}
.g-depth{grid-template-columns:1fr}
/* ---- shell: opponent strip, left rail, sections ---- */
.otabs{display:flex!important;flex-wrap:wrap;justify-content:space-between;gap:2px;max-width:1440px!important;padding:2px 24px 0!important}
.otabs .tab{width:auto!important;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 6px!important;border-bottom:2px solid transparent;opacity:.62;transition:opacity .12s}
.otabs .tab:hover{opacity:1}.otabs .tab.on{opacity:1;border-bottom-color:#f2f3f4}
.otabs .tab small{font-family:var(--mono);font-size:8.5px;color:#8a8e95;letter-spacing:0;white-space:nowrap}
.otabs .tab.on small{color:#fff}
.otabs .tab.sample{background:none;border-right:1px solid var(--line);padding-right:12px!important;margin-right:6px}
.obrand{max-width:1440px!important}
.scout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:30px;max-width:1440px;margin:0 auto;padding:0 24px 30px}
.rail{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 70px);overflow-y:auto;scrollbar-width:none;padding:20px 0 12px}
.rail::-webkit-scrollbar{display:none}
.rteam{display:flex;gap:10px;align-items:center}
.rname{font-size:18px;font-weight:750;letter-spacing:-.01em;line-height:1.15;margin-top:2px}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rwin{margin-top:16px}
.rseason{margin-top:14px}
.rseason .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.rseason .seg button{padding:8px 6px;font-size:11px;font-weight:500}
.rseason .lock{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;border:1px solid var(--line);border-radius:7px;padding:7px 9px;text-align:center}
.ysched{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;margin-top:10px}
.ysched div{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line2)}
.ysched .m{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:44px}
.ysched b.w{color:#f08a5d}.ysched b.l{color:#7fa6f0}
.rwin .tdwin{display:grid;grid-template-columns:1fr 1fr;width:100%}
.rwin .tdwin button{padding:7px 6px;font-size:10.5px;border-bottom:1px solid var(--line)}
.rwin .tdwin button:first-child{grid-column:1/-1}
.rwin .tdd1 button:first-child{grid-column:auto}
.rnav{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.rnav button{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;border-left:2px solid #2e3034;padding:8px 10px;cursor:pointer;color:var(--muted)}
.rnav button b{font-family:var(--ui);font-size:14px;font-weight:650;color:#b9bdc4}
.rnav button span{font-family:var(--mono);font-size:10.5px;color:#7d8189;min-height:13px}
.rnav button:hover b{color:#fff}
.rnav button.on{border-left-color:#f2f3f4;background:rgba(255,255,255,.035)}
.rnav button.on b{color:#fff}.rnav button.on span{color:#cfd3d9}
.smain{min-width:0;padding-top:6px}
.ssec{scroll-margin-top:70px;padding-top:22px}
.ssec+.ssec{margin-top:18px;border-top:1px solid #34363b}
.sh{font-size:24px;font-weight:750;letter-spacing:-.02em;margin-bottom:4px}
.ssec>section:first-of-type,.ssec>.hero:first-of-type{margin-top:12px}
.rktile{grid-column:span 2}
.rkrow{grid-template-columns:repeat(4,1fr);margin-top:12px}
.rkg{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:8px}
.rkc{min-width:0}
.rkh{display:flex;align-items:center;gap:5px;font-size:11px;color:#b9bdc4;white-space:nowrap}.rkh img{width:13px;height:13px;border-radius:2px}
.rkc>b{display:block;font-size:24px;font-weight:750;margin-top:3px}
.rks{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.rkrow{grid-template-columns:1fr 1fr}}
.note{background:#24262a;border:1px dashed #4a4d53;border-radius:8px;padding:12px;font-size:13px;color:#cfd3d9}
@media (max-width:1050px){
 .scout{grid-template-columns:minmax(0,1fr);gap:0;padding:0 16px 24px}
 .smain .grid{grid-template-columns:minmax(0,1fr)!important}
 .smain .hero{grid-template-columns:minmax(0,1fr)}
 .rwin .tdwin{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;max-width:100%}
 .rwin .tdwin button{flex:none}
 .rail{position:sticky;top:52px;z-index:25;max-height:none;overflow:visible;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
 .rteam,.rchips{display:none}
 .rseason{margin-top:0;margin-bottom:8px}
 .rwin{margin-top:0}.rwin .tdwin{display:flex;width:auto}.rwin .tdwin button:first-child{grid-column:auto}.rwin .label{display:none}
 .rnav{flex-direction:row;overflow-x:auto;scrollbar-width:none;margin-top:8px;gap:4px}
 .rnav::-webkit-scrollbar{display:none}
 .rnav button{flex:none;border-left:0;border-bottom:2px solid transparent;padding:6px 10px}
 .rnav button span{display:none}
 .rnav button.on{border-bottom-color:#f2f3f4}
 .otabs{justify-content:flex-start}
}
@media (max-width:600px){.smain .kpis{grid-template-columns:1fr 1fr}.smain .panel{overflow-x:auto}.sh{font-size:21px}}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 24px}
.lgrid .lrow{grid-template-columns:14px minmax(0,1fr) 46px 50px;gap:6px}
.lgrid .lrow>span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-two{grid-template-columns:1fr 1fr}
.g-two>.panel{min-width:0;overflow-x:auto}.g-depth>.panel{min-width:0}
@media (max-width:1180px){
  .hero{grid-template-columns:1fr}
  .g-depth,.g-two{grid-template-columns:1fr}
}
@media (max-width:760px){
  .wrap{padding:0 16px 24px}
  .obrand{padding:12px 16px 6px;flex-wrap:wrap}
  .otabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:4px 16px 0}
  .otabs::-webkit-scrollbar{display:none}
  .otabs .tab{flex:none;width:96px}
  h1{font-size:24px}
  .kpis{grid-template-columns:1fr 1fr}
  .depth{grid-template-columns:repeat(5,minmax(150px,1fr))}
  .g-depth>.panel:first-child{overflow-x:auto}
  .tgrid{grid-template-columns:1fr 1fr}
  .keys{grid-template-columns:1fr}
  .panel{overflow-x:auto}
}
footer{color:var(--muted);font-size:11px;line-height:1.6;margin-top:22px}
</style>
</head>

</div>

<script type="module">
import { d3, addDefs, tipOn, tipOff, topBar, sortableTable } from "/assets/core.js";
import { renderTeamData } from "/assets/teampage.js";
topBar("scouting");
const GOOD="#e2622a",BAD="#4a7fe0",NEU="#5d6168";
const pc=p=>p==null?NEU:p>=50?d3.interpolateLab(NEU,"#d4561f")(Math.min(1,(p-50)/45)):d3.interpolateLab(NEU,"#2f63d6")(Math.min(1,(50-p)/45));
// id = ESPN team id, or a path to a local logo (D-II/NAIA opponents ESPN doesn't carry).
const LG=(id,s,ab)=>`<span class="lg${id?'':' fb'}" style="width:${s}px;height:${s}px">${id?`<img alt="" src="${typeof id==="string"?id:`https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500-dark/${id}.png&w=${s*2}&h=${s*2}`}" onerror="this.parentNode.classList.add('fb');this.remove()">`:''}<b>${ab||''}</b></span>`;
const CF=(k,n)=>`<span class="cf"><img alt="" src="https://a.espncdn.com/i/teamlogos/ncaa_conf/500/${k}.png" onerror="this.remove()">${n}</span>`;
// Preseason 2026-27 team rankings (pulled Oct 18, 2026): Barttorvik T-Rank and EvanMiya.

const XR={"Washington": {"tr": 73, "tr26": 53, "em": 68}, "Butler": {"tr": 88, "tr26": 66, "em": 95}, "Oakland": {"tr": 225, "tr26": 182, "em": 220}, "Nebraska": {"tr": 15, "tr26": 17, "em": 26}, "Sam Houston": {"tr": 182, "tr26": 109, "em": 194}, "Idaho St.": {"tr": 318, "tr26": 264, "em": 324}, "Drake": {"tr": 147, "tr26": 217, "em": 113}, "North Texas": {"tr": 117, "tr26": 136, "em": 110}, "North Dakota St.": {"tr": 151, "tr26": 119, "em": 147}, "Wichita St.": {"tr": 69, "tr26": 79, "em": 72}, "TAMU-CC": {"tr": 203, "tr26": 184, "em": 247}, "Utah Valley": {"tr": 123, "tr26": 93, "em": 136}, "Santa Clara": {"tr": 90, "tr26": 31, "em": 65}, "New Mexico": {"tr": 66, "tr26": 51, "em": 60}, "Lamar": {"tr": 208, "tr26": 256, "em": 203}, "Utah St.": {"tr": 59, "tr26": 26, "em": 49}, "Oregon St.": {"tr": 98, "tr26": 166, "em": 80}, "Washington St.": {"tr": 169, "tr26": 133, "em": 175}, "Gonzaga": {"tr": 17, "tr26": 15, "em": 6}, "Fresno St.": {"tr": 137, "tr26": 130, "em": 160}, "San Diego St.": {"tr": 58, "tr26": 44, "em": 77}, "Texas St.": {"tr": 114, "tr26": 228, "em": 128}, "Colorado St.": {"tr": 83, "tr26": 90, "em": 73}, "Boise St. '26": {"tr": 54, "final": true}, "_bsu": {"tr": 85, "em": 81}};
const TR=(rk,sfx="")=>`<span class="kp" title="Barttorvik T-Rank"><img alt="" src="https://barttorvik.com/favicon.ico" onerror="this.remove()">T-Rank <b>#${rk}</b>${sfx}</span>`;
const EM=(rk,sfx="")=>`<span class="kp" title="EvanMiya team ratings"><img alt="" src="https://evanmiya.com/favicon.ico" onerror="this.remove()">EvanMiya <b>#${rk}</b>${sfx}</span>`;
// Live ranks from the nightly refresh (/api/ranks) replace the snapshot above.
const TR_ALIAS={"Sam Houston":"Sam Houston St.","TAMU-CC":"Texas A&M Corpus Chris","Boise St. '26":"Boise St."};
const EM_ALIAS={"Sam Houston":"Sam Houston State","TAMU-CC":"Texas A&M-Corpus Christi"};
const emName=n=>EM_ALIAS[n]||n.replace(/ St\.$/," State");
let LIVE={};
async function loadLiveRanks(){
 try{const r=await fetch("/api/ranks");if(!r.ok)return;LIVE=await r.json();}catch{}
}

 foot:`Sources: ESPN box scores and play-by-play (32 games), Barttorvik 2023-24 to 2025-26 (D-I games only, so GP is 30), KenPom rank as of Mar 2, 2026 (KenPom's archive blocked the final-rank lookup). Lineups were rebuilt by replaying substitutions; every game's rebuilt minutes matched the box score within 2.5 min.`};

// ---------- depth chart positions ----------
// Position for each player = staff override if set, otherwise the data-based
// estimate (share of minutes at each spot, from lineups + size), otherwise the
// hand-entered slot.
const SLOTS=["PG","SG","SF","PF","C"], OLD2NEW={G:"PG","G/W":"SG",W:"SF",F:"PF",C:"C",PG:"PG",SG:"SG",SF:"SF",PF:"PF"};
let POS={p:{}},OVR={};
const pnorm=s=>String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b\.?/g,"").replace(/[^a-z]/g,"");
// Where to look up a player's position shares: the team and season he last played.
function posLookup(t,p){
 let season,team;
 if(t.mode=="proj"){const m=String(p[6]||"").match(/^(.*?)\s*'(\d\d)$/);if(!m)return null;team=m[1].trim();const y=2000+ +m[2];season=`${y-1}-${String(y).slice(2)}`;}
 else{season=t.posSeason;team=t.posTeam;}
 const sh=POS.p[`${season}|${team}|${pnorm(p[1])}`];
 return sh?{shares:sh,src:`${team} ${season}`}:null;
}
// Projected rosters: players come from different teams, so their old spots
// don't add up. Order the new roster by where each player played (expected
// spot, 0 = PG ... 4 = C; height for players with no D-I data) and fill the
// five spots with ~40 projected minutes each, smallest to biggest.
const htIn=h=>{const m=String(h||"").match(/(\d+)-(\d+)/);return m?+m[1]*12+ +m[2]:78;};
const htSpot=h=>{const i=htIn(h);return i<=74?0.4:i<=77?1.4:i<=79?2.3:i<=81?3.1:3.8;};
function projFill(t){
 if(t._fill)return t._fill;
 const P=t.P,rows=P.map(p=>{const c=posLookup(t,p);const e=c?c.shares.reduce((a,v,i)=>a+v*i,0):htSpot(p[3]);return {p,e,m:p[9][0]||0};}).sort((a,b)=>a.e-b.e||htIn(a.p[3])-htIn(b.p[3]));
 const total=d3.sum(rows,r=>r.m)||1,per=total/5;let acc=0;const fill=new Map();
 for(const r of rows){const sh=[0,0,0,0,0];let left=r.m,pos=acc;
  if(r.m<6){sh[Math.max(0,Math.min(4,Math.round(r.e)))]=1;fill.set(r.p,{shares:sh,src:"low minutes: where he played before (or height)"});continue;}
  if(left<=0){sh[Math.min(4,Math.floor(pos/per))]=1;}
  while(left>1e-9){const i=Math.min(4,Math.floor(pos/per+1e-9)),room=Math.min(left,(i+1)*per-pos)||left;sh[i]+=room;pos+=room;left-=room;if(i==4){sh[4]+=left;left=0;}}
  acc+=r.m;const t2=d3.sum(sh)||1;fill.set(r.p,{shares:sh.map(v=>v/t2),src:"projected minutes, ordered by size"});}
 return t._fill=fill;
}
const posInfo=(t,p)=>{const c=t.mode=="proj"?projFill(t).get(p):posLookup(t,p),o=OVR[`${t.key}|${p[1]}`]?.slot||null;
  let auto=c&&c.shares?SLOTS[c.shares.indexOf(Math.max(...c.shares))]:OLD2NEW[p[7]]||"SF";
  const slot=o||auto;const sec=c&&c.shares?SLOTS.filter((s,i)=>s!==slot&&c.shares[i]>=.25):[];
  return {slot,auto,ovr:!!o,c,sec}};

  if(k==="uw")continue; // Washington keeps its hand-built report
  const i=OPP.findIndex(o=>o[1]===r.name);if(i<0)continue;
  OPP[i][0]=k;
  T[k]={...r,key:k,extraSlot:"personnel",xr:r.name,dataTeam:dataTeam(r.name),name:r.name,game:reportGame(r),
   kpis:r.kpis.map(x=>[x[0],x[1],x[2],RC[x[3]]||x[3],x[4]]),keys:r.keys.map(x=>[RC[x[0]]||x[0],x[1],x[2],x[3]]),
   extra:()=>reportExtra(r),
   foot:`Sources: KenPom and Barttorvik 2027 preseason ratings (Oct 18, 2026), Barttorvik player stats 2023-24 to 2025-26, ESPN 2026-27 rosters, coaching records from school releases and Wikipedia, Boise State athletics schedule. <b style="color:#b9bdc4">Projection method:</b> weighted average of the last 3 seasons (3/2/1 × minutes), pulled toward a bench-level prior for small samples, adjusted for conference level and class, with minutes assigned by projected impact and last season's role, and team scoring normalized to the T-Rank projection. Built ${new Date(r.built).toLocaleDateString("en-US",{month:"short",day:"numeric"})}.`};
 }
}
for(const k in T)T[k].key=k;

 if(pj)POS=pj;if(oj)OVR=oj.overrides||{};

 if(ti){TIDX=Object.fromEntries(ti.teams.filter(x=>!x.season||x.season==="2025-26").map(x=>[x.team,x.slug]));EXH=Object.fromEntries(ti.teams.filter(x=>x.season==="2026-27").map(x=>[x.team,x.slug]));PBPSRC=new Set(ti.teams.filter(x=>x.pbpSource&&(!x.season||x.season==="2025-26")).map(x=>x.team));}TDIST=td;
 try{const rj=await fetch("/data/reports.json").then(r=>r.ok?r.json():null);if(rj){REPORTS=rj.teams;addReports();}}catch{}
 await loadLiveRanks();}
