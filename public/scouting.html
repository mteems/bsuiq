<!doctype html>
<html lang="en">
<head>

<title>Scouting · Bronco IQ</title>

<style>
/* SITE CONVENTION: orange = good / high percentile, blue = bad / low percentile (for the team on the page) */
:root{--bg:#16171a;--panel:#1e1f22;--card:#26282c;--line:#2e3034;--text:#f2f3f4;--muted:#8a8e95;--good:#e2622a;--bad:#4a7fe0;--ui:'Inter Tight Variable',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:auto;padding:0 24px 28px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.otop{border-bottom:1px solid var(--line);background:var(--bg)}
.obrand{display:flex;align-items:center;gap:10px;padding:14px 24px 6px;max-width:1280px;margin:auto}
.obrand b{font-weight:700;font-size:15px}
.otabs{display:flex;gap:2px;overflow-x:auto;padding:0 24px;max-width:1280px;margin:auto;scrollbar-width:thin}
.tab{flex:none;display:flex;gap:7px;align-items:center;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--ui);font-size:12.5px;padding:7px 10px 8px;cursor:pointer;text-align:left;line-height:1.25}
.tab small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#61656c}
.tab.on{color:#fff;border-bottom-color:#f2f3f4}.tab.on small{color:#d6d8db}
.tab:hover{color:#d6d8db}
.tab.sample{border-right:1px solid var(--line);margin-right:6px;padding-right:14px}
.tab.sample small{color:#9aa0a8}
.lg{position:relative;display:inline-flex;flex:none;align-items:center;justify-content:center}
.lg img{width:100%;height:100%;object-fit:contain}
.lg b{display:none;width:100%;height:100%;border-radius:50%;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;font-weight:500;color:#fff;background:#3a3d42}
.lg.fb b{display:flex}
.cf{display:inline-flex;align-items:center;gap:6px;background:#eceef0;color:#1e1f22;border-radius:5px;padding:3px 8px 3px 4px;font-size:11.5px;font-weight:600}
.cf img{height:18px;width:18px;object-fit:contain}
.kp{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid #3a3d42;border-radius:5px;padding:3px 8px;font-size:11.5px;color:#cfd3d9}
.kp img{width:14px;height:14px;border-radius:2px}
.kp b{color:#fff;font-weight:700}
h1{font-size:30px;font-weight:750;letter-spacing:-.02em}
h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
section{margin-top:26px}
.shead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.ptitle{margin-bottom:12px;display:flex;justify-content:space-between;gap:10px}
.cap{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
.story{margin-top:10px;font-size:14px;color:#cfd3d9;line-height:1.55;max-width:1020px}
.story b{color:var(--text)}
[data-def]{cursor:help;text-decoration:underline dotted rgba(138,142,149,.6);text-underline-offset:3px}
svg [data-def]{text-decoration:none}
.hero{display:grid;grid-template-columns:1.1fr 2fr;gap:16px;margin-top:18px}
.game{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:3px 7px;border-radius:4px;background:#3a3d42;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:24px;font-weight:750;margin-top:4px}
.kpi .sub{font-size:11.5px;color:#b9bdc4;margin-top:3px;line-height:1.4}
.chip{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:2px 6px;font-family:var(--mono);font-size:11px;font-weight:500;color:#fff}
.depth{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pos{display:flex;flex-direction:column;gap:8px}
.pos .ph{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em;padding:0 2px}
.pc{background:var(--card);border-radius:8px;padding:10px 10px 9px;border:1px solid transparent}
.pc.st{border-color:#3e4146;background:#2b2d32}
.pc .nm{font-size:13.5px;font-weight:650;line-height:1.2;display:flex;justify-content:space-between;gap:6px}
.pc .nm span{font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--muted)}
.pc .meta{font-size:11px;color:#9aa0a8;margin-top:3px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.07em;padding:1px 5px;border-radius:3px;border:1px solid #4a4d53;color:#c9ccd2}
.tag.new{border-color:#6b4a3a;color:#f0a27d}.tag.fr{color:#9aa0a8}
.mbar{height:5px;border-radius:3px;background:#34363b;margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%}
.pc .row{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:#b9bdc4}
.pc .row b{color:#fff;font-weight:600}
.lgrp{margin-bottom:12px}
.lrow{display:grid;grid-template-columns:18px 1fr 52px 70px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid #2a2c30}
.lrow .r,.lrow .ls{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.lrow .v{font-weight:700;text-align:right}.lrow .ls{text-align:right}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tgrid svg{width:100%;display:block;background:var(--card);border-radius:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{background:var(--card);border-radius:8px;padding:13px;border-left:3px solid #4a4d53}
.key h3{font-size:14px;font-weight:700;margin-top:4px;line-height:1.3}
.key p{font-size:12.5px;color:#c4c8ce;line-height:1.5;margin-top:6px}.key p b{color:#fff}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-weight:500;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
th.grp{text-align:center;border-bottom:1px solid #3a3d42;padding-bottom:5px;color:#b9bdc4}
td{padding:6px 5px;border-bottom:1px solid #2a2c30;text-align:right;white-space:nowrap}
td.m{color:var(--muted)}
.sep{border-left:1px solid #34363b}
tr:hover td{background:rgba(255,255,255,.025)}
.tl{display:flex;align-items:center;gap:7px}
.banner{margin-top:16px;background:#24262a;border:1px dashed #4a4d53;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#cfd3d9}
.ph-empty{padding:60px 20px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:11px;line-height:1.6;margin-top:22px}
</style>
</head>

  return `<div class="pos"><div class="ph"><span>${s}</span><span>${tot.toFixed(0)} min</span></div>${ps.map(p=>{const mp=mid?p[9][0]:p[9][2],pp=mid?p[9][1]:p[9][3];
   const tg=p[5]=="T"?'<span class="tag new">NEW</span>':p[5]=="F"?'<span class="tag fr">FR</span>':'';const fr=mid?(p[5]=="T"?`<span>· ${p[6].replace(/ '\d+/,"")}</span>`:p[5]==""?'<span>· ret.</span>':''):`<span>· GS ${p[9][1]}</span>`;
   return `<div class="pc${p[8]?' st':''}"><div class="nm">${p[1]}<span>#${p[0]}</span></div><div class="meta">${tg}<span>${p[3]} · ${p[4]}</span>${fr}</div><div class="mbar"><i style="width:${mp/36*100}%;background:${p[8]?'#f2f3f4':'#8a8e95'}"></i></div><div class="row"><span>${mp.toFixed(0)} mpg${pp!=null?` · <b>${pp}</b> ppg`:''}</span><span style="font-family:var(--mono);font-size:10px">${p[11][0]} <b>${p[11][1]}</b></span></div></div>`}).join("")}</div>`}).join("")}</div><div class="cap">${t.depthCap}</div></div>
 <div class="panel"><div class="label ptitle"><span>${mid?"Projected leaders":"Season leaders"}</span><span>${t.leadHdr}</span></div>${t.leaders.map(([g,L])=>`<div class="lgrp"><div class="label" style="margin-bottom:5px">${g}</div>${L.map((l,i)=>`<div class="lrow"><span class="r">${i+1}</span><span>${l[0]}</span><span class="v">${l[1]}</span><span class="ls">${l[2]}</span></div>`).join("")}</div>`).join("")}</div></div></section>
 <section><div class="shead"><h2>Team trends</h2><span class="label">${t.trendHdr}</span></div><div class="story">${t.story}</div><div class="panel" style="margin-top:14px"><div class="tgrid" id="trends"></div><div class="cap">Dashed line = 2025-26 D-I average. Latest dot colored by national percentile (orange = strong, blue = weak). Grey = style stat.</div></div></section>
 <section><div class="shead"><h2>Scouting keys</h2><span class="label">What the numbers say · for staff review</span></div><div class="keys grid">${t.keys.map(([c,a,b,p])=>`<div class="key" style="border-left-color:${c}"><span class="label">${a}</span><h3>${b}</h3><p>${p}</p></div>`).join("")}</div></section>
 ${t.extra()}
 <section><div class="shead"><h2>Full roster</h2><span class="label">${t.midHdr[0]} · ${t.advHdr}</span></div><div class="panel" style="margin-top:14px;overflow-x:auto"><table><thead>
 <tr><th class="l" colspan="5"></th><th class="grp sep" colspan="7">${t.midHdr[0]}</th><th class="grp sep" colspan="${mid?11:10}">${t.advHdr}</th></tr>
 <tr><th class="l">#</th><th class="l">Player</th><th class="l">Pos</th><th>Ht</th><th class="l">Cl</th>${t.midHdr[1].map((c,i)=>`<th${i==0?' class="sep"':''}>${c}</th>`).join("")}${mid?'<th class="l sep">Team</th><th>GP</th>':'<th class="sep">GP</th>'}<th><span data-def="minp">Min%</span></th><th><span data-def="ortg">ORtg</span></th><th><span data-def="usg">USG</span></th><th><span data-def="ts">TS%</span></th><th>3P</th><th><span data-def="ast">AST%</span></th><th><span data-def="tov">TOV%</span></th><th><span data-def="blk">BLK%</span></th><th><span data-def="bpm">BPM</span></th></tr></thead><tbody>
 ${[...P].sort((a,b)=>(mid?b[9][0]-a[9][0]:b[9][2]-a[9][2])).map(p=>{const v=p[9],A=p[10];const tg=p[5]=="T"?' <span class="tag new">NEW</span>':p[5]=="F"?' <span class="tag fr">FR</span>':'';
  const mc=mid?(v.length>1?`<td class="sep">${v[0].toFixed(1)}</td><td style="font-weight:700">${f1(v[1])}</td><td>${f1(v[2])}</td><td>${f1(v[3])}</td><td>${v[4]==null?"—":v[4].toFixed(1)}</td><td>${chip("bpm",v[5],sg(v[5]))}</td><td class="m">${v[6]}</td>`:`<td class="sep">${v[0].toFixed(1)}</td><td class="m l" colspan="6">${p[5]=="F"?"freshman / intl: no projection":"small sample: no projection"}</td>`)
   :`<td class="sep m">${v[0]}</td><td class="m">${v[1]}</td><td>${v[2].toFixed(1)}</td><td style="font-weight:700">${v[3].toFixed(1)}</td><td>${v[4].toFixed(1)}</td><td>${v[5].toFixed(1)}</td><td class="m">${v[6]==null?"—":v[6].toFixed(1)}</td>`;
  const q=A&&A[1]>=20;const ac=A?`${mid?`<td class="l sep" style="color:#b9bdc4">${p[6]}</td><td class="m">${A[0]}</td>`:`<td class="sep m">${A[0]}</td>`}<td class="m">${A[1].toFixed(0)}</td><td>${q?chip("ortg",A[2],A[2].toFixed(1)):A[2].toFixed(1)}</td><td>${A[3].toFixed(1)}</td><td>${q?chip("ts",A[4],A[4].toFixed(1)):A[4].toFixed(1)}</td><td>${A[6]>=40?chip("p3",A[7],A[7].toFixed(1))+` <span class="m" style="font-size:10.5px">${A[6]}</span>`:`<span class="m">${A[5]}/${A[6]}</span>`}</td><td>${A[8].toFixed(1)}</td><td>${A[9].toFixed(1)}</td><td>${A[10].toFixed(1)}</td><td>${q?chip("bpm",A[11],sg(A[11])):sg(A[11])}</td>`:`<td class="l sep m" colspan="${mid?11:10}">no D-I history</td>`;
  return `<tr><td class="l m">${p[0]}</td><td class="l" style="color:#fff;font-weight:600">${p[1]}${tg}</td><td class="l m">${p[2]}</td><td class="m">${p[3]}</td><td class="l m">${p[4]}</td>${mc}${ac}</tr>`}).join("")}
 </tbody></table><div class="cap">Chips = percentile among 2,284 D-I rotation players in 2025-26 (shown at 20%+ minutes). 3P% chips need 40+ attempts.${mid?" Confidence: H = 2+ seasons, M = one season or level jump, L = small sample.":""}</div></div></section>
 <footer>${t.foot} Logos: ESPN.</footer>`;
 document.getElementById("page").innerHTML=h;
 // trends
 const tg=document.getElementById("trends");const yrs=t.yrs;
 t.trends.forEach(([k,name,vals,proj,better,avg])=>{const W=290,H=170,m={t:40,b:30,l:26,r:30},svg=d3.select(tg).append("svg").attr("viewBox",`0 0 ${W} ${H}`),x=d3.scalePoint(yrs,[m.l,W-m.r]);
  const all=vals.map(v=>v[0]).concat([avg],proj?[proj]:[]),e=d3.extent(all),pad=(e[1]-e[0])*.35||1,y=d3.scaleLinear([e[0]-pad,e[1]+pad],better=="low"?[m.t,H-m.b]:[H-m.b,m.t]);
  svg.append("text").attr("x",12).attr("y",20).attr("font-size",11.5).attr("font-weight",500).attr("fill","#d6d8db").attr("letter-spacing",".06em").attr("data-def",k).text(name.toUpperCase());
  svg.append("text").attr("x",W-12).attr("y",20).attr("text-anchor","end").attr("font-size",9.5).attr("fill","#6b6e75").text(better=="style"?"style":better=="low"?"↓ better":"↑ better");
  svg.append("line").attr("x1",m.l-10).attr("x2",W-m.r+10).attr("y1",y(avg)).attr("y2",y(avg)).attr("stroke","#6b6e75").attr("stroke-dasharray","4 4");
  svg.append("text").attr("x",W-m.r+10).attr("y",y(avg)+12).attr("text-anchor","end").attr("font-size",9).attr("fill","#8a8e95").text("D-I "+avg);
  const pts=vals.map((v,i)=>[yrs[i],v[0],v[1]]),li=pts.length-1;
  svg.append("path").attr("d",d3.line().x(d=>x(d[0])).y(d=>y(d[1]))(pts)).attr("stroke","#8a8e95").attr("stroke-width",1.8).attr("fill","none");
  if(proj)svg.append("path").attr("d",d3.line().x(d=>x(d[0])).y(d=>y(d[1]))([pts[li],[yrs[li+1],proj]])).attr("stroke","#8a8e95").attr("stroke-dasharray","3 3").attr("fill","none");
  pts.forEach((d,i)=>{const L=i==li,col=d[2]==null?"#c9ccd2":pc(d[2]);svg.append("circle").attr("cx",x(d[0])).attr("cy",y(d[1])).attr("r",L?6.5:4.5).attr("fill",L?col:"#26282c").attr("stroke",L?"#fff":col).attr("stroke-width",L?2:1.8).on("mousemove",e=>tipOn(e,`${d[0]} · ${name} ${d[1]}${d[2]!=null?` · ${d[2]}th pct`:""}`)).on("mouseleave",tipOff);
   svg.append("text").attr("x",x(d[0])).attr("y",y(d[1])-11).attr("text-anchor","middle").attr("font-size",L?13.5:11).attr("font-weight",L?700:500).attr("fill",L?"#fff":"#b9bdc4").text(d[1].toFixed(1))});
  if(proj){svg.append("path").attr("d",d3.symbol(d3.symbolDiamond,70)()).attr("transform",`translate(${x(yrs[li+1])},${y(proj)})`).attr("fill","#16171a").attr("stroke","#f2f3f4").attr("stroke-width",1.5);svg.append("text").attr("x",x(yrs[li+1])).attr("y",y(proj)-11).attr("text-anchor","middle").attr("font-size",11).attr("fill","#d6d8db").text(proj.toFixed(1))}
  yrs.forEach((yy,i)=>svg.append("text").attr("x",x(yy)).attr("y",H-9).attr("text-anchor","middle").attr("font-size",10).attr("fill",i>li&&!proj?"#4a4d53":"#9aa0a8").text(i>li&&!proj?"—":yy));});
 if(t.after)t.after();
}
{const h=location.hash.slice(1),i=OPP.findIndex(o=>(o[0]||o[1].toLowerCase().replace(/[^a-z]+/g,"-"))===h);if(i>=0)document.querySelector(`.tab[data-i="${i}"]`).click();else render(T.uw);}
