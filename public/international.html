<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>International · Bronco IQ</title>
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/68.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
:root{--t1:#e2622a;--t2:#f0a07a;--t3:#a8968c}
.iwrap{max-width:1480px;margin:auto;padding:22px 24px 36px}
.ihead{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.ihead h1{font-size:28px;margin-top:6px}
.ikpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-left:auto;min-width:min(720px,100%)}
.ikpi{background:var(--card);border-radius:8px;padding:9px 12px}
.ikpi b{display:block;font-size:20px;font-weight:750;margin-top:2px}
.ikpi .sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.ibar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.conts{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.conts button{background:none;border:0;border-right:1px solid var(--line);color:var(--muted);font:500 12px var(--ui);padding:8px 13px;cursor:pointer;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.conts button:last-child{border-right:0}
.conts button i{font:normal 10px var(--mono);color:var(--faint)}
.conts button:hover{color:var(--soft)}
.conts button.on{background:var(--edge);color:#fff}.conts button.on i{color:#cfd3d9}
.conts button[disabled]{opacity:.35;cursor:default}
.fgrp{display:flex;align-items:center;gap:6px}
.fgrp .ddl{font:10px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.fchip{background:var(--card);border:1px solid var(--edge);color:var(--dim);border-radius:6px;padding:5px 9px;font:11px var(--mono);cursor:pointer;display:flex;gap:6px;align-items:center}
.fchip:hover{color:#fff}
.fchip.off{opacity:.38}
.fchip s{width:8px;height:8px;border-radius:50%;display:inline-block;text-decoration:none}
.seg2{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:auto}
.seg2.mode{position:absolute;right:12px;top:12px;background:rgba(22,23,26,.9)}
.seg2 button{background:none;border:0;color:var(--muted);font:11px var(--mono);padding:7px 11px;cursor:pointer;letter-spacing:.03em}
.seg2 button.on{background:var(--edge);color:#fff}
.igrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;margin-top:12px}
.mapbox{position:relative;background:#18191c;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(640px,72vh);min-height:420px}
.mapbox svg{width:100%;height:100%;display:block;cursor:grab}
.mapbox svg:active{cursor:grabbing}
.land{fill:#25272b;stroke:#33363b;stroke-width:.6;vector-effect:non-scaling-stroke}
.land.has{fill:#36373c}
.land.hot{fill:#45464b}
.state{fill:transparent;stroke:#3a3d42;stroke-width:.5;vector-effect:non-scaling-stroke}
.state.has{fill:#36373c}.state.hot{fill:#45464b}
.grat{fill:none;stroke:#1f2124;stroke-width:.6;vector-effect:non-scaling-stroke}
.sphere{fill:#18191c}
.bub circle.bg{fill:#16171a;stroke:#16171a;stroke-width:2}
.bub text{font:600 11px var(--mono);fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bub{cursor:pointer}
.bub:hover circle.bg{fill:#2a2c30}
.dot{cursor:pointer;stroke:#16171a;stroke-width:1.5;transition:r .12s}
.dot.hl{stroke:#fff;stroke-width:2}
.dot.dim{opacity:.18}
.plab text.pn{font:650 12.5px var(--ui);fill:#fff;paint-order:stroke;stroke:#18191c;stroke-width:4px;pointer-events:none}
.plab text.ps{font:10px var(--mono);fill:#b9bdc4;letter-spacing:.03em;paint-order:stroke;stroke:#18191c;stroke-width:3px;pointer-events:none}
.clab{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;fill:#b9bdc4;paint-order:stroke;stroke:#18191c;stroke-width:3px;pointer-events:none}
.clab b{fill:#fff}
.arc{fill:none;stroke:#f0a07a;stroke-width:1;stroke-dasharray:2 3;opacity:.55;pointer-events:none}
.mapui{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.mapui button{width:30px;height:30px;border-radius:7px;border:1px solid var(--edge);background:rgba(30,31,34,.92);color:var(--soft);font:16px var(--mono);cursor:pointer}
.mapui button:hover{color:#fff;border-color:#6a6e75}
.legend{position:absolute;left:14px;bottom:12px;background:rgba(22,23,26,.86);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:10px var(--mono);color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 80px)}
.legend span{display:flex;gap:5px;align-items:center}.legend s{width:9px;height:9px;border-radius:50%;display:inline-block}
.where{position:absolute;left:14px;top:12px;font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--soft);background:rgba(22,23,26,.86);border:1px solid var(--line);border-radius:8px;padding:7px 10px;pointer-events:none}
.where em{font-style:normal;color:var(--muted);margin-left:6px}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;height:min(640px,72vh);min-height:420px;overflow:hidden}
.shd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.shd h2{font-size:17px}
.shd .label{margin-top:3px}
.slist{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:#3a3d42 transparent}
.cgrp{border-bottom:1px solid var(--line2)}
.ch{display:flex;align-items:center;gap:8px;padding:9px 16px 6px;position:sticky;top:0;background:var(--panel);z-index:1;cursor:pointer}
.ch img{width:18px;height:13px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.ch b{font-size:12.5px;font-weight:650}
.ch span{margin-left:auto;font:10.5px var(--mono);color:var(--muted)}
.pr .av{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;background:#2a2c30;box-shadow:0 0 0 2px var(--good)}
.pr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 16px 6px 18px;cursor:pointer}
.pr:hover,.pr.hl{background:rgba(255,255,255,.04)}
.pr.sel{background:rgba(255,255,255,.07)}
.pr s{width:9px;height:9px;border-radius:50%;display:block}
.pr .nm{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .mt{font:10.5px var(--mono);color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .tr{font:10px var(--mono);color:var(--dim);text-align:right;line-height:1.5}
.vc{font:9px var(--mono);letter-spacing:.06em;border:1px solid #6b4a3a;color:#f0a27d;border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:1px}
.pcard{padding:14px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#25272b,#1e1f22)}
.pcard .ptop{display:flex;gap:12px;align-items:center}
.pcard .hs{width:72px;height:72px;border-radius:50%;object-fit:cover;object-position:top;background:#2a2c30;box-shadow:0 0 0 2.5px var(--good);flex:none}
.pcard .fl{width:16px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pcard .cteam{font-size:12px;color:var(--dim);margin-top:3px}
.fwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.ftop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ftabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ftabs button{background:none;border:0;color:var(--muted);font:11px var(--mono);padding:4px 10px;cursor:pointer}
.ftabs button.on{background:var(--edge);color:#fff}
.fev{background:var(--card);border-radius:10px;padding:12px 12px 10px}
.fhd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.fnm{font-size:13.5px;font-weight:650;color:#fff}
.fsub{font:10.5px var(--mono);color:var(--muted);margin-top:3px}
.fbadge{font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--good);border-radius:4px;padding:3px 7px;white-space:nowrap}
.fbig{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.fb{background:#1e1f22;border-radius:8px;padding:9px 6px 7px;text-align:center}
.fb b{display:block;font-size:24px;font-weight:750;letter-spacing:-.02em;line-height:1}
.fb span{display:block;font:9.5px var(--mono);letter-spacing:.1em;color:var(--muted);margin-top:5px}
.fsm{display:grid;grid-template-columns:repeat(6,1fr);margin-top:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fsm div{text-align:center;padding:7px 0}
.fsm span{display:block;font:9px var(--mono);letter-spacing:.08em;color:var(--muted)}
.fsm b{display:block;font:600 12.5px var(--mono);color:var(--soft);margin-top:2px}
.fshoot{margin-top:10px;display:grid;gap:7px}
.fsh{display:grid;grid-template-columns:22px minmax(0,1fr) 46px 52px;gap:8px;align-items:center}
.fsh .fl{font:10px var(--mono);color:var(--muted);letter-spacing:.06em}
.ftr{height:6px;background:#1e1f22;border-radius:3px;overflow:hidden}
.ftr i{display:block;height:100%;background:#d6d8db;border-radius:3px}
.fsh b{font:600 12px var(--mono);text-align:right}
.fsh em{font:normal 10px var(--mono);color:var(--muted);text-align:right}
.flink{display:inline-block;margin-top:10px;font:10.5px var(--mono);color:var(--dim)}
.flink:hover{color:#fff}
.pcard h3{font-size:18px;font-weight:750;letter-spacing:-.01em}
.pcard .x{margin-left:auto;background:none;border:0;color:var(--muted);font:14px var(--mono);cursor:pointer}
.pcard .x:hover{color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.cgrid div{background:var(--card);border-radius:6px;padding:7px 8px}
.cgrid b{display:block;font-size:14px;margin-top:2px}
.cgrid .label{font-size:9px}
.cinfo{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 10px;margin-top:12px;font-size:12px;line-height:1.45}
.cinfo dt{font:9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.cinfo dd{margin:0;color:var(--soft)}.cinfo dd span{color:var(--muted)}
.cnote{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.5}
.cnote b{display:inline;font-size:inherit;font-weight:650;margin:0}
.tierchip{font:600 10px var(--mono);border-radius:4px;padding:2px 6px;color:#16171a}
.empty{padding:28px 16px;color:var(--muted);font-size:12.5px}
@media (max-width:1100px){.igrid{grid-template-columns:1fr}.side{height:auto;max-height:560px}.ikpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.iwrap{padding:16px 16px 28px}.conts{overflow-x:auto;max-width:100%;scrollbar-width:none}.seg2{margin-left:0}.mapbox{height:420px}.legend{display:none}.where{display:none}.seg2.mode{left:12px;right:auto}.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="iwrap">
  <div class="ihead">
    <div><div class="label">Recruiting · International · Class of 2027</div><h1>International board</h1></div>
    <div class="ikpis" id="kpis"></div>
  </div>
  <div class="ibar">
    <div class="conts" id="conts"></div>
    <div class="fgrp" id="fpos"><span class="ddl">Pos</span></div>
  </div>
  <div class="igrid">
    <div class="mapbox" id="mapbox">
      <svg id="map" aria-label="World map of international recruits"></svg>
      <div class="where" id="where"></div>
      <div class="mapui"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zreset" title="Whole world" style="font-size:12px">⌂</button></div>
    </div>
    <aside class="side"><div id="card" class="slist" hidden></div><div id="listview" style="display:contents"><div class="shd" id="shd"></div><div class="slist" id="list"></div></div></aside>
  </div>
  <div class="cap">Each dot sits in the city where the player plays now. Scroll or pinch to zoom, drag to pan, or pick a region above. To add a player, ask Claude to add him by name.</div>
</main>
<script type="module">
import { d3, topBar, tipOn, tipOff, esc } from "/assets/core.js";
topBar("international");

const DOT = "#e2622a";
const POSG = (p) => (/C|PF/.test(p) && !/SF\/PF/.test(p) ? "B" : /SF|SG\/SF/.test(p) || p === "SF/PF" ? "W" : "G");
const POSL = { G: "Guard", W: "Wing", B: "Big" };
const REGIONS = [["World", null], ["Europe", [-12, 34.5, 50, 61]], ["Africa", [-19, -12, 40, 25]], ["North America", [-128, 9, -58, 58]], ["South America", [-82, -38, -34, 8]], ["Asia", [70, 10, 140, 50]], ["Oceania", [110, -46, 178, -8]]];
const [geo, board, W110] = await Promise.all([fetch("/data/intl/geo.json").then((r) => r.json()), fetch("/data/intl/board.json").then((r) => r.json()), fetch("/assets/geo/world-110m.json").then((r) => r.json())]);
let W50 = null;
const C = geo.countries;
const feat110 = new Map(W110.features.map((f) => [f.properties.a, f]));
const home = (a3) => geo.anchor[a3] || (feat110.get(a3) ? [feat110.get(a3).properties.lx, feat110.get(a3).properties.ly] : [0, 0]);
const ageOf = (p) => (p.born ? (Date.now() - Date.parse(p.born)) / 3.15576e10 : p.age ?? null);
// Region = where he plays now (a Spaniard at a Utah prep school shows under North America).
const regionOfLL = (ll) => { for (const [r, b] of REGIONS) if (b && ll[0] >= b[0] && ll[0] <= b[2] && ll[1] >= b[1] && ll[1] <= b[3]) return r; return "World"; };
const P = board.players.map((p, i) => { const [a3, a2] = C[p.nat] || ["", ""]; const ll = p.ll || home(a3); return { ...p, i, a3, a2, reg: regionOfLL(ll), pg: POSG(p.pos), ll, age: ageOf(p) }; });
const st = { region: "World", pos: new Set(["G", "W", "B"]), sel: null, hover: null, k: 1 };
const vis = () => P.filter((p) => st.pos.has(p.pg));
const inRegion = (p, r) => r === "World" || p.reg === r;

// ---------------------------------------------------------------- KPIs + controls
const kp = (l, v, s) => `<div class="ikpi"><span class="label">${l}</span><b>${v}</b><div class="sub">${s}</div></div>`;
const cnt = (g) => P.filter((p) => p.pg === g).length;
document.getElementById("kpis").innerHTML = kp("Players", P.length, "on the board") + kp("Countries", new Set(P.map((p) => p.nat)).size, [...new Set(P.map((p) => p.nat))].join(" · "))
  + kp("Guards", cnt("G"), "PG / SG") + kp("Wings", cnt("W"), "SF / wing forwards") + kp("Bigs", cnt("B"), "PF / C") + kp("Class", "2027", "high school / club class");
document.getElementById("fpos").insertAdjacentHTML("beforeend", ["G", "W", "B"].map((k) => `<button class="fchip" data-k="${k}">${POSL[k]}s</button>`).join(""));
document.querySelectorAll("#fpos .fchip").forEach((b) => (b.onclick = () => { const k = b.dataset.k; if (st.pos.has(k) && st.pos.size > 1) st.pos.delete(k); else st.pos.add(k); b.classList.toggle("off", !st.pos.has(k)); draw(); }));
function drawConts() {
  const V = vis();
  document.getElementById("conts").innerHTML = REGIONS.map(([r]) => { const n = V.filter((p) => inRegion(p, r)).length; return `<button data-r="${r}" class="${st.region === r ? "on" : ""}" ${n || r === "World" ? "" : "disabled"}>${r}<i>${n}</i></button>`; }).join("");
  document.querySelectorAll("#conts button").forEach((b) => (b.onclick = () => goRegion(b.dataset.r)));
}

// ---------------------------------------------------------------- map
const box = document.getElementById("mapbox"), svg = d3.select("#map");
let Wd = box.clientWidth, Ht = box.clientHeight;
const proj = d3.geoNaturalEarth1(), path = d3.geoPath(proj), land = W110.features;
function fitWorld() { Wd = box.clientWidth; Ht = box.clientHeight; proj.fitExtent([[8, 8], [Wd - 8, Ht - 8]], { type: "FeatureCollection", features: land.filter((f) => f.properties.ly > -58) }); }
fitWorld();
const gMap = svg.append("g"), gSphere = gMap.append("path").attr("class", "sphere"), gGrat = gMap.append("path").attr("class", "grat"), gLand = gMap.append("g"), gStates = gMap.append("g");
// US states + Canadian provinces drawn over the countries.
let STATES = [];
fetch("/assets/geo/states.json").then((r) => r.json()).then((j) => { STATES = j.features; drawStates(); }).catch(() => {});
function drawStates() {
  gStates.selectAll("path").data(STATES, (f) => f.properties.c + f.properties.n).join("path").attr("class", "state").attr("d", path)
    .on("mousemove", (e, f) => { const n = vis().filter((p) => d3.geoContains(f, p.ll)).length; tipOn(e, `<b>${f.properties.n}</b>${n ? ` · ${n} player${n > 1 ? "s" : ""}` : ""}`); }).on("mouseleave", tipOff);
  shadeStates();
}
function shadeStates() { const on = st.hover ?? st.sel; gStates.selectAll("path").classed("has", (f) => vis().some((p) => d3.geoContains(f, p.ll))).classed("hot", (f) => on != null && d3.geoContains(f, P[on].ll)); }
const gLab = svg.append("g"), gPts = svg.append("g");
const countryAt = (ll) => { for (const f of land) if (d3.geoContains(f, ll)) return f.properties.a; return null; };
function drawLand(features) {
  gSphere.attr("d", path({ type: "Sphere" })); gGrat.attr("d", path(d3.geoGraticule10()));
  gLand.selectAll("path").data(features, (f) => f.properties.a).join("path").attr("class", "land").attr("d", path)
    .on("mousemove", (e, f) => { const n = vis().filter((p) => p.a3 === f.properties.a).length; if (n) tipOn(e, `<b>${f.properties.n}</b> · ${n} player${n > 1 ? "s" : ""}`); })
    .on("mouseleave", tipOff).on("click", (e, f) => { const p = vis().find((q) => q.a3 === f.properties.a); if (p && st.region === "World") goRegion(p.reg); });
  shadeLand();
}
function shadeLand() { const has = new Set(vis().flatMap((p) => [p.a3, countryAt(p.ll)])), on = st.hover ?? st.sel, hot = on != null ? countryAt(P[on].ll) : null;
  gLand.selectAll("path").classed("has", (f) => has.has(f.properties.a) && !["USA", "CAN"].includes(f.properties.a)).classed("hot", (f) => f.properties.a === hot && !["USA", "CAN"].includes(f.properties.a)); if (typeof shadeStates === "function") shadeStates(); }
drawLand(land);
let T = d3.zoomIdentity;
const zoom = d3.zoom().scaleExtent([1, 24]).translateExtent([[-Wd * 0.1, -Ht * 0.1], [Wd * 1.1, Ht * 1.1]])
  .on("zoom", (e) => { T = e.transform; gMap.attr("transform", T); st.k = T.k; if (T.k > 1.8 && !W50) load50(); placePoints(); })
  .on("end", (e) => { if (e.sourceEvent) { st.region = regionFor(); drawConts(); drawList(); } });
svg.call(zoom).on("dblclick.zoom", null);
function load50() { W50 = "loading"; fetch("/assets/geo/world-50m.json").then((r) => r.json()).then((j) => { W50 = j; drawLand(j.features); drawStates(); }).catch(() => (W50 = null)); }
function tFor(bbox) {
  const [[x0, y0], [x1, y1]] = [proj([bbox[0], bbox[3]]), proj([bbox[2], bbox[1]])];
  const k = Math.min(24, (Wd < 640 ? 0.8 : 0.92) / Math.max((x1 - x0) / Wd, (y1 - y0) / Ht));
  return d3.zoomIdentity.translate(Wd / 2, Ht / 2).scale(k).translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
}
function goRegion(r) { st.region = r; drawConts(); drawList(); const b = REGIONS.find((q) => q[0] === r)[1]; svg.transition().duration(950).ease(d3.easeCubicInOut).call(zoom.transform, b ? tFor(b) : d3.zoomIdentity); }
function flyTo(p) { const [x, y] = proj(p.ll), k = Math.max(st.k, 7); svg.transition().duration(950).ease(d3.easeCubicInOut).call(zoom.transform, d3.zoomIdentity.translate(Wd / 2, Ht / 2).scale(k).translate(-x, -y)); }
function regionFor() { if (T.k < 1.4) return "World"; const c = proj.invert(T.invert([Wd / 2, Ht / 2])); let best = "World", bd = 1e9;
  for (const [r, b] of REGIONS) if (b) { const d = Math.hypot(c[0] - (b[0] + b[2]) / 2, c[1] - (b[1] + b[3]) / 2); if (d < bd) { bd = d; best = r; } } return best; }
document.getElementById("zin").onclick = () => svg.transition().duration(400).call(zoom.scaleBy, 1.6);
document.getElementById("zout").onclick = () => svg.transition().duration(400).call(zoom.scaleBy, 1 / 1.6);
document.getElementById("zreset").onclick = () => goRegion("World");

// One dot per player at his club's city. Players in the same city pack together.
const xy = (ll) => T.apply(proj(ll));
function placePoints() {
  const k = st.k, r = k >= 1.8 ? 6.5 : 5, golden = Math.PI * (3 - Math.sqrt(5));
  const byCity = d3.group(vis(), (p) => p.city || p.nat);
  const pts = [];
  for (const [, ps] of byCity) { const [cx, cy] = xy(ps[0].ll); ps.forEach((p, i) => { const rr = i ? (k >= 1.8 ? 48 : 36) * Math.sqrt(i) : 0, a = i * golden; pts.push({ p, x: cx + rr * Math.cos(a), y: cy + rr * Math.sin(a), r }); }); }
  // markers: headshot in an orange ring (dot if no photo)
  const R = k >= 1.8 ? 22 : 16;
  const M = gPts.selectAll("g.mk").data(pts, (d) => d.p.i);
  M.exit().remove();
  const me = M.enter().append("g").attr("class", "mk").style("cursor", "pointer")
    .on("mousemove", (e, d) => { st.hover = d.p.i; highlight(); tipOn(e, tipHTML(d.p)); }).on("mouseleave", () => { st.hover = null; highlight(); tipOff(); })
    .on("click", (e, d) => select(d.p.i, true));
  me.append("clipPath").attr("id", (d) => "hc" + d.p.i).append("circle");
  me.append("circle").attr("class", "halo").attr("fill", DOT).attr("opacity", 0.18);
  me.append("circle").attr("class", "ring").attr("fill", "#2a2c30").attr("stroke", DOT).attr("stroke-width", 2.5);
  me.filter((d) => d.p.headshot).append("image").attr("href", (d) => d.p.headshot).attr("clip-path", (d) => `url(#hc${d.p.i})`).attr("preserveAspectRatio", "xMidYMin slice");
  me.merge(M).attr("transform", (d) => `translate(${d.x},${d.y})`).each((d) => (d.r = R));
  // labels: name always (only a few players); club + city when zoomed in
  const labs = pts.map((d) => ({ k: d.p.i, x: d.x + R + 9, y: d.y, name: d.p.name, sub: k >= 1.8 ? `${d.p.club} · ${d.p.city}` : `${d.p.city}, ${d.p.nat}` }));
  const L = gLab.selectAll("g.plab").data(labs, (d) => d.k).join((en) => { const g = en.append("g").attr("class", "plab"); g.append("text").attr("class", "pn"); g.append("text").attr("class", "ps"); return g; })
    .attr("transform", (d) => `translate(${d.x},${d.y})`);
  L.select("text.pn").attr("y", -2).text((d) => d.name);
  L.select("text.ps").attr("y", 11).text((d) => d.sub);
  document.getElementById("where").innerHTML = `${st.region}<em>${vis().filter((p) => inRegion(p, st.region)).length} player${vis().filter((p) => inRegion(p, st.region)).length === 1 ? "" : "s"}</em>`;
  highlight();
}
const fmtAge = (p) => (p.age ? p.age.toFixed(1) : "—");
function tipHTML(p) { return `<b>${esc(p.name)}</b><br>${p.pos} · ${p.ht}${p.wt ? ` · ${p.wt} lb` : ""} · ${fmtAge(p)} yrs<br>${esc(p.team || p.club)} · ${esc(p.city)}, ${p.nat}`; }
function highlight() {
  const on = st.hover ?? st.sel;
  gPts.selectAll("g.mk").each(function (d) { const rr = (d.r || 16) + (d.p.i === on ? 3 : 0), g = d3.select(this);
    g.select("clipPath circle").attr("r", rr - 1.5); g.select(".halo").attr("r", rr + 6).attr("opacity", d.p.i === on ? 0.35 : 0.18); g.select(".ring").attr("r", rr).attr("stroke", d.p.i === on ? "#fff" : DOT);
    g.select("image").attr("x", -rr).attr("y", -rr).attr("width", rr * 2).attr("height", rr * 2); if (d.p.i === on) g.raise(); });
  document.querySelectorAll(".pr").forEach((r) => { r.classList.toggle("hl", +r.dataset.i === st.hover); r.classList.toggle("sel", +r.dataset.i === st.sel); });
  shadeLand();
}

// ---------------------------------------------------------------- side panel
function drawList() {
  const V = vis().filter((p) => inRegion(p, st.region)), G = d3.group(V, (p) => p.nat);
  const gs = [...G].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  document.getElementById("shd").innerHTML = `<h2>${st.region === "World" ? "All players" : st.region}</h2><div class="label">${V.length} player${V.length === 1 ? "" : "s"} · ${gs.length} countr${gs.length === 1 ? "y" : "ies"}</div>`;
  document.getElementById("list").innerHTML = gs.length ? gs.map(([nat, ps]) => `<div class="cgrp"><div class="ch">${ps[0].a2 ? `<img alt="" src="https://flagcdn.com/w40/${ps[0].a2}.png" onerror="this.remove()">` : ""}<b>${esc(nat)}</b><span>${ps.length}</span></div>
    ${ps.sort((a, b) => a.name.localeCompare(b.name)).map((p) => `<div class="pr" data-i="${p.i}">${p.headshot ? `<img class="av" alt="" src="${p.headshot}">` : `<s style="background:${DOT}"></s>`}<div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="mt">${p.pos} · ${p.ht} · ${fmtAge(p)} · ${esc(p.club)}</div></div><div class="tr">${esc(p.city)}</div></div>`).join("")}</div>`).join("")
    : `<div class="empty">No players here yet.</div>`;
  document.querySelectorAll(".pr").forEach((r) => { const i = +r.dataset.i; r.onmouseenter = () => { st.hover = i; highlight(); }; r.onmouseleave = () => { st.hover = null; highlight(); }; r.onclick = () => select(i, true); });
  highlight();
}
const fx1 = (v) => (v == null ? "—" : (+v).toFixed(1));
const pct = (a) => (a && a[1] ? `<span class="m">${fx1(a[0])}/${fx1(a[1])}</span> ${a[2] == null ? "—" : (+a[2]).toFixed(1)}%` : "—");
// FIBA block: one event at a time (year tabs when there are several).
// Headline numbers big, the rest as a compact strip, shooting as bars.
function fibaEvent(f) {
  const big = (v, l) => `<div class="fb"><b>${fx1(v)}</b><span>${l}</span></div>`;
  const sm = (l, v, sign) => `<div><span>${l}</span><b>${v == null ? "—" : (sign && v > 0 ? "+" : "") + fx1(v)}</b></div>`;
  const bar = (l, a) => { const has = a && a[1]; const p = has ? +a[2] : 0;
    return `<div class="fsh"><span class="fl">${l}</span><div class="ftr"><i style="width:${Math.min(100, p)}%"></i></div><b>${has ? p.toFixed(1) + "%" : "—"}</b><em>${has ? `${fx1(a[0])}/${fx1(a[1])}` : "no att."}</em></div>`; };
  return `<div class="fev">
    <div class="fhd"><div><div class="fnm">${f.yr} ${esc(f.event.replace("FIBA ", ""))}</div><div class="fsub">${esc(f.team)}${f.finish ? ` · finished ${f.finish}` : ""} · ${f.gp} games · ${fx1(f.min)} min</div></div>${f.rank ? `<span class="fbadge">${esc(f.rank)}</span>` : ""}</div>
    <div class="fbig">${big(f.pts, "PTS")}${big(f.reb, "REB")}${big(f.ast, "AST")}</div>
    <div class="fsm">${sm("OREB", f.oreb)}${sm("STL", f.stl)}${sm("BLK", f.blk)}${sm("TO", f.to)}${sm("+/−", f.pm, true)}${sm("EFF", f.eff)}</div>
    <div class="fshoot">${bar("FG", f.fg)}${bar("3P", f.tp)}${bar("FT", f.ft)}</div>
    <a class="flink" href="${f.url}" target="_blank" rel="noopener">Game-by-game on FIBA ↗</a></div>`;
}
function fibaHTML(p) {
  if (!p.fiba?.length) return "";
  const ev = [...p.fiba].sort((a, b) => b.yr - a.yr);
  return `<div class="fwrap"><div class="ftop"><span class="label">FIBA · per game</span>${ev.length > 1 ? `<div class="ftabs">${ev.map((f, i) => `<button data-e="${i}" class="${i ? "" : "on"}">${f.yr}</button>`).join("")}</div>` : ""}</div>
    <div class="fbody">${fibaEvent(ev[0])}</div></div>`;
}
function wireFiba(p) {
  const ev = [...(p.fiba || [])].sort((a, b) => b.yr - a.yr);
  document.querySelectorAll("#card .ftabs button").forEach((b) => (b.onclick = () => {
    document.querySelectorAll("#card .ftabs button").forEach((x) => x.classList.toggle("on", x === b));
    document.querySelector("#card .fbody").innerHTML = fibaEvent(ev[+b.dataset.e]);
  }));
}
function select(i, fly) {
  st.sel = i; const p = P[i];
  document.getElementById("card").innerHTML = `<div class="pcard"><div class="ptop">${p.headshot ? `<img class="hs" alt="" src="${p.headshot}">` : ""}<div style="min-width:0"><div class="label">${p.a2 ? `<img class="fl" alt="" src="https://flagcdn.com/w40/${p.a2}.png">` : ""}${p.nat} · ${p.pos} · ${p.cls}</div><h3>${esc(p.name)}</h3><div class="cteam">${esc(p.team || p.club)} · ${esc(p.city)}</div></div><button class="x" title="Back to the list">✕</button></div>
    <div class="cgrid"><div><span class="label">Height</span><b>${p.ht}</b></div><div><span class="label">Weight</span><b>${p.wt ?? "—"}</b></div><div><span class="label">Age</span><b>${fmtAge(p)}</b></div><div><span class="label">Born</span><b style="font-size:12.5px;white-space:nowrap">${p.born ? new Date(p.born + "T12:00").toLocaleDateString("en-US", { month: "short", year: "numeric" }) : "—"}</b></div></div>
    <dl class="cinfo"><dt>Now</dt><dd>${esc(p.team || p.club)}${p.league ? ` <span>${esc(p.league)}</span>` : ""}</dd>${p.prev ? `<dt>Before</dt><dd>${esc(p.prev)}</dd>` : ""}${p.nt ? `<dt>National</dt><dd>${esc(p.nt)}</dd>` : ""}</dl>
    ${fibaHTML(p)}</div>`;
  wireFiba(p);
  const cardEl = document.getElementById("card"); cardEl.hidden = false; cardEl.scrollTop = 0; document.getElementById("listview").style.display = "none";
  document.querySelector("#card .x").onclick = () => { st.sel = null; cardEl.innerHTML = ""; cardEl.hidden = true; document.getElementById("listview").style.display = "contents"; highlight(); };
  if (fly) { if (st.region !== p.reg) { st.region = p.reg; drawConts(); drawList(); } flyTo(p); }
  highlight();
}
function draw() { drawConts(); drawList(); placePoints(); shadeLand(); }
draw();
addEventListener("resize", () => { const t = T; fitWorld(); drawLand(W50 && W50 !== "loading" ? W50.features : land); drawStates(); svg.call(zoom.transform, t); });
const h = location.hash.slice(1); if (h) { const r = REGIONS.find((q) => q[0].toLowerCase().replace(/ /g, "-") === h); if (r) setTimeout(() => goRegion(r[0]), 200); }
</script>
