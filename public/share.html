<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Team report · Bronco IQ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
/* Public, read-only team report for a share link (/s/<token>): one team, no site navigation. */
.swrap{max-width:1180px;margin:auto;padding:0 24px 40px}
.shero{display:flex;align-items:center;gap:16px;padding:26px 0 8px}
.shero img{width:64px;height:64px;object-fit:contain}
.shero h1{font-size:30px;margin:2px 0 0;letter-spacing:-.02em}
.sbar{position:sticky;top:0;z-index:20;background:rgba(22,23,26,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -24px;padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.snav{display:flex;gap:4px;flex-wrap:wrap}
.snav a{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 9px;border-radius:6px}
.snav a:hover{color:#fff;background:#26282c}
.stog{margin-left:auto}.stog .tdwin{margin:0!important}
.swrap section{scroll-margin-top:70px}
.sfoot{color:var(--muted);font-size:11px;line-height:1.6;margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:700px){.swrap{padding:0 16px 32px}.sbar{margin:0 -16px;padding:8px 16px}.stog{margin-left:0;width:100%;overflow-x:auto}.shero h1{font-size:24px}.shero img{width:48px;height:48px}}
</style>
</head>
<body>
<main class="swrap" id="page"><div class="loading" style="padding:60px 0">Loading…</div></main>
<script type="module">
import { renderTeamData } from "/assets/teampage.js";
import { pc, esc } from "/assets/core.js";
const page = document.getElementById("page");
const token = location.pathname.split("/")[2];
let X;
try { const r = await fetch(`/s/${token}/data.json`, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); X = await r.json(); }
catch { page.innerHTML = `<div class="loading" style="padding:60px 0">This link has expired.</div>`; throw new Error("no share"); }
document.title = `${X.name} · 2025-26 team report`;
const D = X.data, P = X.players || [];
const fx = (v) => (v == null ? "—" : (+v).toFixed(1));
const scol = (v) => pc(50 + Math.max(-45, Math.min(45, (v - 50) * 1.5)));
const W = D.games.filter((g) => g.pts > g.op).length, L = D.games.length - W;
const sec = (id, title, sub, body) => `<section id="${id}"><div class="shead"><h2>${title}</h2><span class="label">${sub}</span></div>${body}</section>`;
page.innerHTML = `
<div class="shero"><img src="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/${X.espnId}.png" alt="" onerror="this.remove()">
  <div><div class="label">Team report · 2025-26 · ${esc(X.conf)} · ${W}-${L} in D-I games</div><h1>${esc(X.name)}</h1></div></div>
<div class="sbar"><nav class="snav"><a href="#trends">Snapshot</a><a href="#roster">Roster</a><a href="#lineups">Lineups</a><a href="#pace">Pace</a><a href="#shooting">Shooting</a><a href="#defense">Defense</a></nav><div class="stog" id="tog"></div></div>
<section id="trends"><div id="td-trends"></div></section>
${sec("roster", "Roster", "2025-26 · per game · skill scores 1–100", `<div class="panel" style="overflow-x:auto;margin-top:14px"><table class="dtab"><thead><tr><th class="l">Player</th><th class="l">Cls</th><th class="l">Pos</th><th class="l">Ht</th><th>GP</th><th>MPG</th><th>PPG</th><th>RPG</th><th>APG</th><th>TS%</th><th>USG%</th><th class="sep">SCOR</th><th>PLAY</th><th>REB</th><th>DEF</th></tr></thead><tbody>
  ${[...P].sort((a, b) => (b.min || 0) - (a.min || 0)).map((p) => `<tr><td class="l" style="color:#fff;font-weight:600">${esc(p.name)}</td><td class="l m">${esc(p.cls || "")}</td><td class="l m">${esc(p.pos || "")}</td><td class="l m">${esc(p.ht || "")}</td><td class="m">${p.gp ?? "—"}</td><td>${fx(p.mpg)}</td><td style="font-weight:700">${fx(p.ppg)}</td><td>${fx(p.rpg)}</td><td>${fx(p.apg)}</td><td>${fx(p.ts)}</td><td>${fx(p.usg)}</td>${["sc", "pl", "rb", "df"].map((k, i) => `<td class="${i == 0 ? "sep" : ""}">${p[k] == null ? '<span class="m">—</span>' : `<span class="chip" style="background:${scol(p[k])}">${Math.round(p[k])}</span>`}</td>`).join("")}</tr>`).join("")}
  </tbody></table><div class="cap">Skill scores: 50 = D-I average, 70 = top 7%, 80+ = top 1%. Players with 50+ minutes.</div></div>`)}
${sec("lineups", "Lineups", "most-used groups · on/off", `<div id="td-lineups" style="margin-top:12px"></div>`)}
${sec("pace", "Pace", "possessions per 40 · seconds per possession", `<div id="td-pace" style="margin-top:12px"></div>`)}
${sec("shooting", "Shooting", "where they shoot · how well", `<div id="td-shooting" style="margin-top:12px"></div>`)}
${sec("defense", "Defense", "what they allow", `<div id="td-defense" style="margin-top:12px"></div>`)}
<div class="sfoot">Bronco IQ · Boise State men's basketball. Built from play-by-play of every 2025-26 D-I game; national ranks compare against all D-I teams. Use the buttons at the top to switch between the full season, conference games and the last 10, 5 or 1 games.</div>`;
const $ = (id) => document.getElementById(id);
renderTeamData({ toggle: $("tog"), trends: $("td-trends"), lineups: $("td-lineups"), pace: $("td-pace"), shooting: $("td-shooting"), defense: $("td-defense") }, D, X.dist, { players: P });
</script>
</body>
</html>
