<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Roster Builder · Bronco IQ</title>
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/68.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
/* Roster Builder: a depth chart (5 positions × starter / rotation / depth) with headshots. Each player
   gets minutes; the page projects individual averages and team success from them. */
.bwrap{max-width:1800px;margin:auto;padding:18px 24px 30px}
.btop{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.btop h1{margin-top:4px}.btop .sub{font-size:13px;color:var(--muted);margin-top:3px;max-width:760px}
.bact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.interim{border:1px dashed var(--edge);border-radius:8px;padding:9px 12px;font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.5}
.interim b{color:#fff}
.lay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.dc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.dgrid{display:grid;grid-template-columns:86px repeat(5,minmax(0,1fr));gap:8px}
.dh{font:600 12px var(--ui);letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:4px 0 2px}
.dh span{display:block;font:500 9.5px var(--mono);color:var(--muted);letter-spacing:.07em;margin-top:2px}
.dr{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:3px}
.dr b{color:#fff;font:600 12px var(--ui);letter-spacing:.04em}
.pc{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px;min-height:178px;display:flex;flex-direction:column;gap:7px;min-width:0}
.pc.st{border-color:#3d3f44;background:#1b1c1f}
.pc[data-filled]{cursor:grab;touch-action:none;transition:border-color .12s,background .12s}
.pc.lifted{opacity:.3}
.pc.over{border-color:#fff;background:#232529}
.pc .mins,.pc a,.pc button{cursor:auto}.pc a{cursor:pointer;color:inherit;text-decoration:none}.pc a:hover b{text-decoration:underline}
.pc img{-webkit-user-drag:none;user-select:none}
.ghost{position:fixed;z-index:1000;pointer-events:none;margin:0;cursor:grabbing;box-shadow:0 18px 40px rgba(0,0,0,.55);transform-origin:center;transition:transform .12s ease;border-color:#8a8e95!important}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none!important}
.rmzone{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:999;background:#1b1c1f;border:1px dashed #8a8e95;border-radius:10px;padding:14px 26px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);transition:opacity .15s,transform .15s}
body.dragging .rmzone{opacity:1;transform:translate(-50%,0)}
.rmzone.over{border-color:#fff;color:#fff;background:#2a2c30}
.pc .ptop{display:flex;gap:9px;align-items:flex-start;min-width:0}
.pc .fos{width:56px;height:70px}
.pc .nm{min-width:0;flex:1}
.pc .nm b{display:block;font-size:14px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc .nm .t{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .nm .tg{font:500 8.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.pc .x{position:absolute;z-index:3;top:6px;right:6px;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:#26282c;border:1px solid var(--line);color:var(--dim);cursor:pointer!important;font-size:11px;line-height:1}.pc .x:hover{color:#fff;border-color:#8a8e95;background:#303237}
.pc .ptop{padding-right:22px}
.mins{display:flex;align-items:center;gap:6px}
.mins input[type=range]{flex:1;min-width:0;accent-color:var(--good);height:4px}
.mins b{font:600 12px var(--ui);min-width:44px;text-align:right}.mins b span{font:500 9px var(--mono);color:var(--muted);margin-left:2px}
.line{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid var(--line2);padding-top:6px}
.line div{text-align:center}.line div b{display:block;font-size:14px;font-weight:700}.line div span{font:500 8.5px var(--mono);letter-spacing:.07em;color:var(--muted)}
.empty{flex:1;display:grid;place-items:center;background:none;border:1px dashed var(--edge);border-radius:7px;color:var(--muted);font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-height:150px}
.empty:hover{color:#fff;border-color:#8a8e95}
.side{position:sticky;top:12px;display:grid;gap:12px}
.ts{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.big{display:flex;align-items:baseline;gap:8px}.big b{font-size:40px;font-weight:800;letter-spacing:-.02em}
.tsg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tsg>div{background:var(--card);border-radius:8px;padding:9px 10px}.tsg b{display:block;font-size:19px;font-weight:750;margin-top:2px}.tsg .s{font-size:10.5px;color:var(--muted);margin-top:2px}
.mbar{height:6px;background:var(--card);border-radius:3px;overflow:hidden;margin-top:6px}.mbar i{display:block;height:100%}
.tbl td,.tbl th{padding:6px 6px}
.sortb{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0}.sortb:hover{color:#fff}
.tbl td.nm{display:flex;align-items:center;gap:8px}
.tbl .fos{width:28px;height:34px;border-radius:4px}
@media (max-width:1250px){.lay{grid-template-columns:1fr}.side{position:static;grid-template-columns:1fr 1fr}}
@media (max-width:900px){.dgrid{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto}.dgrid .dr,.dgrid .corner{display:none}.dc{overflow-x:auto}.side{grid-template-columns:1fr}}
@media print{.side{position:static}.mins input,.pc .x,.empty{display:none!important}}
</style>
</head>
<body>
<main class="bwrap" id="page"><div class="loading">Loading the player pool…</div></main>
<script type="module">
import { topBar, esc, pc as pcol, getJSON } from "/assets/core.js";
import { loadFO, shot, teamMark, loadScenarios, putScenario, delScenario, scenarioBarHTML, saveMenu, openPicker } from "/assets/fo.js";
topBar("builder");

const POS = [["PG", "Point guard"], ["SG", "Shooting guard"], ["W", "Wing"], ["F", "Forward"], ["C", "Center"]];
const ROWS = [["Starter", 31], ["Rotation", 9], ["Depth", 0]];
const AVG = 109.3, PACE = 68, GAMES = 31;
const uid = () => crypto.randomUUID();
const blank = () => ({ id: "draft", name: "Depth chart", grid: Object.fromEntries(POS.map(([k]) => [k, ["", "", ""]])), min: {} });

const FO = await loadFO();
// 2026-27 projections for every D-I team (scripts/build-proj27.mjs): used for the Pac-12 and postseason outlook.
const PJ = await getJSON("/data/proj-2027.json").catch(() => null);
const CURVE = PJ?.curve || [32.6, 30.1, 27.5, 24.8, 21.8, 18.2, 14.8, 11.4, 8.2, 5.3, 3.0, 1.5, 0.6, 0.2, 0.1];
let auto = (() => { try { return localStorage.getItem("biq-builder-auto") === "1"; } catch { return false; } })();
let SV = await loadScenarios("builder"), d = blank(), loaded = null, saveState = "", saveErr = "", sortKey = "min";
addEventListener("biq-me", async () => { SV = await loadScenarios("builder"); if (loaded?.scope === "me") loaded = null; render(); });
try { const x = JSON.parse(localStorage.getItem("biq-builder-draft") || "null"); if (x?.grid) { d = x; loaded = JSON.parse(localStorage.getItem("biq-builder-loaded2") || "null"); } } catch {}
const keep = () => { try { localStorage.setItem("biq-builder-draft", JSON.stringify(d)); localStorage.setItem("biq-builder-loaded2", JSON.stringify(loaded)); } catch {} };

// ---------------------------------------------------------------- projection (Win model v0.5)
// Each player's projected 2026-27 impact per 100 possessions (offense and defense) from the Win
// model: the measures that best predicted next-season results over 10 seasons, plus a year of
// growth for his class and age. Players without a D-I season (freshmen, international, custom)
// get the model's average for a freshman with no D-I history. Team ratings add up each player's
// projected impact weighted by his share of the 200 minutes, on top of a D-I average team.
const PRIOR = { pts40: 10, reb40: 6, ast40: 2, ts: 52, usg: 17, po: -1.9, pd: -0.7 };
// Freshmen with a 247 Composite rank use the model's freshman terms (rank + height) instead of the prior.
function project() {
  const placed = [];
  POS.forEach(([k], c) => d.grid[k].forEach((id, r) => { if (id) placed.push({ id, pos: k, row: r, p: FO.byId.get(id) }); }));
  const live = placed.filter((x) => x.p);
  // Even minutes ("auto"): ignore the depth chart and the sliders; players sorted by projected impact
  // get the average D-I minutes by rotation spot, the same way every other team is projected.
  const impOf = (x) => { const R = x.p.rates, src = R && R.min >= 100 ? R : null, fr = !src ? x.p.fr : null; return { src, fr, po: src?.pimpo ?? fr?.po ?? PRIOR.po, pd: src?.pimpd ?? fr?.pd ?? PRIOR.pd }; };
  // Rotation order from the team model's minutes model (projected impact, last season's minutes, returner
  // or transfer, newcomer), then the average D-I minutes for each rotation spot, as for every other team.
  const autoMin = new Map(autoOrder(live, impOf).map((x, i) => [x.id, CURVE[i] || 0]));
  const minOf = (x) => (auto ? autoMin.get(x.id) : d.min[x.id] ?? ROWS[x.row][1]);
  const totalMin = Math.round(live.reduce((a, x) => a + minOf(x), 0)), wScale = totalMin > 0 ? 200 / Math.max(200, totalMin) : 0;
  let oImp = 0, dImp = 0;
  const rows = live.map((x) => {
    const m = minOf(x), { src, fr, po, pd } = impOf(x);
    const r = src ? { pts40: src.pts40, reb40: src.reb40, ast40: src.ast40, ts: src.ts, usg: src.usg, po, pd } : { ...PRIOR };
    oImp += po * (m * wScale) / 40; dImp += pd * (m * wScale) / 40;
    return { ...x, m, r, prior: !src && !fr, fr, ppg: (r.pts40 || 0) * m / 40, rpg: (r.reb40 || 0) * m / 40, apg: (r.ast40 || 0) * m / 40 };
  });
  // Centered on the average 2026-27 D-I team and shrunk as the backtest says (PJ), so these numbers
  // match the Pac-12 outlook below.
  const netRaw = oImp + dImp, sh = PJ?.shrink ?? 1;
  const O = AVG + sh * (oImp - (PJ?.meanO ?? 0)), D = AVG - sh * (dImp - (PJ?.meanD ?? 0)), net = O - D;
  // Points are shared: scale everyone so the team scores what its offense rating says it should.
  const teamPts = (O * PACE) / 100, raw = rows.reduce((a, x) => a + x.ppg, 0), k = raw > 0 && totalMin >= 150 ? teamPts / raw : 1;
  for (const x of rows) x.ppg *= k;
  // Team model v2: projected margin per game vs. an average D-I team = player impact by minutes, plus the
  // program's last 3 seasons and the share of last season's Boise minutes that return (walk-forward test r = .88).
  const rate = teamRate(netRaw, live);
  const winP = Phi(rate / Math.hypot(PJ?.gameSd ?? 10.4, PJ?.teamSd ?? 4.4)), wins = Math.round(winP * GAMES);
  const proj = PJ ? PJ.teams.filter((t) => t.tid !== 68).map((t) => t.rate) : [];
  const rank = proj.length ? proj.filter((v) => v > rate).length + 1 : null;
  return { rows, O, D, net, netRaw, rate, wins, losses: GAMES - wins, rank, nTeams: proj.length + 1, totalMin, priors: rows.filter((x) => x.prior).length };
}

const Phi = (z) => 1 / (1 + Math.exp(-1.702 * z));
// Same rotation-order model as scripts/build-proj27.mjs (minutesFor).
function autoOrder(live, impOf) {
  const MB = PJ?.minutes ? Object.fromEntries(PJ.minutes.MF.map((k, i) => [k, PJ.minutes.b[i]])) : null;
  const L = live.map((x) => { const I = impOf(x), R = x.p.rates, hist = !!I.src, ret = hist && /^Boise St/.test(R?.team || ""); return { x, imp: I.po + I.pd, hist, ret, moved: hist && !ret, lastMpg: hist ? R.mpg || 0 : 0 }; })
    .sort((a, b) => b.imp - a.imp);
  if (!MB) return L.map((q) => q.x);
  const top8 = L.slice(0, 8).reduce((a, q) => a + q.imp, 0) / Math.min(8, L.length || 1);
  const sc = L.map((q, i) => { const f = { rel: q.imp - top8, ret: q.ret ? 1 : 0, hsh: q.ret ? q.lastMpg / 40 : 0, hshm: q.moved ? q.lastMpg / 40 : 0, fr: q.hist ? 0 : 1, nohist: q.hist ? 0 : 1 };
    for (let k = 1; k <= 11; k++) f["r" + k] = i + 1 === k ? 1 : 0; f.r12 = i + 1 >= 12 ? 1 : 0;
    return { q, v: Object.entries(MB).reduce((a, [k, b]) => a + b * (f[k] || 0), 0) }; });
  return sc.sort((a, b) => b.v - a.v).map((s) => s.q.x);
}
function teamRate(netRaw, live) {
  if (!PJ?.coef) return netRaw;
  const m26 = PJ.boise?.m26 || {}, tot = Object.values(m26).reduce((a, b) => a + b, 0);
  const ret = tot ? live.reduce((a, x) => a + (m26[x.p.cid || x.p.id] || 0), 0) / tot : 0;
  return PJ.coef.int + PJ.coef.netC * (netRaw / 5) + PJ.coef.hist3 * (PJ.boise?.hist3 ?? PJ.minH) + PJ.coef.ret * ret - PJ.rmean;
}
// ---------------------------------------------------------------- Pac-12 and postseason outlook
// Every other D-I team uses its 2026-27 roster projection (team model v2); Boise St. uses this depth
// chart. 3,000 simulated seasons: each team's true level varies around its projected margin (sd 4.4 per
// game, the backtest's miss), Pac-12 plays a home and an away game with everyone (home edge 2.2, game sd
// 10.4, both fit on 2018-26 games), then a 9-team conference tournament (8 v 9
// play-in). NCAA: top 46 nationally (at-large line) or Pac-12 tournament champion. Round reached by
// national rank, as you'd expect from seeding: top 32 = second round, top 16 = Sweet 16, top 4 = Final Four level.
const SIMS = 3000; let simKey = null, simOut = null;
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function outlook(netBoise) {
  if (!PJ) return null;
  const key = netBoise.toFixed(2); if (simKey === key) return simOut;
  const R = rng(27), gauss = () => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const T = PJ.teams.map((t) => ({ ...t, r: t.tid === 68 ? netBoise : t.rate })), TSD = PJ.teamSd ?? 4.4, GSD = PJ.gameSd ?? 10.4, HOME = PJ.home ?? 2.2;
  const pac = T.filter((t) => t.conf === "Pac-12"), n = pac.length;
  const acc = pac.map((t) => ({ t, w: 0, fin: 0, first: 0, champ: 0, ncaa: 0, r32: 0, s16: 0, f4: 0, ranks: [], finishes: new Array(n).fill(0) }));
  const all = new Float64Array(T.length), pacIdx = pac.map((p) => T.indexOf(p));
  for (let s = 0; s < SIMS; s++) {
    for (let i = 0; i < T.length; i++) all[i] = T[i].r + TSD * gauss();
    const rv = pacIdx.map((i) => all[i]), wins = new Array(n).fill(0);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (i !== j) { if (R() < Phi((rv[i] - rv[j] + HOME) / GSD)) wins[i]++; else wins[j]++; }
    const order = [...Array(n).keys()].sort((a, b) => wins[b] - wins[a] || R() - 0.5);
    order.forEach((ti, place) => { acc[ti].fin += place + 1; acc[ti].finishes[place]++; if (place === 0) acc[ti].first++; acc[ti].w += wins[ti]; });
    const g = (a, b) => (R() < Phi((rv[a] - rv[b]) / GSD) ? a : b), sd = order; // sd[0] = 1 seed
    const pi = n >= 9 ? g(sd[7], sd[8]) : sd[7];
    const q = [g(sd[0], pi), g(sd[3], sd[4]), g(sd[1], sd[6]), g(sd[2], sd[5])];
    const champ = g(g(q[0], q[1]), g(q[2], q[3])); acc[champ].champ++;
    for (let k = 0; k < n; k++) {
      const me = rv[k]; let rank = 1; for (let i = 0; i < all.length; i++) if (all[i] > me) rank++;
      acc[k].ranks.push(rank);
      if (rank <= 46 || k === champ) { acc[k].ncaa++; if (rank <= 32) acc[k].r32++; if (rank <= 16) acc[k].s16++; if (rank <= 4) acc[k].f4++; }
    }
  }
  const med = (a) => { const b = [...a].sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };
  simOut = acc.map((a) => ({ team: a.t.team, tid: a.t.tid, r: a.t.r, rank: med(a.ranks), w: a.w / SIMS, l: 2 * (n - 1) - a.w / SIMS, fin: a.fin / SIMS, first: a.first / SIMS, champ: a.champ / SIMS, ncaa: a.ncaa / SIMS, r32: a.r32 / SIMS, s16: a.s16 / SIMS, f4: a.f4 / SIMS, mode: a.finishes.indexOf(Math.max(...a.finishes)) + 1 })).sort((a, b) => a.fin - b.fin);
  simKey = key; return simOut;
}
const ordn = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
const pct = (v) => (v >= 0.995 ? ">99%" : v < 0.005 ? "<1%" : Math.round(v * 100) + "%");
function outlookHTML(J) {
  if (!PJ || !J.rows.length) return "";
  const O = outlook(J.rate); if (!O) return "";
  const me = O.find((x) => x.tid === 68);
  const tier = me.rank <= 4 ? "Final Four level" : me.rank <= 16 ? "Sweet 16 level" : me.rank <= 32 ? "NCAA second-round level" : me.rank <= 46 ? "NCAA at-large level" : me.rank <= 80 ? "bubble / NIT level" : "outside the postseason picture";
  const bar = (l, v) => `<div style="display:grid;grid-template-columns:118px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin-top:6px"><span>${l}</span><div class="mbar" style="margin:0"><i style="width:${Math.round(v * 100)}%;background:${pcol(50 + Math.max(-45, Math.min(45, (v - 0.3) * 120)))}"></i></div><b style="text-align:right;font:600 12px var(--mono)">${pct(v)}</b></div>`;
  return `<div class="ts"><div class="label">Pac-12 outlook · 2026-27</div>
    <table class="tbl" style="margin-top:8px;font-size:12px"><thead><tr><th class="l">Team</th><th><span data-def="projnet">Margin</span></th><th>Natl</th><th>Conf</th><th>1st</th><th>NCAA</th></tr></thead><tbody>
    ${O.map((x) => `<tr style="${x.tid === 68 ? "background:rgba(255,255,255,.06);font-weight:700" : ""}"><td class="l">${esc(x.team)}</td><td>${sg(x.r)}</td><td class="m">#${x.rank}</td><td class="m">${x.w.toFixed(1)}-${x.l.toFixed(1)}</td><td>${pct(x.first)}</td><td>${pct(x.ncaa)}</td></tr>`).join("")}
    </tbody></table>
    <div class="label" style="margin-top:14px">Boise St. postseason · this depth chart</div>
    <div style="font-size:13px;margin-top:6px">Projected <b>#${me.rank}</b> nationally, most likely <b>${ordn(me.mode)}</b> in the Pac-12 (avg ${me.fin.toFixed(1)}): <b>${tier}</b>.</div>
    ${bar("Wins Pac-12 (reg.)", me.first)}${bar("Wins Pac-12 tourney", me.champ)}${bar("Makes NCAA", me.ncaa)}${bar("2nd round (top 32)", me.r32)}${bar("Sweet 16 (top 16)", me.s16)}
    <div class="cap" style="margin-top:8px">3,000 simulated seasons. Other teams: their 2026-27 rosters through the same model and even minutes. NCAA = top 46 nationally or Pac-12 tournament champion; rounds by national rank (top 32 ≈ second round). Net = projected margin per 100 possessions vs. an average D-I team.</div></div>`;
}

// ---------------------------------------------------------------- render
const page = document.getElementById("page");
const f1 = (v) => (v == null || !isFinite(v) ? "—" : v.toFixed(1)), sg = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
const pctOfRank = (r, n) => (r && n ? 100 * (1 - (r - 1) / (n - 1)) : null);
function render() {
  const J = project(), byId = new Map(J.rows.map((x) => [x.id, x]));
  const card = (k, r) => {
    const id = d.grid[k][r], p = id ? FO.byId.get(id) : null, x = byId.get(id);
    if (!p) return `<div class="pc${r === 0 ? " st" : ""}" data-cell="${k}:${r}"><button class="empty" data-pick="${k}:${r}">＋ Add player</button></div>`;
    const m = x.m;
    return `<div class="pc${r === 0 ? " st" : ""}" data-cell="${k}:${r}" data-filled="1" title="Drag to move or swap">
      <button class="x" data-clear="${k}:${r}" aria-label="Remove ${esc(p.name)}" title="Remove from depth chart">✕</button>
      <div class="ptop">${shot(p)}<div class="nm"><a href="${esc(p.href)}" draggable="false"><b>${esc(p.name)}</b></a><div class="t">${teamMark(p, 15)}<span>${esc(p.school)}</span></div><div class="tg">${esc(p.type)}${p.pos ? " · " + esc(p.pos) : ""}${p.ht ? " · " + esc(p.ht) : ""}</div></div></div>
      <div class="mins"><input type="range" min="0" max="40" step="1" value="${Math.round(m)}" data-min="${esc(id)}" aria-label="Projected minutes"${auto ? ' disabled title="Even minutes is on: minutes come from his projected rank on this roster"' : ""}><b><span id="mv-${esc(id)}">${Math.round(m)}</span><span>MPG</span></b></div>
      <div class="line"><div><b id="pp-${esc(id)}">${f1(x.ppg)}</b><span>PTS</span></div><div><b>${f1(x.rpg)}</b><span>REB</span></div><div><b>${f1(x.apg)}</b><span>AST</span></div><div><b>${x.r.ts != null ? Math.round(x.r.ts) : "—"}</b><span>TS%</span></div></div></div>`;
  };
  const tone = J.rate >= 3 ? "var(--good)" : J.rate <= -3 ? "var(--bad)" : "#fff";
  const sorted = [...J.rows].sort((a, b) => (sortKey === "name" ? a.p.name.localeCompare(b.p.name) : (b[sortKey === "min" ? "m" : sortKey] ?? 0) - (a[sortKey === "min" ? "m" : sortKey] ?? 0)));
  page.innerHTML = `
  <div class="btop">
    <div><div class="label">Front office</div><h1>Roster Builder</h1><div class="sub">Set the depth chart and minutes; the page projects each player's averages and the team's success. Pull players in from a Salary Cap scenario or add them one by one.</div></div>
    <div class="bact noprint">
      <span class="label" style="color:${saveState === "error" ? "var(--bad)" : "var(--muted)"}">${saveState === "saving" ? "Saving…" : saveState === "saved" ? (loaded?.scope === "staff" ? "Saved to staff scenarios" : "Saved to my scenarios") : saveState === "error" ? esc(saveErr || "Save failed") : ""}</span>
      <button class="fbtn" id="fromcap">From Salary Cap</button><button class="fbtn" id="print">Print</button><button class="fbtn" id="reset">Reset</button>
      <button class="fbtn go" id="save">Save scenario <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </div>
  ${scenarioBarHTML(SV, loaded)}
  <div class="interim"><b>Projections: Win model v0.5 players, team model v2, the same method as every 2026-27 team projection.</b> Team ratings add up each player's projected 2026-27 impact per 100 possessions (the measures that best predicted next-season results over 10 seasons, plus a year of growth) by his share of the minutes. Stat lines are his last D-I season's per-40 rates at the minutes set here, scaled to the team's projected scoring. Freshmen are projected from the model's freshman terms (247 Composite rank and height), learned from 10 recruiting classes. ${J.priors ? `${J.priors} player${J.priors > 1 ? "s" : ""} with no D-I season and no ranking use the model's average freshman.` : ""} Drag a card to move or swap it; drag it to the bottom of the screen or click ✕ to remove it.</div>
  <div class="lay">
    <div>
      <div class="dc"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="label">Depth chart name</span><input class="foin" id="dname" value="${esc(d.name)}" aria-label="Depth chart name" style="height:32px;max-width:320px;margin:0"></div><div class="dgrid">
        <div class="corner"></div>${POS.map(([k, l]) => `<div class="dh">${k}<span>${l}</span></div>`).join("")}
        ${ROWS.map(([lab, m], r) => `<div class="dr"><b>${lab}</b>${r === 0 ? "≈ 30+ min" : r === 1 ? "≈ 10–20 min" : "spot minutes"}</div>${POS.map(([k]) => card(k, r)).join("")}`).join("")}
      </div></div>
      <section><div class="shead"><h2>Projected averages</h2><span class="label">click a header to sort</span></div>
        <div class="panel" style="margin-top:12px;overflow-x:auto">${J.rows.length ? `<table class="tbl"><thead><tr><th class="l"><button class="sortb" data-sort="name">Player</button></th><th class="l">Spot</th><th><button class="sortb" data-sort="min">MPG</button></th><th><button class="sortb" data-sort="ppg">PTS</button></th><th><button class="sortb" data-sort="rpg">REB</button></th><th><button class="sortb" data-sort="apg">AST</button></th><th>TS%</th><th>USG%</th><th><span data-def="pimp">Proj. impact</span></th><th class="l">Basis</th></tr></thead><tbody>
        ${sorted.map((x) => { const net = (x.r.po || 0) + (x.r.pd || 0); return `<tr><td class="l nm">${shot(x.p)}<span><a href="${esc(x.p.href)}" style="color:inherit"><b style="font-weight:600">${esc(x.p.name)}</b></a><br><span class="m" style="font-size:11px">${esc(x.p.school)}</span></span></td><td class="l m">${x.pos} · ${ROWS[x.row][0]}</td><td>${x.m}</td><td style="font-weight:700">${f1(x.ppg)}</td><td>${f1(x.rpg)}</td><td>${f1(x.apg)}</td><td>${x.r.ts != null ? f1(x.r.ts) : "—"}</td><td>${x.r.usg != null ? f1(x.r.usg) : "—"}</td><td><span class="chip" style="background:${pcol(50 + Math.max(-45, Math.min(45, net * 9)))}">${sg(net)}</span></td><td class="l m" style="font-size:11px">${x.fr ? esc(x.fr.basis) : x.prior ? "average freshman (no ranking)" : `${x.p.rates?.team || ""} '26`}</td></tr>`; }).join("")}
        </tbody></table>` : `<div class="m" style="color:var(--muted)">Add players to the depth chart to see projected averages.</div>`}</div></section>
    </div>
    <aside class="side">
      <div class="ts"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="label">Minutes</span><div class="seg2" id="automode"><button data-auto="0" class="${auto ? "" : "on"}">Manual</button><button data-auto="1" class="${auto ? "on" : ""}">Even (by talent)</button></div></div>
        <div class="cap" style="margin-top:6px">${auto ? "Even: depth chart and sliders are ignored. Players are put in rotation order by the team model's minutes model (projected impact, last season's minutes, returner or newcomer) and given the average D-I minutes for that spot (32, 30, 28, 25, 22, 18, 15, 11, 8, 5…), the same way every other team below is projected." : "Manual: the minutes you set on each card."}</div></div>
      <div class="ts"><div class="label">Projected team success</div>
        <div class="big"><b style="color:${tone}">${J.rows.length ? sg(J.rate) : "—"}</b><span class="label" data-def="projnet">proj. margin / game vs avg D-I</span></div>
        <div class="tsg">
          <div><span class="label">Record</span><b>${J.rows.length ? `${J.wins}-${J.losses}` : "—"}</b><div class="s">vs. an average D-I team, ${GAMES} games</div></div>
          <div><span class="label">D-I rank</span><b style="color:${J.rank ? (pctOfRank(J.rank, J.nTeams) >= 70 ? "var(--good)" : pctOfRank(J.rank, J.nTeams) <= 30 ? "var(--bad)" : "#fff") : "#fff"}">${J.rows.length && J.rank ? "≈ #" + J.rank : "—"}</b><div class="s">${J.nTeams ? `of ${J.nTeams}, 2026-27 projections` : ""}</div></div>
          <div><span class="label" data-def="adjo">Offense</span><b>${J.rows.length ? f1(J.O) : "—"}</b><div class="s">pts / 100 · D-I avg ${AVG}</div></div>
          <div><span class="label" data-def="adjd">Defense</span><b>${J.rows.length ? f1(J.D) : "—"}</b><div class="s">allowed / 100</div></div>
        </div>
        <div style="margin-top:12px"><div style="display:flex;justify-content:space-between"><span class="label">Minutes</span><span class="label" style="color:${J.totalMin > 200 ? "var(--bad)" : "#fff"}">${J.totalMin} / 200</span></div><div class="mbar"><i style="width:${Math.min(100, J.totalMin / 2)}%;background:${J.totalMin > 200 ? "var(--bad)" : "var(--good)"}"></i></div>
        <div class="cap" style="margin-top:6px">${J.totalMin > 200 ? "Over 200: everyone's share of the minutes is scaled down." : J.totalMin < 200 ? `${200 - J.totalMin} minutes unassigned.` : "All 200 minutes assigned."}</div></div>
      </div>
      ${outlookHTML(J)}
      <div class="ts"><div class="label">Projected leaders</div>
        ${[["Points", "ppg"], ["Rebounds", "rpg"], ["Assists", "apg"]].map(([l, k]) => { const top = [...J.rows].sort((a, b) => b[k] - a[k]).slice(0, 3); return `<div style="margin-top:10px"><div class="label" style="font-size:9.5px;margin-bottom:4px">${l}</div>${top.map((x) => `<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><a href="${esc(x.p.href)}" style="color:inherit">${esc(x.p.name)}</a><b>${f1(x[k])}</b></div>`).join("") || `<div class="m" style="color:var(--muted);font-size:12px">—</div>`}</div>`; }).join("")}
      </div>
    </aside>
  </div>`;
}

// ---------------------------------------------------------------- events
const cell = (s) => { const [k, r] = s.split(":"); return [k, +r]; };
const inUse = () => new Set(Object.values(d.grid).flat().filter(Boolean));
const changed = () => { saveState = ""; keep(); };
page.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "dname") { d.name = t.value; changed(); return; }
  // Minutes slider: update the number live; re-draw the projections when the slider is let go.
  if (t.dataset.min) { d.min[t.dataset.min] = +t.value; changed(); const s = document.getElementById("mv-" + t.dataset.min); if (s) s.textContent = t.value; }
});
page.addEventListener("change", (e) => { if (e.target.dataset.min) render(); });
page.addEventListener("click", (e) => { const b = e.target.closest("[data-auto]"); if (!b) return; auto = b.dataset.auto === "1"; try { localStorage.setItem("biq-builder-auto", auto ? "1" : "0"); } catch {} render(); });
page.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return; const ds = b.dataset;
  if (ds.pick) { const [k, r] = cell(ds.pick); openPicker({ title: `Add ${k} · ${ROWS[r][0]}`, types: ["Returner", "Transfer", "Freshman"], players: FO.players, exclude: inUse(), onPick: (p) => { d.grid[k][r] = p.id; delete d.min[p.id]; changed(); render(); } }); }
  else if (ds.clear) { const [k, r] = cell(ds.clear); const id = d.grid[k][r]; d.grid[k][r] = ""; if (id) delete d.min[id]; changed(); render(); }
  else if (ds.sort) { sortKey = ds.sort; render(); }
  else if (ds.load) { const [scope, id] = ds.load.split(/:(.*)/); const s = (scope === "me" ? SV.mine : SV.staff).find((x) => x.id === id); if (s) { d = { ...JSON.parse(JSON.stringify(s)), id: "draft" }; loaded = { scope, id }; saveState = ""; keep(); render(); } }
  else if (ds.del) { if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Delete?"; return; } const [scope, id] = ds.del.split(/:(.*)/); remove(scope, id); }
  else if (b.id === "reset") { d = blank(); loaded = null; saveState = ""; keep(); render(); }
  else if (b.id === "print") print();
  else if (b.id === "save") saveMenu(b, { S: SV, loaded, name: d.name.trim() || "Depth chart", onPick: saveTo });
  else if (b.id === "fromcap") fromCap(b);
});

// Drag and drop with the pointer (mouse, pen or touch): press on a card and move it; it lifts
// out under the pointer. Drop on another spot to move there (or swap with the player there),
// or on the bar at the bottom of the screen to take him off the depth chart. The minutes
// slider, the name link and the ✕ button never start a drag.
const rmzone = document.createElement("div"); rmzone.className = "rmzone"; rmzone.textContent = "Drop here to remove from the depth chart"; document.body.appendChild(rmzone);
let drag = null;
page.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || e.target.closest("input,button,a,select,textarea")) return;
  const c = e.target.closest(".pc[data-filled]"); if (!c) return;
  e.preventDefault();
  drag = { from: c.dataset.cell, el: c, x0: e.clientX, y0: e.clientY, on: false, target: null };
});
function liftCard(e) {
  const r = drag.el.getBoundingClientRect();
  const g = drag.el.cloneNode(true); g.classList.add("ghost"); g.removeAttribute("data-cell");
  Object.assign(g.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
  document.body.appendChild(g); requestAnimationFrame(() => (g.style.transform = "scale(1.04) rotate(-1deg)"));
  drag.ghost = g; drag.dx = e.clientX - r.left; drag.dy = e.clientY - r.top; drag.on = true;
  drag.el.classList.add("lifted"); document.body.classList.add("dragging");
}
addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return; liftCard(e); }
  drag.ghost.style.left = e.clientX - drag.dx + "px"; drag.ghost.style.top = e.clientY - drag.dy + "px";
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const t = under?.closest(".rmzone") || under?.closest(".pc[data-cell]");
  if (t !== drag.target) { drag.target?.classList.remove("over"); drag.target = t && t !== drag.el ? t : null; drag.target?.classList.add("over"); }
  // scroll the page when the card nears the top or bottom edge
  if (e.clientY < 70) scrollBy(0, -14); else if (e.clientY > innerHeight - 70 && !drag.target?.classList.contains("rmzone")) scrollBy(0, 14);
});
function endDrag(drop) {
  if (!drag) return;
  const D = drag; drag = null;
  D.target?.classList.remove("over"); D.ghost?.remove(); D.el.classList.remove("lifted"); document.body.classList.remove("dragging");
  if (!drop || !D.on || !D.target) return;
  const [k1, r1] = cell(D.from);
  if (D.target.classList.contains("rmzone")) { const id = d.grid[k1][r1]; d.grid[k1][r1] = ""; if (id) delete d.min[id]; }
  else { const [k2, r2] = cell(D.target.dataset.cell); [d.grid[k1][r1], d.grid[k2][r2]] = [d.grid[k2][r2], d.grid[k1][r1]]; }
  changed(); render();
}
addEventListener("pointerup", () => endDrag(true));
addEventListener("pointercancel", () => endDrag(false));
addEventListener("keydown", (e) => { if (e.key === "Escape") endDrag(false); });

// Fill the depth chart from a saved Salary Cap scenario: players go to their position, best first.
async function fromCap(btn) {
  const caps = await loadScenarios("cap");
  let draft = null; try { draft = JSON.parse(localStorage.getItem("biq-cap-draft") || "null"); } catch {}
  const opts = [...(draft?.slots ? [{ name: "Current Salary Cap draft", slots: draft.slots }] : []), ...caps.mine.map((x) => ({ ...x, name: "Mine · " + x.name })), ...caps.staff.map((x) => ({ ...x, name: "Staff · " + x.name }))];
  if (!opts.length) { alertBox("No Salary Cap scenarios yet. Build one on the Salary Cap page first."); return; }
  document.querySelector(".fomenu")?.remove();
  const m = document.createElement("div"); m.className = "fomenu"; const r = btn.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - 230)) + "px"; m.style.top = r.bottom + 6 + "px";
  m.innerHTML = opts.map((o, i) => `<button data-i="${i}">${esc(o.name)}</button>`).join("");
  document.body.appendChild(m);
  const off = (ev) => { if (!m.contains(ev.target)) { m.remove(); removeEventListener("mousedown", off, true); } }; setTimeout(() => addEventListener("mousedown", off, true));
  m.onclick = (ev) => {
    const b = ev.target.closest("button"); if (!b) return; m.remove(); removeEventListener("mousedown", off, true);
    const ids = opts[+b.dataset.i].slots.map((s) => s.playerId).filter((id) => id && FO.byId.has(id));
    const P = ids.map((id) => FO.byId.get(id)).sort((a, b) => (b.rates?.ppg || 0) - (a.rates?.ppg || 0));
    const g = Object.fromEntries(POS.map(([k]) => [k, ["", "", ""]]));
    const want = (p) => { const s = String(p.pos || "").toUpperCase(); return /^C|^B/.test(s) ? ["C", "F"] : /F/.test(s) ? ["F", "W", "C"] : /W/.test(s) ? ["W", "SG", "F"] : /PG/.test(s) ? ["PG", "SG"] : ["SG", "PG", "W"]; };
    const left = [];
    for (const p of P) { let ok = false; for (let r = 0; r < 3 && !ok; r++) for (const k of want(p)) if (!g[k][r]) { g[k][r] = p.id; ok = true; break; } if (!ok) left.push(p); }
    for (const p of left) outer: for (let r = 0; r < 3; r++) for (const [k] of POS) if (!g[k][r]) { g[k][r] = p.id; break outer; }
    d.grid = g; d.min = {}; changed(); render();
  };
}
function alertBox(msg) { const h = document.createElement("div"); h.className = "fomodal"; h.innerHTML = `<div class="fobox" style="width:min(380px,100%)"><div class="fohd"><b>Roster Builder</b><button class="fox">✕</button></div><div style="padding:16px;font-size:13.5px;color:var(--dim)">${esc(msg)}</div></div>`; h.onclick = (e) => { if (e.target === h || e.target.closest(".fox")) h.remove(); }; document.body.appendChild(h); }
async function saveTo(scope, asNew) {
  const id = !asNew && loaded?.scope === scope ? loaded.id : uid();
  saveState = "saving"; render();
  try { SV[scope === "me" ? "mine" : "staff"] = await putScenario("builder", scope, { ...JSON.parse(JSON.stringify(d)), id, name: d.name.trim() || "Depth chart" }); loaded = { scope, id }; saveState = "saved"; }
  catch (e) { saveState = "error"; saveErr = e.message; }
  keep(); render();
}
async function remove(scope, id) {
  try { SV[scope === "me" ? "mine" : "staff"] = await delScenario("builder", scope, id); if (loaded?.scope === scope && loaded?.id === id) loaded = null; saveState = ""; }
  catch (e) { saveState = "error"; saveErr = e.message; }
  keep(); render();
}
render();
</script>
