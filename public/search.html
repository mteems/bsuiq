<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Player Search · Bronco IQ</title>
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/68.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
.swrap{max-width:1800px;margin:auto;padding:22px 24px 40px}
.shd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.shd h1{font-size:28px;margin-top:6px}
.shd p{font-size:13.5px;color:var(--dim);margin-top:4px}
.badge{font:11px var(--mono);letter-spacing:.05em;color:var(--soft);border:1px solid var(--edge);border-radius:6px;padding:8px 11px;white-space:nowrap}
.badge b{color:#fff;font-weight:500}
/* natural-language search */
.nl{display:flex;gap:8px;margin-top:18px}
.nlbox{position:relative;flex:1}
.nlbox svg{position:absolute;left:13px;top:15px;color:var(--muted)}
.nlbox input{width:100%;height:46px;background:var(--panel);border:1px solid var(--edge);border-radius:8px;color:var(--text);font:600 14px var(--ui);padding:0 14px 0 38px;outline:none}
.nlbox input:focus{border-color:#8a8e95}
.sugg{position:absolute;left:0;right:0;top:50px;z-index:40;background:#0f1011;border:1px solid var(--edge);border-radius:8px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line2);color:var(--soft);font:600 12.5px var(--ui);padding:9px 12px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover{background:var(--card);color:#fff}
.sugg .h{font:9.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
.btn{height:34px;background:var(--card);border:1px solid var(--edge);border-radius:7px;color:var(--soft);font:600 12.5px var(--ui);padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{color:#fff;border-color:#55595f}
.btn.on{background:#f2f3f4;color:#16171a;border-color:#f2f3f4}
.btn.pri{background:#f2f3f4;color:#16171a;border-color:#f2f3f4;font-weight:700}
.btn.pri:hover{background:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:none;border-color:transparent}
.btn.big{height:46px;padding:0 20px;font-size:13.5px}
.btn i{font:normal 10px var(--mono);background:var(--bg);border:1px solid var(--edge);border-radius:4px;padding:1px 5px;color:var(--dim)}
.interp{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.interp button{background:var(--card);border:1px solid var(--edge);border-radius:4px;color:var(--soft);font:500 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;cursor:pointer}
.interp button:hover{color:#fff;border-color:#8a8e95}
.interp button span{color:var(--faint);margin-left:5px}
/* filter bar */
.fbar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:16px}
.frow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.frow2{display:grid;grid-template-columns:minmax(280px,1fr) 160px 14px 160px auto;gap:14px;align-items:end;margin-top:14px}
.fl{font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block}
.fsel{margin-top:5px;width:100%;height:38px;background:var(--bg);border:1px solid var(--edge);border-radius:7px;color:var(--text);font:600 13px var(--ui);padding:0 10px;outline:none;cursor:pointer}
.fsel:focus{border-color:#8a8e95}
.colon{text-align:center;color:var(--faint);padding-bottom:10px;font-weight:700}
.dd{position:relative}
.ddt{margin-top:5px;width:100%;height:38px;background:var(--bg);border:1px solid var(--edge);border-radius:7px;color:var(--text);font:600 13px var(--ui);padding:0 10px;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left}
.ddt:hover{border-color:#55595f}
.ddt span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ddt svg{flex:none;color:var(--muted)}
.ddm{position:absolute;z-index:45;top:46px;left:0;min-width:100%;width:340px;max-width:calc(100vw - 32px);background:#0f1011;border:1px solid var(--edge);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.55);overflow:hidden}
.ddm.r{left:auto;right:0}
.ddm .srch{padding:8px;border-bottom:1px solid var(--line)}
.ddm .srch input{width:100%;height:32px;background:var(--panel);border:1px solid var(--edge);border-radius:6px;color:var(--text);font:600 12px var(--ui);padding:0 10px;outline:none}
.ddm .list{max-height:330px;overflow-y:auto;padding:4px}
.ddm .grp{font:9.5px var(--mono);letter-spacing:.09em;color:var(--muted);padding:9px 8px 4px}
.opt{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-radius:5px;color:var(--soft);font:600 12.5px var(--ui);padding:7px 8px;cursor:pointer;text-align:left}
.opt:hover{background:var(--card);color:#fff}
.opt.on{background:var(--edge);color:#fff}
.opt .ck{margin-left:auto;color:#fff;font-size:12px}
.opt.stat strong{color:#fff;font-weight:700;min-width:36px}
.allb{width:24px;height:24px;flex:none;border:1px dashed #61656c;border-radius:4px;display:grid;place-items:center;font:500 7.5px var(--mono);color:var(--muted)}
.cfb{width:24px;height:24px;flex:none;border:1px solid var(--edge);border-radius:4px;display:grid;place-items:center;font:500 7.5px var(--mono);color:var(--dim);background:var(--card)}
.clogo{width:24px;height:24px;flex:none;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:14px}
.chips .h{font:9.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-right:2px}
.chip2{background:var(--card);border:1px solid var(--edge);border-radius:999px;color:var(--soft);font:600 11.5px var(--ui);padding:5px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip2:hover{color:#fff}
.chip2 s{text-decoration:none;color:var(--faint)}
.sf{display:flex;align-items:center;border:1px solid var(--edge);border-radius:7px;overflow:hidden;background:var(--bg)}
.sf .k{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:0 10px}
.sf select,.sf input{height:32px;background:var(--card);border:0;border-left:1px solid var(--edge);color:#fff;font:600 12px var(--ui);padding:0 8px;outline:none}
.sf input{width:84px}
.sf button{background:none;border:0;border-left:1px solid var(--edge);color:var(--muted);height:32px;padding:0 9px;cursor:pointer}
.sf button:hover{color:#fff}
.saved{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.saved button{background:var(--card);border:0;color:#fff;font:600 11.5px var(--ui);padding:5px 11px;cursor:pointer}
.saved button+button{border-left:1px solid var(--edge);color:var(--muted);padding:5px 8px}
.matches{font:10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:12px}
/* selected team/conference banner */
.sban{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-top:14px}
.sban .it{display:flex;align-items:center;gap:10px}
.sban .n{font-size:14px;font-weight:750;text-transform:uppercase;letter-spacing:.01em}
.sban .s{font:9.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:2px}
/* toolbar */
.tbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
.tbar .l,.tbar .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cnt{font:11px var(--mono);color:var(--muted)}
.colmenu{position:absolute;z-index:45;top:40px;left:0;width:250px;background:#0f1011;border:1px solid var(--edge);border-radius:8px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.colmenu .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 4px 8px;margin-bottom:4px}
.colmenu .hd button{background:none;border:0;color:#fff;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.box{width:16px;height:16px;border:1px solid #61656c;border-radius:4px;display:grid;place-items:center;flex:none;font-size:11px;color:#16171a}
.box.on{background:#f2f3f4;border-color:#f2f3f4}
/* selection bar */
.selbar{position:sticky;top:58px;z-index:25;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#1b1c1f;border:1px solid #8a8e95;border-radius:10px;padding:10px 12px;margin-top:14px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.selbar .pill{background:#f2f3f4;color:#16171a}
/* results grid */
.res{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.rgrid{display:grid;align-items:center;width:100%}
.rhead{position:sticky;top:51px;z-index:20;background:#232428;border-bottom:1px solid var(--edge);border-radius:10px 10px 0 0;padding:7px 12px;font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.hc{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;cursor:grab;height:100%}
.hc.name{justify-content:flex-start}
.hc.st::before,.cell.st::before{content:"";position:absolute;left:0;top:50%;height:16px;width:1px;background:#3f4247;transform:translateY(-50%)}
.hc button{position:relative;background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:5px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.hc.st button{flex:1}
.hc button:hover{background:var(--card);color:#fff}
.hc button.on{background:#f2f3f4;color:#16171a;font-weight:600}
.hc button sup{position:absolute;right:-5px;top:-6px;background:#8a8e95;color:#16171a;border-radius:3px;font-size:8px;padding:0 3px;line-height:13px}
.hc.drop{outline:1px dashed #8a8e95;outline-offset:-2px;border-radius:4px}
.row{border-top:1px solid var(--line2)}
.row.open{position:relative;z-index:5;margin:8px 0;border:1px solid #8a8e95;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.45);background:#202125}
.row.open+.row{border-top:0}
.rmain{min-height:86px;padding:10px 12px;cursor:pointer}
.rmain:hover{background:#232428}
.row.open .rmain{background:#26282c;border-radius:10px 10px 0 0}
.pcell{display:flex;align-items:center;gap:12px;min-width:0}
.sel{width:18px;height:18px;flex:none;border:1px solid #61656c;border-radius:4px;background:none;display:grid;place-items:center;cursor:pointer;color:transparent;font-size:12px;padding:0}
.sel.on{background:#f2f3f4;border-color:#f2f3f4;color:#16171a}
.hs{width:52px;height:64px;flex:none;border-radius:6px;overflow:hidden;background:#2e3034;display:grid;place-items:end center}
.hs img{width:100%;height:100%;object-fit:cover;object-position:top}
.hs b{font:600 12px var(--mono);color:var(--dim);padding-bottom:8px}
.pn{font-size:15px;font-weight:750;line-height:1.2;color:#fff}
.pn:hover{text-decoration:underline;text-underline-offset:3px}
.ps{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:var(--dim);line-height:1.2}
.pj{font:500 11px var(--mono);color:var(--faint);margin-top:6px}
.cell{position:relative;display:flex;align-items:center;justify-content:center;height:100%;min-height:44px;font:500 13px var(--mono);color:var(--soft);padding:0 2px;white-space:nowrap}
.cell.t{font:600 12.5px var(--ui);color:var(--dim)}
.cell.na{color:var(--faint)}
.acts{display:flex;gap:4px;justify-content:flex-end;padding-left:6px}
.ib{width:32px;height:32px;border:1px solid var(--edge);border-radius:6px;background:none;color:var(--dim);display:grid;place-items:center;cursor:pointer}
.ib:hover{color:#fff;border-color:#8a8e95}
.ib.ghost{border-color:transparent}
.more{padding:18px;text-align:center;color:var(--muted);font:11px var(--mono)}
.empty{padding:40px 18px;text-align:center;color:var(--muted);font-size:13px}
/* expanded */
.xp{border-top:1px solid var(--edge);padding:12px;background:#1b1c1f;border-radius:0 0 10px 10px}
.hist{border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--panel)}
.hrow{display:grid;grid-template-columns:170px repeat(14,minmax(46px,1fr));align-items:center;min-width:860px;padding:9px 12px;border-top:1px solid var(--line2);border-left:3px solid transparent}
.hrow.hh{background:#232428;border-top:0;border-left-color:transparent;font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:7px 12px}
.hrow.hh div{text-align:center}.hrow.hh div:first-child{text-align:left}
.hrow.cur{border-left-color:#f2f3f4;background:#26282c}
.hrow.car{border-left-color:#8a8e95;background:#222327}
.hrow .k{font:600 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.hrow.cur .k{color:#fff}
.hrow .sch{font-size:11.5px;color:var(--muted);margin-top:2px}
.hrow .v{text-align:center;font:500 12.5px var(--mono);color:var(--soft)}
.hrow .yr{text-align:center;font:500 12px var(--mono);color:var(--muted)}
.gx{margin-top:10px}
.gxh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gxh .label{color:var(--dim)}
.gxg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.gbox h3{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;display:flex;justify-content:space-between;margin-bottom:2px}
.gbox h3 span{color:var(--muted);font-weight:400;letter-spacing:.04em;text-transform:none}
.gl{display:grid;grid-template-columns:minmax(120px,1fr) auto auto;gap:10px;align-items:center;border-top:1px solid var(--line2);padding:7px 0;font-size:12px}
.gl:first-of-type{border-top:0}
.gl .o{font-weight:700;color:#fff}
.gl .o span{font:10px var(--mono);color:var(--muted);margin-left:8px;font-weight:400}
.gl .ln{font:11px var(--mono);color:var(--dim);white-space:nowrap}
@media (max-width:1300px){.gl{grid-template-columns:1fr auto}.gl .ln{grid-column:1/-1;white-space:normal}}
.W{color:var(--good);font:600 11px var(--mono)}.L{color:var(--bad);font:600 11px var(--mono)}
.gnone{border:1px dashed var(--edge);border-radius:6px;padding:16px;text-align:center;color:var(--muted);font-size:12px}
.full{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.full>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:#fff;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;cursor:pointer}
.full .tw{max-height:330px;overflow:auto;border-top:1px solid var(--line)}
.full table{min-width:820px;font-size:12px}
.full th{position:sticky;top:0;background:#232428;padding:8px 8px;text-align:center}
.full td{text-align:center;font-family:var(--mono);font-size:11.5px;padding:6px 8px}
.full th.l,.full td.l{text-align:left}
.full td.l{font-family:var(--ui);font-weight:600}
.nd{font:9px var(--mono);letter-spacing:.06em;color:var(--muted);border:1px solid var(--edge);border-radius:3px;padding:0 4px;margin-left:6px}
tr.ndr td{color:var(--faint)}
.err{background:#2a2226;border:1px solid #4a3036;color:#f0b4bd;border-radius:7px;padding:8px 10px;font-size:12px;margin-bottom:8px}
/* modal */
.mbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--edge);border-radius:12px;max-width:min(1000px,100%);width:100%;max-height:90vh;overflow:auto;padding:18px}
.modal.sm{max-width:420px}
.modal h2{font-size:18px}
.modal .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.modal .x{float:right;background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}
.modal input.tx{margin-top:14px;width:100%;height:38px;background:var(--bg);border:1px solid var(--edge);border-radius:7px;color:var(--text);font:600 13px var(--ui);padding:0 10px;outline:none}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.cmp{display:grid;margin-top:14px;min-width:640px}
.cmp>div{padding:10px;border-bottom:1px solid var(--line2);text-align:center;font:500 13px var(--mono);color:var(--soft)}
.cmp>div.lab{text-align:left;font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#1b1c1f}
.cmp>div.top{border-bottom:1px solid var(--edge)}
.cmp .hs{margin:auto;width:64px;height:78px}
.cmp .nm{font:700 13.5px var(--ui);color:#fff;margin-top:8px}
.cmp .best{color:var(--good);font-weight:600}
@media (max-width:1180px){.frow{grid-template-columns:repeat(3,minmax(0,1fr))}.frow2{grid-template-columns:1fr 1fr 14px 1fr}.frow2>div:first-child{grid-column:1/-1}.frow2>.btns{grid-column:1/-1}}
@media (max-width:1100px){.res{overflow-x:auto}.rhead{position:static}.rin{min-width:1080px}}
@media (max-width:700px){.swrap{padding:16px 16px 32px}.frow{grid-template-columns:1fr 1fr}.frow2{grid-template-columns:1fr 14px 1fr}.frow2>div:first-child,.frow2>.btns{grid-column:1/-1}.gxg{grid-template-columns:1fr}.nl .btn.big{padding:0 14px}.selbar{top:8px}}
</style>
</head>
<body>
<main class="swrap">
  <div class="shd">
    <div>
      <div class="label">Recruiting</div>
      <h1>Player Search</h1>
      <p>Filter the player pool, review complete histories, and pull up any player's page.</p>
    </div>
    <div class="badge" id="badge" data-def="s_pool">Loading players…</div>
  </div>

  <div class="nl">
    <div class="nlbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="nlq" placeholder="Search player, team, conference, or describe a player profile..." autocomplete="off" aria-label="Search players">
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <button class="btn pri big" id="apply" disabled>Apply</button>
  </div>
  <div class="interp" id="interp"></div>

  <div class="fbar" id="fbar"></div>
  <div id="sban"></div>
  <div class="tbar" id="tbar"></div>
  <div id="selbar"></div>
  <div class="res"><div class="rin" id="rin"><div class="loading">Loading players…</div></div></div>
  <footer id="foot"></footer>
</main>
<div id="modal"></div>
<script type="module">
import { topBar, esc, getJSON, addDefs } from "/assets/core.js";
import * as H from "/assets/search-logic.js";
topBar("search");

addDefs({
  s_pool: ["Player pool", "Every D-I player who played last season (2025-26), with his full college history. Numbers come from our play-by-play pipeline and count D-I games only."],
  s_season: ["Season", "The season shown on this row: his latest season."],
  s_class: ["Class", "Class last season."],
  s_pos: ["Position", "G = guard, F = forward, B = big."],
  s_ht: ["Height", "Listed height."],
  gp: ["Games played", "D-I games with at least one minute."],
  fg_pct: ["Field goal %", ""], two_pct: ["2-point %", "Made twos ÷ attempted twos."], three_pct: ["3-point %", ""], ft_pct: ["Free throw %", ""],
  efg_pct: ["Effective FG %", "Field-goal % with threes worth 1.5×."], usage_pct: ["Usage %", "Share of his team's possessions he used while on the floor (Barttorvik)."],
  mpg: ["Minutes per game", ""], ppg: ["Points per game", ""], rpg: ["Rebounds per game", ""], apg: ["Assists per game", ""], spg: ["Steals per game", ""], topg: ["Turnovers per game", "Lower is better."],
  s_best: ["Best / worst games", "Game score = PTS + 0.7·REB + 0.7·AST + 2·STL + 2·BLK − TO. Only games where he played at least 75% of his usual minutes (and 12+) count. Non-D-I games are left out."],
});

// ---------------------------------------------------------------- state
const STAT_KEYS = H.cols.filter((c) => c.key && !H.baseSearchColumns.has(c.key)).map((c) => c.key);

// ---------------------------------------------------------------- data
const nameKey = (s) => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/["“”][^"“”]*["“”]/g, " ").replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, " ").replace(/[^a-z]/g, "");
const schoolKey = (s) => String(s || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").replace(/\b(university|college|the|of)\b/g, " ").replace(/\bst\b/g, "state").replace(/\bsaint\b/g, "state").replace(/\s+/g, " ").trim();

function sameSchool(a, b) {
  const x = schoolKey(a), y = schoolKey(b);
  if (!x || !y) return false;
  if (x === y || x.startsWith(y + " ") || y.startsWith(x + " ")) return true;
  const A = tokens(a), B = tokens(b); let o = 0; for (const t of A) if (B.has(t)) o++;
  return o > 0 && o / Math.max(1, Math.min(A.size, B.size)) >= 0.99;

const darkLogo = (u) => String(u || "").replace("/teamlogos/ncaa/500/", "/teamlogos/ncaa/500-dark/");
function link(hub) {
  // Team branding from the hub, keyed by the hub's school names.
  const brand = new Map(hub.teams.map(([n, c, l, al]) => [n, { name: n, conf: c, logo: darkLogo(l), aliases: al || [] }]));
  for (const [n, l] of hub.confs) confLogo.set(n, l);
  // 1) ESPN ids by name + school.
  const byName = new Map();
  for (const r of hub.players) { const k = nameKey(r[1] + r[2]); if (!byName.has(k)) byName.set(k, []); byName.get(k).push(r); }
  const votes = new Map(), lastKey = new Map();
  const ourCount = new Map(); for (const p of P) { const k = nameKey(p.first_name + p.last_name); ourCount.set(k, (ourCount.get(k) || 0) + 1); }
  for (const p of P) {
    const k = nameKey(p.first_name + p.last_name), all = byName.get(k) || [];
    let c = all.filter((r) => sameSchool(p.school, r[3]));
    // Moved since last season (hub shows his new school): accept when the name is unique on both sides.
    if (!c.length && all.length === 1 && ourCount.get(k) === 1) { p.espn = all[0][0]; p.photo = !!all[0][5]; continue; }
    if (c.length === 1) { p.espn = c[0][0]; p.photo = !!c[0][5]; const v = votes.get(p.school) || new Map(); v.set(c[0][3], (v.get(c[0][3]) || 0) + 1); votes.set(p.school, v); }
  }
  // 2) Our team name → the hub's school (most common match), then logos + 2026-27 conference.
  const hubSchool = new Map();
  for (const [t, v] of votes) hubSchool.set(t, [...v].sort((a, b) => b[1] - a[1])[0][0]);
  for (const t of new Set(P.map((p) => p.school))) {
    let b = brand.get(hubSchool.get(t));
    if (!b) for (const x of brand.values()) if (sameSchool(t, x.name) || x.aliases.some((a) => sameSchool(t, a))) { b = x; break; }
    teamInfo.set(t, b || null);
  }
  // 3) Second pass: same last name + first initial at the matched hub school (nicknames, spelling).
  const bySchool = new Map();
  for (const r of hub.players) { if (!bySchool.has(r[3])) bySchool.set(r[3], []); bySchool.get(r[3]).push(r); }
  const taken = new Set(P.filter((p) => p.espn).map((p) => p.espn));
  for (const p of P) {
    if (p.espn) continue;
    const pool = bySchool.get(hubSchool.get(p.school) || teamInfo.get(p.school)?.name) || [];
    const c = pool.filter((r) => !taken.has(r[0]) && nameKey(r[2]) === nameKey(p.last_name) && nameKey(r[1])[0] === nameKey(p.first_name)[0]);
    if (c.length === 1) { p.espn = c[0][0]; p.photo = !!c[0][5]; taken.add(p.espn); }
  }
  for (const p of P) { const b = teamInfo.get(p.school); p.logo = b?.logo || ""; if (b?.conf) p.conference = b.conf; }
  window.biqSearch = { matched: P.filter((p) => p.espn).length, photos: P.filter((p) => p.photo).length, total: P.length, noLogo: [...teamInfo].filter(([, b]) => !b?.logo).map(([t]) => t) };
}
async function load(refresh = false) {

    getJSON("/api/hub/link" + (refresh ? "?refresh=1" : "")).catch((e) => ({ teams: [], confs: [], players: [], error: String(e.message || e) })),
    getJSON("/data/rosters-2027.json").catch(() => ({})),
  ]);
  meta = { built: data.built, note: data.note, hubError: hub.error, season: data.season };
  D1 = rosters.d1 ? new Set(rosters.d1.map(String)) : null;
  const pc = data.pcols, sc = data.scols;
  P = data.players.map((r) => { const o = Object.fromEntries(pc.map((k, i) => [k, r[i]])); return { id: o.id, first_name: o.first, last_name: o.last, school: o.team, conference: o.conf, position: o.pos, height: o.ht, class_year: o.cls, jersey_number: o.jersey, hometown: o.home, high_school: o.hs, seasons: [] }; });
  for (const r of data.seasons) {

// ---------------------------------------------------------------- filtering + sorting (hub logic)
const metric = (p, k) => { const s = H.current(p); if (k === "height") return H.heightInches(p.height) || null; const v = s?.[k]; return v == null || !Number.isFinite(+v) ? null : +v; };
function sortVal(p, k) {
  if (k === "name") return `${p.last_name} ${p.first_name}`;
  if (k === "position") return p.position;
  if (k === "class") return H.classRank(p.class_year);
  if (k === "season") return H.current(p)?.season ?? "";
  return metric(p, k) ?? 0;
}
function compute() {
  const ns = S.ns;
  const filters = { query: S.query, position: S.position, minClass: S.minClass, maxClass: S.maxClass, conference: "All", teams: S.teams, minHeight: S.minH, maxHeight: S.maxH, recentOnly: false, statFilters: S.statFilters };
  const sorts = [{ key: S.sortKey, direction: S.dir }, ...S.sec];
  const vals = new Map();
  const v = (p, k) => { let m = vals.get(p); if (!m) vals.set(p, (m = {})); return k in m ? m[k] : (m[k] = sortVal(p, k)); };
  visible = P.filter((p) =>
    H.passesPlayerFilters(p, H.current(p), filters) &&
    (!S.confs.length || S.confs.includes(p.conference)) &&
    !S.excluded.includes(p.conference) &&
    (!ns?.includedConferences?.length || ns.includedConferences.includes(p.conference)) &&
    !(ns?.excludedClasses ?? []).includes(p.class_year),
  ).sort((a, b) => {
    for (const s of sorts) {
      const x = v(a, s.key), y = v(b, s.key);
      const d = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y));
      if (d) return s.direction === "asc" ? d : -d;

  });
}

const GAMES = new Map(), full = new Set();
function expandedHTML(p) {

  if (c) { const u = p.seasons.filter((x) => x.usage_pct != null), m = u.reduce((a, x) => a + x.gp, 0); c.usage_pct = m ? Math.round((u.reduce((a, x) => a + x.usage_pct * x.gp, 0) / m) * 10) / 10 : null; }

async function loadGames(p) {
  if (!p.espn || GAMES.has(p.id)) return;
  GAMES.set(p.id, { loading: true });
  try {
    const seasons = [...new Set(p.seasons.map((s) => s.season))].slice(0, 6).join(",");
    const r = await getJSON(`/api/hub/games/espn-${p.espn}?seasons=${seasons}`);
    GAMES.set(p.id, { games: r.games || [], errors: r.errors || [] });
  } catch (e) { GAMES.set(p.id, { games: [], error: String(e.message || e) }); }
  if (expanded.has(p.id)) replaceRow(p.id);
}
const gdate = (d) => (d ? new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "2-digit", timeZone: "UTC" }) : "—");
const isD1 = (g) => !D1 || !g.oppId || D1.has(String(g.oppId));
function gamesHTML(p) {

  const d1 = games.filter(isD1);
  const mpg = new Map(p.seasons.map((s) => [s.season, Number(s.mpg || 0)]));
  const q = (g, m) => g.min >= Math.max(12, (mpg.get(g.season) ?? H.current(p)?.mpg ?? 0) * m);
  let el = d1.filter((g) => q(g, 0.75)), reduced = false;
  if (el.length < 3) { el = d1.filter((g) => q(g, 0.6)); reduced = true; }
  const score = (g) => g.pts + 0.7 * g.reb + 0.7 * g.ast + 2 * g.stl + 2 * g.blk - g.to;
  const sorted = [...el].sort((a, b) => score(b) - score(a));
  const groups = [["Best 3 Games", sorted.slice(0, 3)], ["Worst 3 Games", [...sorted].reverse().slice(0, 3)]];
  const res = (g) => `<span class="${g.result === "W" ? "W" : g.result === "L" ? "L" : ""}">${esc(g.result || "—")} ${g.tm ?? "—"}–${g.op ?? "—"}</span>`;
  const nd = games.length - d1.length;
  return `<div class="gxh"><span class="label">${loading ? "Loading career game logs…" : `${d1.length} career D-I games${nd ? ` <span style="color:var(--faint)">· ${nd} non-D-I left out</span>` : ""}`}</span><span class="label" data-def="s_best" style="color:var(--faint)">How games are ranked</span></div>
    ${st.error ? `<div class="err">Game logs unavailable: ${esc(st.error)}</div>` : ""}
    <div class="gxg">${groups.map(([l, rows]) => `<section class="gbox"><h3>${l}${reduced && rows.length ? `<span>Reduced sample</span>` : ""}</h3>${rows.length ? rows.map((g) => `<div class="gl"><div class="o">${g.atVs === "@" ? "@" : "vs"} ${esc(g.opp)}<span>${gdate(g.date)}</span></div>${res(g)}<div class="ln">${g.pts} PTS · ${g.reb} REB · ${g.ast} AST · ${g.stl} STL · ${g.blk} BLK · ${g.to} TO · ${g.min} MIN</div></div>`).join("") : `<div class="gnone">${loading ? "Loading games…" : "No qualifying games"}</div>`}</section>`).join("")}</div>
    ${games.length ? `<section class="full"><button data-full="1">Full game log <span>${full.has(p.id) ? "▴" : "▾"}</span></button>${full.has(p.id) ? `<div class="tw"><table><thead><tr>${["Date", "Opponent", "Result", "MIN", "PTS", "REB", "AST", "STL", "BLK", "TO", "FG", "3P", "FT"].map((h, i) => `<th class="${i < 2 ? "l" : ""}">${h}</th>`).join("")}</tr></thead><tbody>${games.map((g) => `<tr class="${isD1(g) ? "" : "ndr"}"><td class="l">${gdate(g.date)}</td><td class="l">${g.atVs === "@" ? "@" : "vs"} ${esc(g.opp)}${isD1(g) ? "" : `<span class="nd">NON-D-I</span>`}</td><td>${res(g)}</td>${[g.min, g.pts, g.reb, g.ast, g.stl, g.blk, g.to].map((v) => `<td>${v}</td>`).join("")}<td>${g.fgm}-${g.fga}</td><td>${g.tpm}-${g.tpa}</td><td>${g.ftm}-${g.fta}</td></tr>`).join("")}</tbody></table></div>` : ""}</section>` : ""}`;
}

// ---------------------------------------------------------------- render
function renderAll() { compute(); remember(); renderInterp(); renderFilters(); renderBanner(); renderToolbar(); renderSelbar(); renderResults(); }
load().catch((e) => alertBox("Could not load player data. " + (e.message || "")));
</script>
</body>
</html>
