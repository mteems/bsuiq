<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Player · Bronco IQ</title>
<link rel="icon" href="https://a.espncdn.com/i/teamlogos/ncaa/500-dark/68.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
/* Player page layout follows the boisestate.ai mockups (Shot Profile, Playmaking & Defense):
   one long page, small label line, big name, sections stacked with h2 + mono sublabel. */
.pwrap{max-width:1240px;margin:auto;padding:24px 24px 32px}
.pwrap h1{font-size:28px;margin-top:6px}
.pwrap section{margin-top:28px}
.pwrap h2{font-size:20px}
.prof td:first-child{color:var(--soft)}
iframe.mod{width:100%;border:0;display:block;min-height:400px;background:var(--bg)}
.glchart svg{width:100%;display:block}
.phead{display:flex;gap:22px;align-items:stretch;position:relative}
.pshot{width:200px;min-height:150px;flex:none;border-radius:10px;background:#26282c;position:relative;overflow:hidden}
.pshot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.pmain{flex:1;min-width:0}.pteam{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;flex-wrap:wrap}.pteam .m{color:var(--muted)}
.pfacts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:10px}.pf{display:flex;flex-direction:column;gap:2px}.pf b{font-size:13.5px;font-weight:600}
.pbtns{flex:none;align-self:flex-start;display:flex;gap:8px}
.povr{flex:none;align-self:flex-start;border:1px solid var(--line,#2c2f34);border-radius:10px;padding:12px 16px 10px;background:#1b1d20}
.povr-in{display:flex;gap:14px;align-items:center;margin:6px 0 4px}.povr .sring{width:118px;height:118px}
.povr-k{display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--muted)}.povr-k>span{display:flex;flex-direction:column;gap:2px}.povr-k b{font-size:14px;color:var(--text);font-family:var(--mono)}
.nbtn{flex:none;align-self:flex-start;background:#26282c;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 14px;font:600 13px var(--ui,inherit);cursor:pointer}
.nbtn:hover{background:#2f3136}.nbtn b{display:inline-block;min-width:18px;margin-left:6px;padding:1px 6px;border-radius:9px;background:#3a3d42;font-size:11px}
.ndrawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#1b1c1f;border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.4)}
.ndrawer[hidden]{display:none}.nhead{display:flex;align-items:baseline;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.nhead b{font-size:16px}.nhead .m{color:var(--muted);font-size:12px}
.nhead button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
.nform{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.nwho{display:flex;flex-wrap:wrap;gap:5px}.nwho button{background:#26282c;border:1px solid var(--line);color:var(--soft,#c9ccd2);border-radius:6px;padding:5px 9px;font:600 12px inherit;cursor:pointer}.nwho button:hover{color:#fff;border-color:#55595f}.nwho button.on{background:#f2f3f4;color:#16171a;border-color:#f2f3f4}
.nform textarea{background:#26282c;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;font:13px inherit}.nform textarea{min-height:90px;resize:vertical}
.nrow{display:flex;align-items:center;gap:10px}.nrow .m{color:var(--muted);font-size:11.5px;flex:1}
#nlist{overflow-y:auto;padding:6px 18px 18px;flex:1}.snote{padding:12px 0;border-bottom:1px solid #2a2c30}.snote .who{display:flex;gap:8px;align-items:baseline;font-size:12px}.snote .who b{font-size:13px}.snote .who .m{color:var(--muted)}
.snote .who button{margin-left:auto;background:none;border:0;color:#6b6e75;font-size:11px;cursor:pointer}.snote .who button:hover{color:var(--bad)}.snote p{margin-top:6px;font-size:13.5px;line-height:1.5;color:#dfe2e6;white-space:pre-wrap}
@media (max-width:700px){.phead{flex-wrap:wrap;align-items:flex-start}.pshot{width:120px;min-height:110px}.pbtns{position:absolute;top:0;right:0}.povr{width:100%}}
@media (max-width:900px){.pwrap{padding:16px 16px 28px}.two{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<main class="pwrap" id="page"><div class="loading">Loading player…</div></main>
<script type="module">
import { d3, pc, chip, tc, f1, f0, esc, tipOn, tipOff, LG, getJSON, playerName, shortSchool, topBar } from "/assets/core.js";
import { renderShotChart } from "/assets/shotchart.js";
import { skillCards, ring, scol, tierOf, ord } from "/assets/scores.js";
import { pdPBP, shotProfile } from "/assets/pd-pbp.js";
import { espnGames } from "/assets/pool.js";
topBar("player");
// Boise St. MBB staff (broncosports.com), by last name.
const STAFF = ["Rice (L.)", "Voigt", "Alston", "Bergersen", "Burns", "Charles", "Few", "Rice (M.)", "Teems", "Yount"];

const id = decodeURIComponent(location.pathname.split("/")[2] || "");
const page = document.getElementById("page");
let D;
try { D = await getJSON("/data/players/" + encodeURIComponent(id) + ".json"); }
catch (e) { page.innerHTML = `<div class="loading">${/not found|404/i.test(e.message) ? "This player isn't in the Bronco IQ data yet." : `Couldn't load this player (${esc(e.message)}).`}</div>`; throw e; }
// One page per player: a Boise St. roster player's Search id opens his roster page.
if (D.redirect) { location.replace("/player/" + encodeURIComponent(D.redirect) + location.hash); await new Promise(() => {}); }

// Every other D-I player (Search): same page from our pipeline's numbers. ESPN id for the live
// play-by-play and game log: staff fix > build match > Recruiting Hub match (Search's order).
const PIPE = D.player.source === "pipeline";
const LINKS = await getJSON("/api/search/links").catch(() => null);
const NKEY = D.player.cid || id; // staff notes and photo fixes are keyed by our canonical id
if (PIPE) {
  let e = LINKS?.espn?.[id] || D.player.espnId;
  if (!e) { try { const { loadPool } = await import("/assets/pool.js"); e = (await loadPool()).byId.get(id)?.espn || null; } catch {} }
  D.player.espnId = e || null;
  if (D.pbp) D.pbp.espn = e || null;
  if (e && D.modules[0]) D.modules[0].src += `&espn=${encodeURIComponent(e)}`;
}
const P = D.player, S = D.seasons, last = S[S.length - 1] || null;
const PBP = D.pbp && D.pbp.espn && !(D.shots || []).some((x) => x.season === D.pbp.label) ? pdPBP(D.pbp) : null;
document.title = `${playerName(P)} · Bronco IQ`;
const qualified = (s) => s && s.d.gp >= 8 && (s.d.mpg ?? 0) >= 8;
const pctOf = (s, k) => (qualified(s) ? s.pct.metrics[k]?.pct ?? null : null);
const yr = (s) => "'" + s.slice(5);

// Label line in the mockup's format: "Player · 2025-26 · North Dakota St. · G · 6'0" · Graduate"
const labelBits = ["Player", last ? last.season : "2026-27", last ? shortSchool(last.school) : "Boise St.", P.position, P.height, P.class_year].filter(Boolean);
const pathBits = [];
for (const s of S) if (!pathBits.length || pathBits[pathBits.length - 1].school !== s.school) pathBits.push({ school: s.school, from: s.season, to: s.season }); else pathBits[pathBits.length - 1].to = s.season;
const pathText = pathBits.map((p) => `${shortSchool(p.school)} ${p.from === p.to ? yr(p.from) : yr(p.from) + "–" + yr(p.to)}`).join(" → ");

const photo = LINKS?.photo?.[NKEY] || (P.espnId ? `https://a.espncdn.com/combiner/i?img=/i/headshots/mens-college-basketball/players/full/${P.espnId}.png&w=400&h=400&scale=crop` : "");
const teamName = P.onRoster ? "Boise St." : shortSchool(P.school || last?.school || ""), teamId = P.onRoster ? 68 : P.espnTeamId;
const conf = P.onRoster ? "Pac-12" : P.conference;
const fact = (l, v) => (v ? `<div class="pf"><span class="label">${l}</span><b>${esc(v)}</b></div>` : "");
// Overall score: the headline rating, shown in the header.
const OV = D.scores?.skills?.s?.overall;
const PGN = { G: "guards", F: "forwards", C: "bigs" };
const sgn = (v, d = 1) => (v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(d));
const ovrBlock = OV ? `<div class="povr"><div class="label"><span data-def="overall">Overall</span> · ${esc(D.scores.skills.season)}</div>
  <div class="povr-in">${ring(OV.score)}<div>
    <span class="stag" style="background:${scol(OV.score)};margin-top:0">${tierOf(OV.score).toUpperCase()}</span>
    <div class="srank" style="font-size:14px;margin-top:6px">${OV.rank ? `${ord(OV.rank)} of ${OV.pool.toLocaleString()}` : "—"}</div>
    ${OV.oprk && OV.wpg ? `<div class="m" style="font-size:12px;margin-top:2px">${ord(OV.oprk)} among ${PGN[OV.wpg] || "his position"}</div>` : ""}
    <div class="povr-k"><span><span data-def="tal">Talent/100</span><b>${sgn(OV.tal)}</b></span><span><span data-def="winscore">Win</span><b>${OV.wn == null ? "—" : OV.wn.toFixed(0)}</b></span><span><span data-def="pimp">Proj '27</span><b>${sgn(OV.pimp)}</b></span></div>
  </div></div><a class="cap" href="/rankings#nat/ovr" style="color:var(--soft)">Overall rankings →</a></div>` : "";
const ini = (playerName(P).match(/\b\w/g) || []).slice(0, 2).join("");
page.innerHTML = `
<div class="phead">
  <div class="pshot">${photo ? `<img src="${esc(photo)}" alt="" onerror="this.remove()">` : ""}</div>
  <div class="pmain">
    <div class="label">${labelBits.map(esc).join(" · ")}</div>
    <h1>${esc(playerName(P))}</h1>
    <div class="pteam">${teamId ? LG(+teamId, 22) : ""}<b>${esc(teamName)}</b>${conf ? `<span class="m">· ${esc(conf)}</span>` : ""}${P.jersey_number ? `<span class="m">· #${esc(P.jersey_number)}</span>` : ""}${P.onRoster ? `<span class="m">· 2026-27 roster</span>` : ""}</div>
    <div class="pfacts">${fact("Pos", P.position)}${fact("Ht", P.height)}${fact("Wt", P.weight ? P.weight + " lb" : "")}${fact("Class", P.class_year)}${fact("Hometown", P.hometown)}${fact("High school", P.high_school)}${pathText && pathBits.length > 1 ? fact("Path", pathText + (P.onRoster ? " → Boise St." : "")) : P.onRoster && pathText ? fact("Path", pathText + " → Boise St.") : ""}</div>
    <div class="cap" style="margin-top:8px">Hover any dotted stat name for its definition. <span style="color:var(--good)">Orange = good</span> · <span style="color:var(--bad)">blue = poor</span>.</div>
  </div>
  ${ovrBlock}
  <div class="pbtns"><button class="nbtn" id="tbbtn" title="Add to targets or the transfer board"><span id="tbtxt">Targets &amp; board</span></button><button class="nbtn" id="nbtn">Staff notes <b id="ncount"></b></button></div>
</div>
<div class="ndrawer" id="ndrawer" hidden><div class="nhead"><b>Staff notes</b><span class="m">${esc(playerName(P))}</span><button id="nclose" aria-label="Close">✕</button></div>
  <div class="nform"><div class="label">Your name</div><div class="nwho" id="nauthor">${STAFF.map((n) => `<button data-who="${esc(n)}">${esc(n)}</button>`).join("")}</div>
  <textarea id="ntext" placeholder="Add a note…"></textarea><div class="nrow"><span class="m" id="nmsg">Today's date is logged with the note.</span><button class="btn" id="nadd" disabled>Add note</button></div></div>
  <div id="nlist"><div class="m">Loading…</div></div></div>
<div id="s-scores"></div>
<div id="s-shoot"></div>
<div id="s-pd"></div>
<div id="s-seasons"></div>
<div id="s-games"></div>
<footer>Sources: ${PIPE ? "our play-by-play pipeline (D-I games), Barttorvik, ESPN play-by-play and game logs (live)" : "ESPN season box scores and play-by-play shot locations, ESPN game logs (live)"}. <span data-def="pool">Percentiles</span> compare against D-I rotation players for the same season. </footer>`;

// Profile table in the mockup's format: Stat | His | D-I med | D-I pct
function profileTable(s, rows) {
  const q = qualified(s), pm = s.pct;
  return `<table class="prof"><thead><tr><th class="l">Stat</th><th>His</th><th>D-I med</th><th>D-I pct</th></tr></thead><tbody>
    ${rows.map(([k, l, fm]) => { const m = pm.metrics[k], p = q ? m.pct : null; return `<tr><td class="l"><span data-def="${k}">${l}</span></td><td style="font-weight:700;color:${m.dir === 0 ? "var(--text)" : tc(p)}">${fm(m.v)}</td><td class="m">${fm(m.med)}</td><td>${m.dir === 0 ? `<span class="chip" style="background:#3a3d42">${p ?? "—"}</span>` : chip(p)}</td></tr>`; }).join("")}
  </tbody></table><div class="cap">Chip = percentile rank (100 = best) among ${pm.poolN.toLocaleString()} D-I rotation players${pm.fallback ? ` (${pm.poolSeason} pool)` : ""}. Lower-is-better stats are already flipped.${q ? "" : ` Small sample (${s.gp} GP, ${f1(s.mpg)} mpg): percentiles hidden.`}</div>`;
}
const fx2 = (v) => (v == null ? "—" : v.toFixed(2));

// ======================================================= SKILL SCORES
(function skillScores() {
  const el = document.getElementById("s-scores"), SC = D.scores || {};
  const panels = [];
  if (SC.skills) panels.push(skillCards(SC.skills));
  if (!panels.length) {
    el.innerHTML = last ? `<section><div class="shead"><h2>Skill scores</h2><span class="label">1–100 vs D-I rotation players</span></div><div class="story">${(last.season === "2025-26" && last.gp * last.mpg >= 50) ? "Scores for this player fill in with the next data refresh." : `No 2025-26 skill score: needs 50+ minutes in the 2025-26 season (last season on file: ${last.season}, ${last.gp} GP, ${f1(last.mpg)} mpg).`} See all rankings on the <a href="/rankings" style="color:var(--text);text-decoration:underline">Rankings page</a>.</div></section>` : "";
    return;
  }
  el.innerHTML = `<section><div class="shead"><h2>Skill scores</h2><span class="label">50 = D-I average · 70 = top 7% · 80+ = top 1%</span></div>
    <div class="grid two" style="grid-template-columns:${panels.length > 1 ? "1.35fr 1fr" : "1fr"}">${panels.join("")}</div></section>`;
})();

// ======================================================= SHOOTING (Shot Profile mockup)
(function shooting() {
  const el = document.getElementById("s-shoot");
  const SH = D.shots || [];
  if (SH.length) {
    let si = SH.length - 1;
    el.innerHTML = `<section><div class="shead"><h2>Shooting</h2><span class="label" id="shsub"></span>${SH.length > 1 ? `<div style="margin-left:auto" class="seg" id="sseas">${SH.map((s, i) => `<button data-i="${i}">${s.season.slice(2)}</button>`).join("")}</div>` : ""}</div><div id="shot"></div></section>`;
    const draw = () => {
      const sp = SH[si];
      el.querySelectorAll("#sseas button").forEach((b) => b.classList.toggle("on", +b.dataset.i === si));
      document.getElementById("shsub").textContent = `${sp.season} · ${sp.team} · where he shoots · how well · every attempt`;
      renderShotChart(document.getElementById("shot"), sp);
    };
    el.querySelectorAll("#sseas button").forEach((b) => (b.onclick = () => { si = +b.dataset.i; draw(); }));
    draw();
    return;
  }
  if (!last) {
    el.innerHTML = `<section><div class="shead"><h2>Shooting</h2><span class="label">No college stats yet</span></div><div class="story">No college season on file.${P.onRoster ? " Freshmen and international players get stats and a shot chart once games start." : ""}</div></section>`;
    return;
  }
  const fallback = (why) => {
    el.innerHTML = `<section><div class="shead"><h2>Shooting</h2><span class="label">${last.season} · ${esc(shortSchool(last.school))} · efficiency vs D-I</span></div>
    <div class="grid two" style="grid-template-columns:1.15fr 1fr"><div class="panel"><div class="label ptitle">Scoring profile vs D-I</div>
    ${profileTable(last, [["ppg", "Points / g", f1], ["pts40", "Points / 40", f1], ["ts", "True shooting %", f1], ["efg", "Effective FG %", f1], ["p3", "3-point %", f1], ["ft", "Free throw %", f1], ["tpar", "3PA rate", f1], ["ftr", "FT rate", f1]])}</div>
    <div class="panel"><div class="label ptitle">Shot chart</div><div class="story" style="margin-top:0">${why}</div></div></div></section>`;
  };
  if (!PBP) { fallback("No charted shots for this player: no ESPN play-by-play on file for his latest D-I season."); return; }
  el.innerHTML = `<section><div class="shead"><h2>Shooting</h2><span class="label" id="shsub">${D.pbp.label} · ${esc(D.pbp.school)} · where he shoots · how well · every attempt</span></div><div id="shot"><div class="loading">Reading ESPN play-by-play…</div></div></section>`;
  PBP.then((X) => {
    if (!X.shots.length) return fallback("ESPN's play-by-play has no charted shot locations for his games.");
    renderShotChart(document.getElementById("shot"), shotProfile(X, { id: P.id, season: D.pbp.label, team: D.pbp.school, teamShort: D.pbp.teamShort, confShort: D.pbp.confShort }));
  }).catch((e) => fallback(`ESPN play-by-play unavailable right now (${esc(e.message || e)}). Reload to try again.`));
})();

// ======================================================= PLAYMAKING & DEFENSE (mockup)
(function playmakingDefense() {
  const el = document.getElementById("s-pd");
  const mods = D.modules;
  if (mods.length) {
    el.innerHTML = `<iframe class="mod" id="mod" src="${mods[0].src}" title="${esc(mods[0].title)}" scrolling="no"></iframe>`;
    const f = document.getElementById("mod");
    const fit = () => { try { f.style.height = f.contentDocument.documentElement.scrollHeight + "px"; } catch {} };
    f.onload = () => { fit(); setTimeout(fit, 500); setTimeout(fit, 1500); setTimeout(fit, 3000); };
    addEventListener("resize", fit);
    return;
  }
  if (!last) return;
  el.innerHTML = `
  <section><div class="shead"><h2>Playmaking</h2><span class="label">Usage · creation · ball security</span></div>
    <div class="grid two" style="grid-template-columns:1.15fr 1fr"><div class="panel"><div class="label ptitle">Profile vs D-I · ${last.season}</div>
      ${profileTable(last, [["apg", "Assists / g", f1], ["ato", "AST / TO", fx2], ["topg", "Turnovers / g", f1], ["mpg", "Minutes / g", f1]])}</div>
    <div class="panel"><div class="label ptitle">Coming with the database</div><div class="story" style="margin-top:0">Usage, assist rate, creation splits and the load-vs-ball-security chart need play-by-play. They fill in for every player when the archive moves into Bronco IQ's database.</div></div></div></section>
  <section><div class="shead"><h2>Defense</h2><span class="label">Individual · box score</span></div>
    <div class="grid two" style="grid-template-columns:1.15fr 1fr"><div class="panel"><div class="label ptitle">Individual profile vs D-I · ${last.season}</div>
      ${profileTable(last, [["spg", "Steals / g", f1], ["bpg", "Blocks / g", f1], ["rpg", "Rebounds / g", f1]])}</div>
    <div class="panel"><div class="label ptitle">Coming with the database</div><div class="story" style="margin-top:0">The DEF score, defensive RAPM and on/off splits come from replayed lineup stints. They fill in once play-by-play is loaded.</div></div></div></section>`;
})();

// ======================================================= SEASON BY SEASON
(function seasons() {
  if (!S.length) return;
  const el = document.getElementById("s-seasons");
  const tot = S.reduce((a, s) => { for (const k of ["gp", "gs", "points", "rebounds", "assists", "steals", "blocks", "turnovers", "fgm", "fga", "three_pm", "three_pa", "ftm", "fta"]) a[k] = (a[k] || 0) + (+s[k] || 0); a.min = (a.min || 0) + (+s.mpg || 0) * (+s.gp || 0); return a; }, {});
  const ct = (s, k) => chip(pctOf(s, k), f1(s.d[k]));
  const schools = new Set(S.map((s) => s.school)).size;
  el.innerHTML = `<section><div class="shead"><h2>Season by season</h2><span class="label">Per game · transfers tagged · chips = percentile within that season</span></div>
  <div class="panel scroll" style="margin-top:14px"><table><thead>
    <tr><th class="l" colspan="2"></th><th class="grp sep" colspan="4">Role</th><th class="grp sep" colspan="6">Per game</th><th class="grp sep" colspan="6">Shooting</th></tr>
    <tr><th class="l">Season</th><th class="l">School</th><th class="sep"><span data-def="gp">GP</span></th><th><span data-def="gs">GS</span></th><th><span data-def="mpg">MPG</span></th><th><span data-def="pts40">Pts/40</span></th>
    <th class="sep"><span data-def="ppg">PTS</span></th><th><span data-def="rpg">REB</span></th><th><span data-def="apg">AST</span></th><th><span data-def="spg">STL</span></th><th><span data-def="bpg">BLK</span></th><th><span data-def="topg">TOV</span></th>
    <th class="sep"><span data-def="fg">FG%</span></th><th><span data-def="p3">3P</span></th><th><span data-def="ft">FT%</span></th><th><span data-def="tpar">3PAr</span></th><th><span data-def="ts">TS%</span></th><th><span data-def="efg">eFG%</span></th></tr></thead><tbody>
    ${S.map((s, i) => { const moved = i > 0 && S[i - 1].school !== s.school; return `<tr class="${i === S.length - 1 ? "hl" : ""}"><td class="l" style="font-weight:600">${s.season}</td><td class="l m">${esc(shortSchool(s.school))}${moved ? ' <span class="tag new">TRANSFER</span>' : ""}</td>
      <td class="sep m">${s.gp}</td><td class="m">${s.gs ?? "—"}</td><td>${ct(s, "mpg")}</td><td>${ct(s, "pts40")}</td>
      <td class="sep">${ct(s, "ppg")}</td><td>${f1(s.rpg)}</td><td>${f1(s.apg)}</td><td>${f1(s.spg)}</td><td>${f1(s.bpg)}</td><td>${f1(s.topg)}</td>
      <td class="sep">${f1(s.fg_pct)}</td><td>${!s.three_pa ? `<span class="m">—</span>` : `${s.d.p3 != null ? chip(pctOf(s, "p3"), f1(s.three_pct)) : `<span class="m">${f1(s.three_pct)}</span>`} <span class="m" style="font-size:10.5px">${f0(s.three_pm)}/${f0(s.three_pa)}</span>`}</td><td>${f1(s.ft_pct)}</td><td class="m">${f1(s.d.tpar)}</td><td>${ct(s, "ts")}</td><td>${f1(s.efg_pct)}</td></tr>`; }).join("")}
    ${S.length > 1 ? (() => { const g = tot.gp || 1, ts = tot.fga + 0.44 * tot.fta > 0 ? (tot.points / (2 * (tot.fga + 0.44 * tot.fta))) * 100 : null;
      return `<tr class="total"><td class="l">Career</td><td class="l m">${schools} school${schools > 1 ? "s" : ""}</td><td class="sep m">${tot.gp}</td><td class="m">${tot.gs}</td><td>${f1(tot.min / g)}</td><td>${f1(tot.min ? (tot.points / tot.min) * 40 : null)}</td>
      <td class="sep">${f1(tot.points / g)}</td><td>${f1(tot.rebounds / g)}</td><td>${f1(tot.assists / g)}</td><td>${f1(tot.steals / g)}</td><td>${f1(tot.blocks / g)}</td><td>${f1(tot.turnovers / g)}</td>
      <td class="sep">${f1(tot.fga ? (tot.fgm / tot.fga) * 100 : null)}</td><td>${f1(tot.three_pa ? (tot.three_pm / tot.three_pa) * 100 : null)} <span class="m" style="font-size:10.5px">${tot.three_pm}/${tot.three_pa}</span></td><td>${f1(tot.fta ? (tot.ftm / tot.fta) * 100 : null)}</td><td class="m">${f1(tot.fga ? (tot.three_pa / tot.fga) * 100 : null)}</td><td>${f1(ts)}</td><td>${f1(tot.fga ? ((tot.fgm + 0.5 * tot.three_pm) / tot.fga) * 100 : null)}</td></tr>`; })() : ""}
    </tbody></table><div class="cap">${PIPE ? "D-I games only (our play-by-play pipeline), so totals can be a little below ESPN's." : "Season totals include every game ESPN logged (non-D-I opponents too)."} Chips need 8+ games and 8+ minutes per game; 3P% chips need 40+ attempts.</div></div></section>`;
})();

// ======================================================= GAME LOG
(function gamelog() {
  if (!P.espnId) return;
  const el = document.getElementById("s-games");
  const seasons = [...new Set(S.map((s) => s.season))];
  if (!seasons.includes("2026-27") && (P.onRoster || PIPE)) seasons.push("2026-27");
  let cur = last && seasons.includes(last.season) ? last.season : seasons[seasons.length - 1];
  el.innerHTML = `<section><div class="shead"><h2>Game log</h2><span class="label" id="glsub">ESPN box scores</span><div class="seg" style="margin-left:auto" id="glseas">${seasons.map((s) => `<button data-s="${s}">${s.slice(2)}</button>`).join("")}</div></div>
    <div class="panel glchart" style="margin-top:14px" id="glc"><div class="loading">Loading…</div></div><div class="panel scroll" style="margin-top:12px" id="glt"></div></section>`;
  const load = async () => {
    el.querySelectorAll("#glseas button").forEach((b) => b.classList.toggle("on", b.dataset.s === cur));
    document.getElementById("glc").innerHTML = `<div class="loading">Loading ${cur}…</div>`;
    document.getElementById("glt").innerHTML = "";
    let G;
    // Server first; ESPN turns the server away at times, so then the browser asks ESPN directly.
    try { G = (await getJSON(`/api/gamelog/${encodeURIComponent(P.id)}?season=${cur}`)).games; }
    catch (e) {
      const r = await espnGames(P.espnId, [cur]).catch(() => ({ games: [], failed: true }));
      if (r.failed || !r.games.length && r.errors?.length) { document.getElementById("glc").innerHTML = `<div class="loading">ESPN game log unavailable right now (${esc(e.message)}).</div>`; return; }
      G = r.games.filter((g) => !g.season || g.season === cur).map((g) => ({ pf: 0, ...g })).sort((a, b) => a.date.localeCompare(b.date));
    }
    if (!G.length) { document.getElementById("glc").innerHTML = `<div class="loading">No games logged for ${cur} yet.</div>`; return; }
    for (const g of G) g.gs = g.pts + 0.4 * g.fgm - 0.7 * g.fga - 0.4 * (g.fta - g.ftm) + 0.5 * g.reb + g.stl + 0.7 * g.ast + 0.7 * g.blk - 0.4 * g.pf - g.to;
    const sorted = G.map((g) => g.gs).sort((a, b) => a - b), rank = (v) => Math.round(((sorted.filter((x) => x < v).length + 0.5 * sorted.filter((x) => x === v).length) / sorted.length) * 100);
    document.getElementById("glsub").textContent = `${G.length} games · ${f1(d3.mean(G, (g) => g.pts))} ppg · bars = game score`;
    const W = 1180, H = 200, m = { t: 14, b: 40, l: 30, r: 8 };
    const x = d3.scaleBand(G.map((g) => g.id), [m.l, W - m.r]).padding(0.2), ext = d3.extent(G, (g) => g.gs), y = d3.scaleLinear([Math.min(0, ext[0]), Math.max(10, ext[1])], [H - m.b, m.t]).nice();
    const svg = d3.select("#glc").html("").append("svg").attr("viewBox", `0 0 ${W} ${H}`);
    y.ticks(4).forEach((v) => { svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(v)).attr("y2", y(v)).attr("stroke", v ? "#2e3034" : "#6b6e75"); svg.append("text").attr("x", m.l - 6).attr("y", y(v) + 3).attr("text-anchor", "end").attr("font-size", 10).attr("fill", "#8a8e95").text(v); });
    G.forEach((g) => {
      const gr = svg.append("g").on("mousemove", (e) => tipOn(e, `<b>${g.date.slice(5, 10)} · ${g.atVs} ${esc(g.opp)}</b> · ${g.result} ${g.tm ?? ""}-${g.op ?? ""}<br>${g.min} min · ${g.pts} pts · ${g.reb} reb · ${g.ast} ast · ${g.to} to<br>${g.fgm}-${g.fga} FG · ${g.tpm}-${g.tpa} 3P · ${g.ftm}-${g.fta} FT<br>Game score ${g.gs.toFixed(1)}`)).on("mouseleave", tipOff);
      gr.append("rect").attr("x", x(g.id)).attr("width", x.bandwidth()).attr("y", y(Math.max(0, g.gs))).attr("height", Math.abs(y(g.gs) - y(0))).attr("rx", 2).attr("fill", pc(rank(g.gs)));
      if (g.oppId) gr.append("image").attr("href", `https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500-dark/${g.oppId}.png&w=40&h=40`).attr("x", x(g.id) + x.bandwidth() / 2 - 8).attr("y", H - m.b + 6).attr("width", 16).attr("height", 16);
      gr.append("text").attr("x", x(g.id) + x.bandwidth() / 2).attr("y", H - m.b + 34).attr("text-anchor", "middle").attr("font-size", 8.5).attr("fill", g.result === "W" ? "#c9ccd2" : "#6b6e75").attr("font-family", "IBM Plex Mono").text(g.result);
    });
    document.getElementById("glt").innerHTML = `<table><thead><tr><th class="l">Date</th><th class="l">Opponent</th><th class="l">Result</th><th><span data-def="min">MIN</span></th><th><span data-def="pts">PTS</span></th><th><span data-def="reb">REB</span></th><th><span data-def="ast">AST</span></th><th><span data-def="stl">STL</span></th><th><span data-def="blk">BLK</span></th><th><span data-def="to">TO</span></th><th class="sep"><span data-def="fgma">FG</span></th><th><span data-def="tpma">3P</span></th><th><span data-def="ftma">FT</span></th><th class="sep"><span data-def="gmsc">GmSc</span></th></tr></thead><tbody>
      ${G.slice().reverse().map((g) => `<tr><td class="l m">${g.date.slice(5, 10)}</td><td class="l"><span style="display:inline-flex;gap:6px;align-items:center"><span class="m" style="width:16px">${g.atVs}</span>${g.oppId ? LG(g.oppId, 16) : ""}${esc(g.opp)}</span></td><td class="l ${g.result === "W" ? "" : "m"}">${g.result} ${g.tm ?? ""}-${g.op ?? ""}</td><td class="m">${g.min}</td><td class="b">${g.pts}</td><td>${g.reb}</td><td>${g.ast}</td><td>${g.stl}</td><td>${g.blk}</td><td>${g.to}</td><td class="sep">${g.fgm}-${g.fga}</td><td>${g.tpm}-${g.tpa}</td><td>${g.ftm}-${g.fta}</td><td class="sep">${chip(rank(g.gs), g.gs.toFixed(1))}</td></tr>`).join("")}</tbody></table>
      <div class="cap">Game-score chips rank each game within his own season (orange = one of his better games, blue = one of his worse).</div>`;
  };
  el.querySelectorAll("#glseas button").forEach((b) => (b.onclick = () => { cur = b.dataset.s; load(); }));
  load();
})();
// ======================================================= TARGETS & TRANSFER BOARD
(async function targets() {
  const { loadTB, openTB, badge } = await import("/assets/tb.js");
  const btn = document.getElementById("tbbtn"), txt = document.getElementById("tbtxt");
  const snap = { name: playerName(P), school: teamName, pos: P.position || "", ht: P.height || "", cls: P.class_year || "", photo: photo ? photo.replace("w=400&h=400", "w=150&h=110") : "", logo: teamId ? `https://a.espncdn.com/i/teamlogos/ncaa/500-dark/${teamId}.png` : "" };
  const show = () => { const B = badge(NKEY), bits = []; for (const [x, w] of [[B.me, "Mine"], [B.staff, "Staff"]]) if (x && (x.target || x.lane)) bits.push(`${w}: ${x.lane ? `${x.lane} · ${x.tier}` : "target"}`); txt.textContent = bits.length ? "✓ " + bits.join(" · ") : "Targets & board"; };
  await loadTB(); show();
  addEventListener("biq-tb", show);
  btn.onclick = () => openTB(btn, [{ id: NKEY, p: snap }]);
})();
// ======================================================= STAFF NOTES (shared across staff, KV)
(function staffNotes() {
  const dr = document.getElementById("ndrawer"), list = document.getElementById("nlist"), add = document.getElementById("nadd"), txt = document.getElementById("ntext"), whoBox = document.getElementById("nauthor"), msg = document.getElementById("nmsg");
  const who = { value: "" };
  const setWho = (v) => { who.value = v; whoBox.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.who === v)); try { localStorage.setItem("biq-note-staff", v); } catch {} ready(); };
  whoBox.onclick = (e) => { const b = e.target.closest("button[data-who]"); if (b) setWho(b.dataset.who); };
  const fmt = (iso) => new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const call = async (body) => { const r = await fetch(`/api/notes/${encodeURIComponent(NKEY)}`, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : { cache: "no-store" }); const d = await r.json(); if (!r.ok) throw new Error(d.error || "Could not save the note."); return d.notes || []; };
  const draw = (N) => {
    document.getElementById("ncount").textContent = N.length || "";
    list.innerHTML = N.length ? N.map((n) => `<div class="snote"><div class="who"><b>${esc(n.author)}</b><span class="m">${fmt(n.at)}</span><button data-del="${esc(n.id)}">Delete</button></div><p>${esc(n.body)}</p></div>`).join("") : `<div class="m" style="padding:12px 0;color:var(--muted)">No staff notes yet.</div>`;
    list.querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => { if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Click again to delete"; return; } try { draw(await call({ remove: b.dataset.del })); } catch (e) { msg.textContent = e.message; } }));
  };
  const ready = () => (add.disabled = !(who.value && txt.value.trim()));
  txt.oninput = ready;
  try { const a = localStorage.getItem("biq-note-staff"); if (a && STAFF.includes(a)) setWho(a); } catch {}
  import("/assets/core.js").then(({ me }) => me()).then((M) => { if (M.user && STAFF.includes(M.user)) setWho(M.user); });
  add.onclick = async () => { add.disabled = true; msg.textContent = "Saving…"; try { draw(await call({ author: who.value, body: txt.value.trim() })); txt.value = ""; msg.textContent = "Saved. Today's date is logged with the note."; } catch (e) { msg.textContent = e.message; } ready(); };
  document.getElementById("nbtn").onclick = () => { dr.hidden = false; if (who.value) txt.focus(); };
  document.getElementById("nclose").onclick = () => (dr.hidden = true);
  addEventListener("keydown", (e) => { if (e.key === "Escape") dr.hidden = true; });
  call().then(draw).catch(() => (list.innerHTML = `<div class="m" style="color:var(--muted)">Couldn't load notes.</div>`));
})();
</script>
