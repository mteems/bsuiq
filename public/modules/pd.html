<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playmaking & Defense · Bronco IQ module</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter-tight@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
<style>
/* Same layout and styles as DWT's hand-built module (pd-espn-5107273.html), filled from data.
   SITE CONVENTION: orange = good / high percentile, blue = bad / low percentile */
:root{--bg:#16171a;--panel:#1e1f22;--line:#2e3034;--text:#f2f3f4;--muted:#8a8e95;--good:#e2622a;--bad:#4a7fe0;--ui:'Inter Tight Variable',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-variant-numeric:tabular-nums;padding:0 0 4px;margin:0;overflow:hidden}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
section{margin-top:28px}
.shead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.story{margin-top:10px;font-size:14px;color:#cfd3d9;line-height:1.55;max-width:980px}
.story b{color:var(--text)}
.grid{display:grid;gap:16px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.ptitle{margin-bottom:12px}
.cap{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.55}
[data-def]{cursor:help;text-decoration:underline dotted rgba(138,142,149,.6);text-underline-offset:3px}
svg [data-def]{text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:7px 6px;border-bottom:1px solid #2a2c30;text-align:right;font-weight:500;white-space:nowrap}
td:first-child{font-weight:400;color:#d6d8db}
td.med{color:var(--muted);font-weight:400}
.chip{display:inline-block;min-width:38px;text-align:center;border-radius:4px;padding:2px 6px;font-family:var(--mono);font-size:11.5px;font-weight:500;color:#fff}
.big{font-size:15px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#26282c;border-radius:8px;padding:12px}
.card b{display:block;font-size:24px;font-weight:750;margin-top:4px;letter-spacing:-.01em}
.card .sub{font-size:11.5px;color:#b9bdc4;margin-top:4px;line-height:1.45}
.card .sub em{font-style:normal;color:var(--text);font-weight:600}
.mbar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin-top:8px}
.mleg{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;gap:6px;flex-wrap:wrap}
.arcgrid{display:grid;gap:12px}
.arcgrid svg{width:100%;display:block;background:#26282c;border-radius:8px}
#tip{position:fixed;pointer-events:none;background:#0f1011;border:1px solid #3a3d42;border-radius:6px;padding:8px 10px;font-size:12px;display:none;z-index:5;line-height:1.5;max-width:300px;color:#dfe2e6}
#tip b{color:#fff}
.score{display:flex;gap:22px;align-items:center}
.ring{width:140px;height:140px;flex:none}
.comp{display:grid;grid-template-columns:130px 40px 1fr 56px;gap:8px;align-items:center;font-size:12.5px;padding:5px 0;border-bottom:1px solid #2a2c30}
.comp .z{height:10px;position:relative;background:#2a2c30;border-radius:3px}
.comp .z s{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#5d6168}
.comp .z i{position:absolute;top:0;bottom:0;border-radius:3px}
.tier{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:3px 8px;border-radius:4px;margin-top:6px}
.tiers{display:flex;gap:4px;margin-top:10px}
.tiers div{flex:1;font-family:var(--mono);font-size:9.5px;text-align:center;padding:4px 0;border-radius:3px;color:#fff}
.wait{color:var(--muted);font-size:12px;padding:30px 0;text-align:center}
footer{color:var(--muted);font-size:11px;line-height:1.6;margin-top:22px}
@media (max-width:1060px){.grid{grid-template-columns:1fr!important}.grid>.panel>svg,.grid>div>svg{max-width:760px;display:block;margin-left:auto;margin-right:auto}}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr}.arcgrid{grid-template-columns:1fr 1fr!important}.panel{overflow-x:auto}}
</style>
</head>
<body>
<div id="root"><div class="wait">Loading playmaking & defense…</div></div>
<div id="tip"></div>
<script type="module">
import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
import { pdPBP, gameLabel } from "/assets/pd-pbp.js";
const GOOD="#e2622a",BAD="#4a7fe0",NEU="#5d6168",GOOD_T="#f08a5d",BAD_T="#7fa6f0";
const pc=p=>p==null?NEU:p>=50?d3.interpolateLab(NEU,"#d4561f")(Math.min(1,(p-50)/45)):d3.interpolateLab(NEU,"#2f63d6")(Math.min(1,(50-p)/45));
const chip=p=>p==null?`<span class="chip" style="background:#2a2c30;color:var(--muted)">—</span>`:`<span class="chip" style="background:${pc(p)}">${p}</span>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const f1=v=>v==null?"—":v.toFixed(1),f2=v=>v==null?"—":v.toFixed(2),f0=v=>v==null?"—":Math.round(v).toLocaleString();
const sg=(v,d=1)=>v==null?"—":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d);
const ord=n=>{n=Math.round(n);const s=["th","st","nd","rd"],v=n%100;return n.toLocaleString()+(s[(v-20)%10]||s[v]||s[0])};
const pctS=(a,b)=>b?Math.round(100*a/b):null;

const id=new URLSearchParams(location.search).get("id")||"";
const root=document.getElementById("root");
let D;
try{const r=await fetch("/data/pd/"+encodeURIComponent(id)+".json");if(!r.ok)throw new Error(r.status);D=await r.json();}
catch(e){root.innerHTML=`<div class="wait">No playmaking & defense data for this player yet.</div>`;throw e;}

// ---------------------------------------------------------------- labels
const ROLEAB={"Combo G":"CG","Wing G":"WG","Wing F":"WF","Pure PG":"PPG","Scoring PG":"SPG","Stretch 4":"S4","PF/C":"PF/C","C":"C"};
const RA=ROLEAB[D.role]||D.role, CS=D.confShort||D.conf, TS=D.teamShort, N=D.poolN.toLocaleString(), yy=D.arcYears, lastY=yy[3];
const noun=/PG|G$/.test(D.role)?"guard":/Wing F|Stretch/.test(D.role)?"forward":/C/.test(D.role)?"big":"player";
const pmRow=k=>D.PM.find(r=>r[0]===k), dmRow=k=>D.DM.find(r=>r[0]===k);
const hasT=D.torvik&&D.PM.length;

// ---------------------------------------------------------------- tooltips
const DEF={
 usg:["Usage rate","Share of team possessions he ends (shot, FT trip or turnover) while on the floor. ~20% is average."],
 ast:["Assist rate (AST%)","Share of teammates' made field goals he assisted while on the floor."],
 astg:["Assists per game","Raw assists per game. Depends on minutes and pace, so AST% is the cleaner measure."],
 atr:["Assist-to-turnover ratio","Assists divided by turnovers."],
 tov:["Turnover rate (TOV%)","Turnovers per 100 of his plays (FGA + 0.44 × FTA + TO). Lower is better."],
 passidx:["Pass-first index","AST% ÷ usage. Higher = more of his on-ball load turns into assists rather than his own shots. A playmaker-vs-scorer lean, not a quality grade."],
 tovband:["TOV% vs usage peers",`His turnover rate ranked only against D-I players with similar usage (${D.band?D.band.join("–")+"%":"±3 points"}). High usage normally means more turnovers, so this is the fair comparison.`],
 ptscr:["Points created per 40","His own points plus points from shots he assisted, per 40 minutes."],
 ptshare:["Share of team points",`Share of ${TS}'s points while he was on the floor that he either scored or assisted on.`],
 ppa:["Points per assist","Average points produced by a shot he assisted. 3.0 = every assist set up a three."],
 live:["Live-ball turnovers","Turnovers logged as an opponent steal. They usually lead to transition chances, which are the costliest kind of turnover. Roughly half of D-I turnovers are steals."],
 playmix:["How his plays end","Of every play he finished: shot attempt, free-throw trip (0.44 × FTA), assist or turnover."],
 selfc:["Self-created makes","Made shots with no assist logged. Unassisted makes are mostly off the dribble (also putbacks and transition). Assisted makes are mostly catch-and-shoot."],
 rapm:["RAPM","Regularized adjusted plus-minus. A regression on every lineup stint of the season that estimates each player's effect on points per 100 possessions, holding the other 9 players on the floor constant. It's 'regularized' because estimates are shrunk toward 0 (average) so small samples can't run wild."],
 drapm:["Defensive RAPM (DRAPM)",`Points per 100 opponent possessions a player saves vs an average D-I player, after accounting for all teammates and opponents on the floor. Positive = good. 1 SD ≈ 2.7. Bronco IQ ridge model, ${D.season}.`],
 orapm:["Offensive RAPM (ORAPM)","Points per 100 possessions a player adds on offense vs an average D-I player, after accounting for all teammates and opponents on the floor. 1 SD ≈ 2.6."],
 defscore:["DEF score (v2)",`Bronco IQ 1–100 percentile of defensive impact among ${N} D-I rotation players. Weights: DBPM 25%, Adj DRtg 15% (both with team credit cut in half), defensive RAPM 20%, STL% 13%, BLK% 10%, DRB% 10%, fouls −7%. Each stat is compared within the player's role, then shrunk for minutes.`],
 drtg:["Defensive rating (DRtg)","Estimated points allowed per 100 possessions while he's on the floor (Dean Oliver method: stops, steals, blocks, defensive rebounds and team defense). Lower is better."],
 adrtg:["Adjusted DRtg","DRtg adjusted for opponent strength (Torvik). Lower is better. * = in DEF score, half of the team-wide component is removed (team halo damping)."],
 dbpm:["Defensive box plus-minus (DBPM)","Estimated defensive points per 100 possessions vs an average D-I player, from box score stats plus a team-defense adjustment. 0 = average, +2 = good, +4 = elite. * = team halo damped 50% in DEF score."],
 stl:["Steal rate (STL%)","Share of opponent possessions that end in his steal while he's on the floor."],
 stlg:["Steals per game","Raw steals per game."],
 drb:["Defensive rebound rate (DRB%)","Share of available defensive rebounds he grabs while on the floor."],
 pf:["Fouls per 40","Personal fouls per 40 minutes. Lower is better: fouls give away free throws and minutes."],
 blk:["Block rate (BLK%)","Share of opponent 2-point attempts he blocks while on the floor."],
 onoff:["On/off","The team's numbers with him on the floor vs off it, from replaying every substitution. Doesn't account for teammates or opponents; RAPM does."],
 opp100:["Opponent points per 100","Points allowed per 100 opponent possessions (possessions = FGA − ORB + TOV + 0.44 × FTA)."],
 oefg:["Opponent eFG%","Opponent field-goal % with threes worth 1.5×."],
 otov:["Opponent TO%","Share of opponent possessions ending in a turnover. Higher is better for the defense."],
 oorb:["Opponent ORB%","Share of their own misses the opponent rebounds. Lower is better for the defense."],
 oftr:["Opponent FT rate","Opponent FTA ÷ FGA: how often the defense fouls shooters."],
 orimr:["Opponent rim rate","Share of opponent shots that are layups, dunks or tips."],
 orimp:["Opponent rim FG%","Opponent make rate on layups, dunks and tips."],
 o2p:["Opponent 2P%","Opponent make rate on all twos."],
 o3r:["Opponent 3PA rate","Share of opponent shots that are threes."],
 o3p:["Opponent 3P%","Opponent three-point %. Mostly luck in small samples."]
};
const tip=document.getElementById("tip");
const show=(e,h)=>{tip.style.display="block";const x=Math.min(e.clientX+14,innerWidth-320);tip.style.left=x+"px";tip.style.top=e.clientY+14+"px";tip.innerHTML=h};
const hide=()=>tip.style.display="none";
let custom=false;
document.addEventListener("mousemove",e=>{if(custom)return;const el=e.target.closest&&e.target.closest("[data-def]");if(el&&DEF[el.dataset.def]){const[d,t]=DEF[el.dataset.def];show(e,`<b>${d}</b><br>${t}`)}else hide()});
const tipOn=(e,h)=>{custom=true;show(e,h)}, tipOff=()=>{custom=false;hide()};

// ---------------------------------------------------------------- derived numbers (build data)
const SBm=Object.fromEntries(D.SB.map(([n,t,a])=>[n,{t,a}]));
const tpm=SBm["3PT makes"]||{t:0,a:0},rim=SBm["At-rim makes"]||{t:0,a:0},oth=SBm["Other 2 makes"]||{t:0,a:0};
const unast=D.fgm-(tpm.a+rim.a+oth.a);
const tb=pmRow("tovband"), atrR=pmRow("atr");
const P=D.path, pFirst=P[0], pLast=P[P.length-1];

// ---------------------------------------------------------------- page skeleton
const roleMed=`${esc(D.role)} med`, rolePct=`${esc(RA)} pct`, confPct=`${esc(CS)} pct`;
const head=`<tr><th>Stat</th><th>His</th><th>D-I med</th><th>D-I pct</th><th>${roleMed}</th><th>${rolePct}</th><th>${confPct}</th></tr>`;
const missingYears=yy.filter((y,i)=>!D.torvikYears[i]);
const fromY=yy[D.torvikYears.indexOf(1)];
root.innerHTML=`
<section style="margin-top:28px">
  <div class="shead"><h2>Playmaking</h2><span class="label">Usage · creation · ball security</span></div>
  <div class="story" id="pmStory"></div>
  <div class="grid" style="grid-template-columns:1.15fr 1fr">
    <div class="panel"><div class="label ptitle">Profile vs D-I and peers</div>
      ${hasT?`<table><thead>${head}</thead><tbody id="pmT"></tbody></table>`:`<div class="story" style="margin-top:0">Not on Barttorvik for ${D.season}.</div>`}
      <div class="cap">Chip = percentile rank (100 = best). Deep orange = elite, grey = average, blue = weak. Lower-is-better stats are already flipped. Pool: D-I players with 40%+ of team minutes and 15+ games (${N}). ${esc(D.role)} = ${D.roleN.toLocaleString()} per Torvik role.</div></div>
    <div class="panel"><div class="label ptitle">Creation summary · ${D.gamesDI} D-I games</div>
      <div class="cards" id="cards"></div>
      <div style="margin-top:14px"><span class="label" data-def="playmix">How his plays end</span><div class="mbar" id="mixbar"></div><div class="mleg" id="mixleg"></div></div>
      <div style="margin-top:14px"><span class="label" data-def="selfc">Who created his makes</span><div id="selfbars"></div></div>
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1.9fr 1fr">
    <div class="panel"><div class="label ptitle">Load vs ball security · all ${N} D-I players</div><svg id="scatter" style="width:100%;display:block"></svg></div>
    <div class="panel"><div class="label ptitle">Reading it</div>
      <div class="cards" style="grid-template-columns:1fr" id="readCards"></div>
      <div class="cap">Each grey square counts the D-I players in that spot (brighter = more). Up = fewer turnovers. Dashed lines = D-I medians.${D.band?` Shaded column = his usage band (${D.band.join("–")}%).`:""}</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1.5fr">
    <div class="panel"><div class="label ptitle" id="amapT">Where his assists go</div><div id="amapW"><div class="wait">Reading ESPN play-by-play…</div></div><svg id="amap" style="width:100%;display:block"></svg>
      <div class="mbar" id="amixbar"></div><div class="mleg" id="amixleg"></div></div>
    <div class="panel"><div class="label ptitle">Game log · assists up, turnovers down</div><div id="glogW"><div class="wait">Reading ESPN box scores…</div></div><svg id="glog" style="width:100%;display:block"></svg>
      <div class="cap" id="glogCap"></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="label ptitle">Career arc · playmaking (Torvik, ${esc(D.arcTeams.join(" → "))})</div>
    <div class="arcgrid" id="arcP" style="grid-template-columns:repeat(4,1fr)"></div>
    <div class="cap">Dashed line = ${D.season} D-I median. ${P.length>1?`Orange end dot = improved since ${fromY}, blue = declined.`:""}${missingYears.length?` No ${missingYears.map(y=>"20"+(+y.slice(1)-1)+"-"+y.slice(1)).join(", ")} season on Torvik.`:""}</div></div>
</section>
<section>
  <div class="shead"><h2>Defense</h2><span class="label">Composite · individual · RAPM · on/off · career</span></div>
  <div class="story" id="dfStory"></div>
  <div class="grid" style="grid-template-columns:1fr 1.2fr">
    <div class="panel"><div class="label ptitle"><span data-def="defscore">DEF score</span> · v2</div>
      ${D.def?`<div class="score"><svg class="ring" id="ring" viewBox="0 0 140 140"></svg>
        <div><div class="big">${ord(D.def.rank)} of ${D.def.n.toLocaleString()}</div><span class="tier" id="tierTag"></span>
          <div class="cap" style="margin-top:6px">${esc(D.role)} ${ord(D.def.rolePct)} pct · ${esc(CS)} ${ord(D.def.confRank)} of ${D.def.confN}</div></div></div>
      <div class="tiers" id="tiers"></div>
      <div class="cap" style="margin-top:12px">What moves his score. Bars show standard deviations above or below the average ${esc(D.role.replace(/ G$/," guard").toLowerCase())}; % = weight.</div>
      <div id="comps" style="margin-top:4px"></div>
      <div class="cap">* = team halo damped 50%. The weighted sum is shrunk for minutes (Min% ÷ (Min% + 15)), then ranked against all ${D.def.n.toLocaleString()} players to one decimal.</div>`
      :`<div class="story" style="margin-top:0">No DEF score for ${D.season}: the score ranks rotation players only (40%+ of team minutes on Torvik).</div>`}</div>
    <div class="panel"><div class="label ptitle">Individual profile vs D-I and peers</div>
      ${hasT?`<table><thead>${head}</thead><tbody id="dmT"></tbody></table>`:`<div class="story" style="margin-top:0">Not on Barttorvik for ${D.season}.</div>`}</div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="label ptitle" id="ooT">${esc(TS)} defense · him <span data-def="onoff">on vs off</span> the floor</div>
    <div id="ooW"><div class="wait">Replaying ESPN substitutions…</div></div>
    <div class="grid" style="grid-template-columns:1fr 1.8fr;margin-top:0;display:none" id="ooG">
      <div class="cards" style="grid-template-columns:1fr" id="ooCards"></div>
      <div><svg id="onoff" style="width:100%;display:block"></svg>
        <div class="mleg" style="justify-content:flex-start;gap:14px"><span>● on floor</span><span>○ off floor</span><span style="color:var(--good)">orange = better with him</span><span style="color:var(--bad)">blue = worse</span></div>
        <div class="cap">Opponent 3P% is mostly luck in samples this size, so it's dimmed. These splits explain <em>how</em> the defense changed. RAPM (left) is the better estimate of <em>how much</em> of it was him.</div></div>
    </div></div>
  <div class="panel" style="margin-top:16px"><div class="label ptitle">Career arc · defense (Torvik, ${esc(D.arcTeams.join(" → "))})</div>
    <div class="arcgrid" id="arcD" style="grid-template-columns:repeat(5,1fr)"></div></div>
  <div class="cap" style="margin-top:16px">National, Mountain West and Boise St. DEF score rankings live on the <a href="/rankings#defense" target="_top" style="color:var(--text);text-decoration:underline">Rankings page</a>.</div>
</section>
<footer id="foot"></footer>`;

// ---------------------------------------------------------------- tables
const tbl=(id,L)=>{const el=document.getElementById(id);if(el)el.innerHTML=L.map(([k,n,v,dm,dp,cm,cp,sp])=>`<tr><td><span data-def="${k}">${n}</span></td><td style="color:${dp==null||Math.abs(dp-50)<8?'var(--text)':pc(dp)};font-weight:700">${v}</td><td class="med">${dm}</td><td>${chip(dp)}</td><td class="med">${cm}</td><td>${chip(cp)}</td><td>${chip(sp)}</td></tr>`).join("")};
tbl("pmT",D.PM);tbl("dmT",D.DM);

// ---------------------------------------------------------------- creation cards (PBP fills ptscr / ptshare / ppa / live)
function cards(X){
  const c=X?.created, live=X?.live, tos=X?.tos;
  const scor=D.minutes?D.pts/D.minutes*40:null, offA=c&&D.minutes?c.astPts/D.minutes*40:null;
  const share=c&&c.teamPtsOn?(D.pts+c.astPts)/c.teamPtsOn:null;
  const ppa=c?.ppa, liveP=tos?live/tos:null;
  const C=[
    ["ptscr","Pts created / 40",c?f1(scor+offA):"…",c?`<em>${f1(scor)}</em> scoring + <em>${f1(offA)}</em> off his assists`:"reading ESPN play-by-play",null],
    ["ptshare","Share of team pts",share!=null?Math.round(share*100)+"%":"…",share!=null?`of ${esc(TS)} points while he's on: scored or assisted (${f0(D.pts+c.astPts)} of ${f0(c.teamPtsOn)})`:"",null],
    ["ppa","Pts per assist",ppa!=null?f2(ppa):"…",c&&c.astN?`<em>${pctS(c.ast3,c.astN)}%</em> of his assists set up threes (${c.ast3} of ${c.astN})`:"",ppa==null?null:ppa>=2.55?GOOD:ppa<=2.3?BAD:null],
    ["atr","AST / TO",D.tov?f2(D.ast/D.tov):"—",`D-I median ${f2(D.medAtr)} · ${esc(D.role)} ${f2(D.roleAtr)}`,atrR?.[4]==null?null:atrR[4]>=65?GOOD:atrR[4]<=35?BAD:null],
    ["live","Live-ball TOs",liveP!=null?Math.round(liveP*100)+"%":"…",liveP!=null?`<em>${live} of ${tos}</em> turnovers were steals (about half is typical).${liveP>=.58?" These lead straight to opponent breaks.":liveP<=.42?" Mostly dead-ball turnovers, the cheaper kind.":""}`:"",liveP==null?null:liveP>=.58?BAD:liveP<=.42?GOOD:null],
    ["selfc","Self-created makes",D.fgm?Math.round(unast/D.fgm*100)+"%":"—",`of his FGM unassisted (${unast} of ${D.fgm})`,null]];
  document.getElementById("cards").innerHTML=C.map(([k,l,v,s,col])=>`<div class="card"><span class="label" data-def="${k}">${l}</span><b style="color:${col||'var(--text)'}">${v}</b><div class="sub">${s}</div></div>`).join("");
}
cards(null);
const mix=[["Shot",D.fga,"#8a8e95"],["FT trip",Math.round(.44*D.fta),"#c9ccd2"],["Assist",D.ast,GOOD],["Turnover",D.tov,BAD]],mt=d3.sum(mix,d=>d[1])||1;
document.getElementById("mixbar").innerHTML=mix.map(([n,c,f])=>`<div style="width:${c/mt*100}%;background:${f}"></div>`).join("");

  if(D.drapm!=null){t+=` RAPM credits each player separately from the teammates and opponents he shared the floor with. It puts his defense at <b>${sg(D.drapm)} pts/100</b>${rp!=null?` (${ord(rp)} pct)`:""}`;
    if(gap!=null&&Math.abs(gap)>=3){const rawGood=gap<0,rapGood=D.drapm>0;
      t+=rawGood===rapGood?(Math.abs(gap)>2*Math.abs(D.drapm)?`, much milder than ${esc(TS)}'s raw ${sg(gap)} on/off gap. Part of that gap came from who he played with, not him.`:`, in line with ${esc(TS)}'s raw ${sg(gap)} on/off gap.`)
        :`, while ${esc(TS)}'s raw on/off gap points the other way (${sg(gap)}). On/off doesn't adjust for teammates or opponents.`;}
    else t+=".";}
  const avg=[["stl","Steals"],["adrtg","Adj DRtg"],["drb","Rebounding"],["blk","Blocks"]].filter(([k])=>Z[k]!=null&&Math.abs(Z[k])<.3).map(([,l])=>l).slice(0,2);
  if(avg.length)t+=` ${list(avg)} ${avg.length>1?"are":"is"} about average.`;
  t+=` These numbers don't measure on-ball defense; that needs film or Synergy.`;
  document.getElementById("dfStory").innerHTML=t;
}
pmStory(null);dfStory(null);
const foot=X=>document.getElementById("foot").innerHTML=`Sources: Barttorvik player advanced stats (pool = 40%+ team minutes, 15+ games, n = ${N}), our play-by-play pipeline (D-I games: creation splits, RAPM) and ESPN play-by-play (public game feed: assist map, game log, on/off).${X?.onoff?` Player-page on/off covers his ${X.onoff.games} D-I games.`:""} Possessions = FGA − ORB + TOV + 0.44 × FTA. Creation numbers use D-I games only (${D.fga} FGA${X?.created?`, ${X.created.astN} charted assists`:""}).`;
foot(null);

// ---------------------------------------------------------------- ESPN play-by-play
const fit=()=>{try{const f=frameElement;if(f)f.style.height=document.documentElement.scrollHeight+"px"}catch{}};
fit();
let X=null;
if(D.espn&&D.teamEspn){
  try{
    const d1=new Set(await fetch("/data/pd/_d1.json").then(r=>r.json()));
    X=await pdPBP({espn:D.espn,team:D.teamEspn,season:D.year,d1});
  }catch(e){console.warn("pbp",e);}
}
const G=X?.games||[];
const lab=g=>gameLabel(g,CS);
// assist map
(function(){
  const AC=X?.assists||[];
  document.getElementById("amapW").innerHTML=X?(AC.length?"":`<div class="wait">No assists charted.</div>`):`<div class="wait">ESPN play-by-play unavailable right now.</div>`;
  if(!AC.length)return;
  document.getElementById("amapT").textContent=`Where his assists go · ${AC.length} charted`;
  const PX=9,W=50*PX,Hc=35*PX,BX=25,BY=5.25,R3=22.146,C3=21.65,CY=BY+Math.sqrt(R3*R3-C3*C3),Pp=v=>v*PX;
  const svg=d3.select("#amap").attr("viewBox",`0 0 ${W} ${Hc}`);
  svg.append("rect").attr("width",W).attr("height",Hc).attr("fill","#141518").attr("rx",4);
  const L=svg.append("g").attr("fill","none").attr("stroke","rgba(255,255,255,.3)").attr("stroke-width",1.1);
  L.append("rect").attr("x",Pp(19)).attr("y",0).attr("width",Pp(12)).attr("height",Pp(19));
  L.append("path").attr("d",`M${Pp(BX-C3)},0 L${Pp(BX-C3)},${Pp(CY)} A${Pp(R3)},${Pp(R3)} 0 0 0 ${Pp(BX+C3)},${Pp(CY)} L${Pp(BX+C3)},0`);
  L.append("circle").attr("cx",Pp(BX)).attr("cy",Pp(BY)).attr("r",Pp(.75)).attr("stroke","rgba(255,255,255,.6)");
  const col=a=>a[3]==3?"#f2f3f4":a[4]?"#9aa0a8":"#55585e";
  const j=(i,k)=>{const s=Math.sin((i+1)*(k?78.233:12.9898))*43758.5453;return (s-Math.floor(s))-.5};
  svg.append("g").selectAll("circle").data(AC).join("circle").attr("cx",(a,i)=>Pp(Math.min(49.6,Math.max(.4,a[1]+j(i,0)*1.2)))).attr("cy",(a,i)=>Pp(Math.min(34.6,Math.max(.4,a[2]+4.25+j(i,1)*1.2)))).attr("r",4.5).attr("fill",col).attr("opacity",.9).attr("stroke","#141518").attr("stroke-width",.8)
    .on("mousemove",(e,a)=>tipOn(e,`${esc(lab(G[a[0]]))}<br>Assisted ${a[3]}PT${a[4]?" at rim":""}`)).on("mouseleave",tipOff);
  const n3=AC.filter(a=>a[3]==3).length,nr=AC.filter(a=>a[3]!=3&&a[4]).length,no=AC.length-n3-nr;
  const mx=[["3PT",n3,"#f2f3f4"],["At rim",nr,"#9aa0a8"],["Other 2",no,"#55585e"]];
  document.getElementById("amixbar").innerHTML=mx.map(([n,c,f])=>`<div style="width:${c/AC.length*100}%;background:${f}"></div>`).join("");
  document.getElementById("amixleg").innerHTML=mx.map(([n,c,f])=>`<span><span style="color:${f}">■</span> ${n} <b style="color:var(--text)">${Math.round(c/AC.length*100)}%</b> · ${c}</span>`).join("");
})();
// game log
(function(){
  const GL=X?.gl||[];
  document.getElementById("glogW").innerHTML=X?(GL.length?"":`<div class="wait">No games found.</div>`):`<div class="wait">ESPN box scores unavailable right now.</div>`;
  if(!GL.length)return;
  const W=700,Hh=230,m={l:28,r:10,t:12,b:24},mid=128,top=Math.max(9,d3.max(GL,g=>g[2])),bot=Math.max(4,d3.max(GL,g=>g[3])),u=v=>v*Math.min(11,(mid-m.t-6)/top,(Hh-m.b-mid-4)/bot);
  const svg=d3.select("#glog").attr("viewBox",`0 0 ${W} ${Hh}`);
  const x=d3.scaleBand(GL.map(g=>g[0]),[m.l,W-m.r]).padding(.22);
  (top>12?[4,8,12]:[3,6,9]).forEach(v=>{svg.append("line").attr("x1",m.l).attr("x2",W-m.r).attr("y1",mid-u(v)).attr("y2",mid-u(v)).attr("stroke","#2a2c30");svg.append("text").attr("x",m.l-6).attr("y",mid-u(v)+4).attr("text-anchor","end").attr("font-size",10).attr("fill","#6b6e75").text(v)});
  [2,4].forEach(v=>svg.append("text").attr("x",m.l-6).attr("y",mid+u(v)+4).attr("text-anchor","end").attr("font-size",10).attr("fill","#6b6e75").text(v));
  svg.append("line").attr("x1",m.l).attr("x2",W-m.r).attr("y1",mid).attr("y2",mid).attr("stroke","#5d6168");
  GL.forEach(d=>{const gx=x(d[0]),bw=x.bandwidth(),g=G[d[0]];
    svg.append("rect").attr("x",gx).attr("y",mid-u(d[2])).attr("width",bw).attr("height",u(d[2])).attr("fill",GOOD).attr("rx",1.5);
    svg.append("rect").attr("x",gx).attr("y",mid+1).attr("width",bw).attr("height",u(d[3])).attr("fill",BAD).attr("rx",1.5);
    svg.append("rect").attr("x",gx-1).attr("y",m.t).attr("width",bw+2).attr("height",Hh-m.t-m.b).attr("fill","transparent").on("mousemove",e=>tipOn(e,`${esc(lab(g))}${g.di?"":" (non-D-I)"}<br>${d[1]} min · ${d[2]} ast · ${d[3]} to`)).on("mouseleave",tipOff);});
  svg.append("text").attr("x",W-m.r).attr("y",m.t+8).attr("text-anchor","end").attr("font-size",10.5).attr("fill",GOOD).text("ASSISTS ↑");
  svg.append("text").attr("x",W-m.r).attr("y",Hh-m.b-4).attr("text-anchor","end").attr("font-size",10.5).attr("fill",BAD).text("TURNOVERS ↓");
  const firstPost=GL.find(d=>G[d[0]].post), firstConf=GL.find(d=>G[d[0]].conf&&!G[d[0]].post);
  if(firstPost){const s=x(firstPost[0]);svg.append("line").attr("x1",s-3).attr("x2",s-3).attr("y1",m.t).attr("y2",Hh-m.b).attr("stroke","#4a4d53").attr("stroke-dasharray","2 3");
    svg.append("text").attr("x",s).attr("y",Hh-6).attr("font-size",10).attr("fill","#8a8e95").text("POST");}
  if(firstConf)svg.append("text").attr("x",x(firstConf[0])).attr("y",Hh-6).attr("font-size",10).attr("fill","#8a8e95").text(`${CS.toUpperCase()} PLAY →`);
  const nonDI=GL.filter(d=>!G[d[0]].di).length;
  document.getElementById("glogCap").textContent=`${GL.length} games from the ESPN box score${nonDI?` (includes ${nonDI} non-D-I game${nonDI>1?"s":""})`:""}. Hover a game for its line.`;
})();
cards(X);pmStory(X);
// on/off: ESPN replay; if ESPN is unavailable, the lineup stints from our pipeline.
const gap=onoff(X?.onoff||D.onoff||null);
dfStory(gap??null);foot(X);
fit();setTimeout(fit,300);
addEventListener("resize",fit);
</script>
</body>
